[package]
name = "swarmcast-desktop"
version = "0.4.0"
description = "SwarmCast desktop app: window, tray and auto-update around the SwarmCast server"
authors = ["Lucas Angelo"]
license = "MIT"
edition = "2021"
rust-version = "1.80"
publish = false

[build-dependencies]
tauri-build = { version = "^2.7.4", features = [] }

[dependencies]
# Linux: Tauri 2 draws with GTK 3 (gtk-rs 0.18), which locks glib 0.18.x. Dependabot flags it
# (GHSA-wrw7-89jp-8q8g, fixed in glib 0.20: unsound Iterator impls of glib::VariantStrIter). It
# cannot be updated within Tauri 2: tauri 2.12, wry, tao, muda, tray-icon, webkit2gtk 2.0 and
# libappindicator all require gtk ^0.18, and only gtk 0.19 (on glib 0.22) moved on. It is not
# exploitable here: nothing compiled into the app creates a VariantStrIter
# (glib::Variant::array_iter_str), and scripts/test/desktop/glib-advisory.mjs (_node.yml,
# Rust checks) fails the build if that changes. Not compiled on macOS or Windows at all.
tauri = { version = "^2.12.5", features = ["tray-icon", "image-png"] }
tauri-plugin-updater = "^2.14.1"
tauri-plugin-single-instance = "^2.5.4"
tauri-plugin-dialog = "^2.8.3"
tauri-plugin-opener = "^2.7.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The updater's own version type (tauri-plugin-updater compares semver::Version): picks the
# higher of the stable and beta feeds.
semver = "1"
sys-locale = "0.3"
tokio = { version = "1", features = ["time"] }
url = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
signal-hook = "0.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[features]
# Lets the updater use plain http:// endpoints. Only for local update tests
# (scripts/build/desktop.mjs --insecure-updates); release builds never enable it.
insecure-updates = []

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
# Must stay "unwind" (src/main.rs refuses to build otherwise). WebKit throws an Objective-C
# exception ("This task has already been stopped") when a tauri:// or ipc:// response reaches a
# request the page already dropped (it navigated away, e.g. splash -> panel). Tauri answers those
# from a tokio thread, so that race cannot be avoided; wry catches the exception with
# objc2::exception::catch, which cannot work with panic = "abort": the app died instead
# (NSInternalInconsistencyException, macOS). Rust panics still end the app: see the panic hook.
panic = "unwind"
strip = true
