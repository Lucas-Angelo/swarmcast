name: Set up Rust for the desktop app
description: >-
  The Rust toolchain pinned in apps/desktop/src-tauri/rust-toolchain.toml (also made the default),
  the rust-cache for apps/desktop/src-tauri (saved on main only), every crate of its Cargo.lock
  from a saved artifact with cargo offline from then on (./.github/actions/cargo-crates), and on
  Linux the Tauri build dependencies from the job's saved .deb set with apt offline
  (.github/scripts/apt-debs.sh). Run ./.github/actions/setup first, with `apt-debs: tauri-build`
  on Linux, which restores that set. The job needs `actions: read`.

inputs:
  components:
    description: Extra rustup components (comma-separated), e.g. `rustfmt,clippy`.
    default: ''
  targets:
    description: Extra rustup targets (comma-separated), for a cross build such as x86_64-apple-darwin on an Apple silicon runner.
    default: ''
  cache-key:
    description: rust-cache key (one per target and build flavour); empty for no rust-cache.
    default: ''
  cache-as-test-build:
    description: >-
      'true' in the release-flavour desktop builds (a release, a release rehearsal): rust-cache's
      key is computed as a test build's (CARGO_PROFILE_RELEASE_LTO=false and
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS=16, for that one step only), so the build restores the
      entry main saved for that target's test builds, and never saves one. The job's own
      environment, and so cargo's profile, are not changed.
    default: 'false'
  linux-deps:
    description: Linux only. Install the Tauri build dependencies (WebKitGTK 4.1, tray, AppImage tools).
    default: 'true'

runs:
  using: composite
  steps:
    - name: Rust toolchain (rust-toolchain.toml)
      shell: bash
      env:
        COMPONENTS: ${{ inputs.components }}
        TARGETS: ${{ inputs.targets }}
      run: |
        file="$GITHUB_WORKSPACE/apps/desktop/src-tauri/rust-toolchain.toml"
        channel="$(sed -n 's/^channel *= *"\(.*\)"$/\1/p' "$file")"
        [ -n "$channel" ] || { echo "::error file=$file::no channel in rust-toolchain.toml"; exit 1; }
        args=(--profile minimal --no-self-update)
        [ -z "$COMPONENTS" ] || args+=(--component "$COMPONENTS")
        [ -z "$TARGETS" ] || args+=(--target "$TARGETS")
        rustup toolchain install "$channel" "${args[@]}"
        # Also the default: rust-cache computes its key with the default rustc, and the scripts run
        # cargo outside apps/desktop/src-tauri too.
        rustup default "$channel"
    # Saved from main only: pull requests restore main's cache instead of each storing a copy (the
    # repository's 10 GB cache limit). Every CARGO_* variable is part of the key, so set the build
    # profile overrides before this step.
    # A restore that fails is a warning (the build compiles everything instead); its download gives
    # up after 2 minutes. rust-cache runs from a copy fetched with git at its pin
    # (.github/actions/remote-pins), with tries: the runner's own download is not tried again after
    # a 404, and pipeline run 41636784175 lost this job to one, in "Prepare all required actions"
    # of this composite, before any step could run (.github/workflows/README.md, "Remote
    # actions"). One that cannot be fetched is a warning too, and the build compiles everything.
    - name: rust-cache (git fetch, with tries)
      id: rust-cache-action
      if: inputs.cache-key != ''
      uses: ./.github/actions/fetch-remote
      with:
        repos: Swatinem/rust-cache
        optional: 'true'
    - if: inputs.cache-key != '' && steps.rust-cache-action.outputs.fetched == 'true' && inputs.cache-as-test-build != 'true'
      continue-on-error: true
      env:
        SEGMENT_DOWNLOAD_TIMEOUT_MINS: '2'
      uses: ./.git/remote-actions/Swatinem/rust-cache
      with:
        workspaces: apps/desktop/src-tauri -> target
        key: ${{ inputs.cache-key }}
        save-if: ${{ github.ref == 'refs/heads/main' }}
        cache-on-failure: true
    # A release-flavour build has no CARGO_PROFILE_RELEASE_* variables (it builds with Cargo.toml's
    # profile), so its own key never matched an entry and it compiled every crate, twice: for build
    # A (--fast, which desktop.mjs builds with the test profile) and for the installers (fat LTO).
    # Keyed as a test build, it restores main's test-build entry: A then compiles only the app's
    # own crate, as in a pull request; the installers' build still compiles what fat LTO needs
    # (cargo's fingerprints keep the two profiles apart). The two variables are this step's only:
    # rust-cache reads them for its key, and cargo never sees them. Never saved: the entry is a
    # test build's, written only by main's test builds (README.md, "Caches").
    - name: rust-cache (keyed as the test build, release flavour)
      if: inputs.cache-key != '' && steps.rust-cache-action.outputs.fetched == 'true' && inputs.cache-as-test-build == 'true'
      continue-on-error: true
      env:
        SEGMENT_DOWNLOAD_TIMEOUT_MINS: '2'
        CARGO_PROFILE_RELEASE_LTO: 'false'
        CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
      uses: ./.git/remote-actions/Swatinem/rust-cache
      with:
        workspaces: apps/desktop/src-tauri -> target
        key: ${{ inputs.cache-key }}
        save-if: 'false'
        cache-on-failure: true
    # After rust-cache: CARGO_NET_OFFLINE, which this sets, is a CARGO_* variable and so would
    # change rust-cache's key; and the crates go over what rust-cache restored. Before any cargo
    # command of the job: from here on, cargo never asks crates.io (README.md, "Rust crates").
    - name: Rust crates (saved artifact, then cargo offline)
      uses: ./.github/actions/cargo-crates
    # Tauri v2 build prerequisites on Linux, from the job's saved .deb set with apt offline (no
    # apt-get update, no download); the Ubuntu archive only when that set does not fit this runner
    # image, and then a failure says it is the archive (.github/scripts/apt-debs.sh).
    - name: Linux build dependencies
      if: runner.os == 'Linux' && inputs.linux-deps == 'true'
      shell: bash
      run: |
        deps=(build-essential pkg-config libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev file xz-utils)
        "$GITHUB_WORKSPACE/.github/scripts/apt-debs.sh" install "${deps[@]}"
