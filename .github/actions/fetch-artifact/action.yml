name: Download artifacts, with diagnostics and a REST fallback
description: >-
  actions/download-artifact, tried twice 30 s apart; after each failed try, diagnostics that name
  the cause (rest.sh diagnose); after the second, the same artifacts through the REST API with
  curl, resumed and checked against the SHA-256 digest recorded at upload (rest.sh fetch), logged
  as an infra-recovery warning. download-artifact alone names nothing ("Artifact download failed
  after 5 retries."; the cause is in its debug log only), and once one runner's download of one
  artifact started failing, it failed the same way for 3.5 minutes (pipeline run 41199245404: 15
  attempts, 14 of them over within milliseconds, too fast to have reached the blob storage).
  download-artifact itself runs from a copy fetched with git (./.github/actions/fetch-remote); when
  that cannot be fetched, the REST fallback runs straight away. Same inputs as download-artifact;
  the job needs `actions: read` (the REST API). .github/workflows/README.md, "Artifact downloads"
  and "Remote actions".

inputs:
  name:
    description: One artifact by name (or use pattern).
    default: ''
  pattern:
    description: A glob of artifact names (*, ? and {a,b}).
    default: ''
  path:
    description: Where to put the files.
    required: true
  merge-multiple:
    description: With pattern, extract every artifact into path itself.
    default: 'false'
  run-id:
    description: Another run's artifacts (needs github-token).
    default: ''
  github-token:
    description: Token for run-id.
    default: ''

runs:
  using: composite
  steps:
    # download-artifact runs from a copy fetched with git at its pin (.github/actions/remote-pins),
    # with tries: the runner's own download of a remote action is not tried again after a 404
    # (.github/workflows/README.md, "Remote actions"). If it cannot be fetched, the REST fallback
    # downloads the artifacts.
    - name: download-artifact (git fetch, with tries)
      id: action
      uses: ./.github/actions/fetch-remote
      with:
        repos: actions/download-artifact
        optional: 'true'
    - id: try1
      if: steps.action.outputs.fetched == 'true'
      continue-on-error: true
      uses: ./.git/remote-actions/actions/download-artifact
      with:
        name: ${{ inputs.name }}
        pattern: ${{ inputs.pattern }}
        path: ${{ inputs.path }}
        merge-multiple: ${{ inputs.merge-multiple }}
        run-id: ${{ inputs.run-id }}
        github-token: ${{ inputs.github-token }}
    - if: steps.try1.outcome == 'failure'
      shell: bash
      env:
        NAME: ${{ inputs.name }}
        PATTERN: ${{ inputs.pattern }}
        DEST: ${{ inputs.path }}
        MERGE: ${{ inputs.merge-multiple }}
        RUN_ID: ${{ inputs.run-id || github.run_id }}
        REPO: ${{ github.repository }}
        TOKEN: ${{ inputs.github-token || github.token }}
      run: |
        echo "::warning::artifact download failed (try 1 of 2); diagnostics, then a retry in 30 s"
        bash "$GITHUB_ACTION_PATH/rest.sh" diagnose 1
        sleep 30
    - id: try2
      if: steps.try1.outcome == 'failure'
      continue-on-error: true
      uses: ./.git/remote-actions/actions/download-artifact
      with:
        name: ${{ inputs.name }}
        pattern: ${{ inputs.pattern }}
        path: ${{ inputs.path }}
        merge-multiple: ${{ inputs.merge-multiple }}
        run-id: ${{ inputs.run-id }}
        github-token: ${{ inputs.github-token }}
    - if: steps.try2.outcome == 'failure' || steps.action.outputs.fetched != 'true'
      shell: bash
      env:
        NAME: ${{ inputs.name }}
        PATTERN: ${{ inputs.pattern }}
        DEST: ${{ inputs.path }}
        MERGE: ${{ inputs.merge-multiple }}
        RUN_ID: ${{ inputs.run-id || github.run_id }}
        REPO: ${{ github.repository }}
        TOKEN: ${{ inputs.github-token || github.token }}
        NO_ACTION: ${{ steps.action.outputs.fetched != 'true' }}
      run: |
        if [ "$NO_ACTION" = true ]; then
          echo "::warning::download-artifact could not be fetched; the REST fallback"
        else
          echo "::warning::artifact download failed (try 2 of 2); diagnostics, then the REST fallback"
          bash "$GITHUB_ACTION_PATH/rest.sh" diagnose 2
        fi
        bash "$GITHUB_ACTION_PATH/rest.sh" fetch
