name: Save the SwarmCast setup caches
description: >-
  Last step of a job that used ./.github/actions/setup: saves the caches it restored and the job
  filled (pinned downloads, pkg's Node.js binaries, downloaded .debs), on main only and only when
  they were missing. Pull requests restore main's caches instead of each storing its own copy
  (the repository's 10 GB cache limit).

runs:
  using: composite
  steps:
    # pkg's binaries exist only in jobs that ran package.mjs.
    - name: What the job filled
      id: filled
      if: github.ref == 'refs/heads/main'
      shell: bash
      run: |
        has() { [ -d "$1" ] && [ -n "$(find "$1" -type f -print -quit)" ] && echo true || echo false; }
        echo "downloads=$(has "$RUNNER_TEMP/sc-cache/downloads")" >> "$GITHUB_OUTPUT"
        echo "pkg=$(has "$RUNNER_TEMP/sc-cache/pkg")" >> "$GITHUB_OUTPUT"
    - name: Save the download cache
      if: github.ref == 'refs/heads/main' && env.SC_DL_CACHE_KEY != '' && env.SC_DL_CACHE_HIT != 'true' && steps.filled.outputs.downloads == 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/sc-cache/downloads
        key: ${{ env.SC_DL_CACHE_KEY }}
    - name: Save the pkg cache
      if: github.ref == 'refs/heads/main' && env.SC_PKG_CACHE_KEY != '' && env.SC_PKG_CACHE_HIT != 'true' && steps.filled.outputs.pkg == 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/sc-cache/pkg
        key: ${{ env.SC_PKG_CACHE_KEY }}
    - name: Save the .deb cache
      if: github.ref == 'refs/heads/main' && env.SC_APT_DEBS_KEY != '' && env.SC_APT_DEBS_HIT != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/apt-debs/*.deb
        key: ${{ env.SC_APT_DEBS_KEY }}
