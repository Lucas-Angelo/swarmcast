name: Save the SwarmCast setup caches
description: >-
  Last step of a job that used ./.github/actions/setup: saves the caches the job added or changed
  files in (pinned downloads with pkg's Node.js base binary, the Tauri tools on Windows, the .deb
  set, the Rust toolchain's saved copy).
  On main only, so pull requests restore main's caches instead of each storing its own copy (the
  repository's 10 GB cache limit), except the pinned-downloads cache, which pull requests save
  too (see below). Never fatal: a save that fails is a warning. Call it with
  `if: !cancelled() && (main or pull_request)`, `continue-on-error: true` and a short
  `timeout-minutes`, so on other events it is not even entered and a hung cache service cannot
  take the job's time.

runs:
  using: composite
  steps:
    # A new entry only when the job added files to what it restored or changed one of them
    # (.github/scripts/cache-files.mjs): a job that added nothing (an exact hit, or a job that failed before its downloads) saves
    # nothing, and the newest entry, which the next restore takes, always holds what it restored.
    - name: What the job added to the caches
      id: added
      if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
      shell: bash
      run: |
        plan() { node "$GITHUB_WORKSPACE/.github/scripts/cache-files.mjs" plan "$@"; }
        if [ -n "${SC_DL_CACHE_KEY:-}" ]; then
          plan dl "$RUNNER_TEMP/sc-cache/downloads" "$RUNNER_TEMP/sc-cache/downloads.restored" "$SC_DL_CACHE_KEY"
        fi
        if [ -n "${SC_TAURI_TOOLS_KEY:-}" ] && [ "$GITHUB_REF" = refs/heads/main ]; then
          plan tauri-tools "$SC_TAURI_TOOLS_DIR" "$RUNNER_TEMP/tauri-tools.restored" "$SC_TAURI_TOOLS_KEY"
        fi
    # actions/cache/save runs from a copy fetched with git at its pin (.github/actions/remote-pins;
    # the job's setup or a cache restore fetched it already, as a rule): the runner's own download
    # of a remote action is not tried again after a 404 (.github/workflows/README.md, "Remote
    # actions"). One that cannot be fetched skips the saves, with a warning.
    - name: actions/cache (git fetch, with tries)
      id: cache-action
      if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
      uses: ./.github/actions/fetch-remote
      with:
        repos: actions/cache
        optional: 'true'
    # Also from pull requests: some publishers are very slow from GitHub's runners (the macOS
    # ffmpeg at 10-30 kB/s), so a pull request pays one slow download and its later runs restore
    # it. Safe to take from a pull request: the entries are the pinned files themselves, and
    # fetch-binaries.mjs checks sha256(cached file) against scripts/build/versions.json before it
    # uses one (a wrong file is ignored, downloaded again and replaced). Small: tens of MB per runner OS.
    - name: Save the download cache
      if: steps.added.outputs.dl-key != '' && steps.cache-action.outputs.fetched == 'true'
      continue-on-error: true
      uses: ./.git/remote-actions/actions/cache/save
      with:
        path: ${{ runner.temp }}/sc-cache/downloads
        key: ${{ steps.added.outputs.dl-key }}
    - name: Save the Tauri tools (Windows, main)
      if: steps.added.outputs.tauri-tools-key != '' && steps.cache-action.outputs.fetched == 'true'
      continue-on-error: true
      uses: ./.git/remote-actions/actions/cache/save
      with:
        path: ${{ env.SC_TAURI_TOOLS_DIR }}
        key: ${{ steps.added.outputs.tauri-tools-key }}
    # The Rust toolchain's saved copy (.github/scripts/rust-toolchain.mjs): a new entry only when
    # the job had to fetch archives from static.rust-lang.org (its key ends in the run and a hash
    # of what the mirror holds, so the newest entry is the fullest). Main only, like the Rust
    # cache: what a release build restores is what main's own runs wrote.
    - name: Save the Rust toolchain (main)
      if: github.ref == 'refs/heads/main' && env.SC_RUST_TOOLCHAIN_SAVE_KEY != '' && steps.cache-action.outputs.fetched == 'true'
      continue-on-error: true
      uses: ./.git/remote-actions/actions/cache/save
      with:
        path: ${{ env.SC_RUST_TOOLCHAIN_DIR }}
        key: ${{ env.SC_RUST_TOOLCHAIN_SAVE_KEY }}
    # The .deb set (.github/scripts/apt-debs.sh finish): a new entry only when the job had to add
    # .debs from the archive (its key ends in a hash of the new SHA256SUMS): the .debs it used, plus
    # the rest of the restored set when that was made on the same runner image. Main only: the set
    # is installed as root, and only main's own runs write what a release build restores.
    - name: What the job added to the .deb set (main)
      id: apt-debs
      if: github.ref == 'refs/heads/main' && env.SC_APT_DEBS_KEY != ''
      continue-on-error: true
      shell: bash
      run: '"$GITHUB_WORKSPACE/.github/scripts/apt-debs.sh" finish >> "$GITHUB_OUTPUT"'
    - name: Save the .deb set
      if: steps.apt-debs.outputs.key != '' && steps.cache-action.outputs.fetched == 'true'
      continue-on-error: true
      uses: ./.git/remote-actions/actions/cache/save
      with:
        path: |
          ${{ runner.temp }}/apt-debs/*.deb
          ${{ runner.temp }}/apt-debs/SHA256SUMS
          ${{ runner.temp }}/apt-debs/made-on
        key: ${{ steps.apt-debs.outputs.key }}
