name: Set up SwarmCast build tools
description: >-
  Node.js (with the npm cache), optionally Go for the tray helper and ffmpeg for the tests,
  then `npm ci`. Run actions/checkout first. A cache is a speed-up, never a requirement: a cache
  restore that fails is a warning (continue-on-error), and its download gives up after 2 minutes
  (SEGMENT_DOWNLOAD_TIMEOUT_MINS) instead of eating the step's time limit; the job then
  downloads or installs what it needs.

inputs:
  go:
    description: Also install Go (tray helper, apps/tray).
    default: 'false'
  ffmpeg:
    description: Also install ffmpeg for the tests (the app never ships it). Sets FFMPEG_BIN.
    default: 'false'
  npm-ci:
    description: Run `npm ci`.
    default: 'true'
  downloads:
    description: >-
      Restore the download cache (pinned tools, pkg's Node.js binaries) for a job that runs
      fetch-binaries.mjs or package.mjs. Implied by ffmpeg.
    default: 'false'
  apt-debs:
    description: >-
      Linux: a name for a .deb cache (for example `playwright-<hash>`). Sets APT_DEBS, which
      .github/scripts/apt-retry.sh downloads into; save it with ./.github/actions/setup/save.
    default: ''

runs:
  using: composite
  steps:
    # apt settings for every apt call of the job (apt-retry.sh adds a time limit per try). The
    # file must sort after the image's own /etc/apt/apt.conf.d/zz-retries (Retries 1, Timeout 15),
    # which overrode our earlier 99-ci-retries: apt reads the folder in order, the last value wins.
    # Timeout stays at the image's 15 s (it only fires when no data arrives; a trickling mirror is
    # apt-retry.sh's job); 3 retries instead of 1. The step fails if apt does not see our values.
    - name: apt settings (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo=(); [ "$(id -u)" = 0 ] || sudo=(sudo)
        printf '%s\n' 'Acquire::Retries "3";' 'Acquire::http::Timeout "15";' 'Acquire::https::Timeout "15";' 'Dpkg::Lock::Timeout "60";' |
          "${sudo[@]}" tee /etc/apt/apt.conf.d/zzz-ci-retries >/dev/null
        apt-config dump | grep -E '^(Acquire::Retries|Acquire::https?::Timeout|Dpkg::Lock::Timeout) '
        eval "$(apt-config shell R Acquire::Retries T Acquire::https::Timeout L Dpkg::Lock::Timeout)"
        if [ "$R $T $L" != "3 15 60" ]; then
          echo "::error::apt does not use our settings (Retries=$R https::Timeout=$T Dpkg::Lock::Timeout=$L): a file sorting after zzz-ci-retries overrides them"
          exit 1
        fi
        if [ -f /etc/apt/apt-mirrors.txt ]; then echo "Mirrors:"; cat /etc/apt/apt-mirrors.txt; fi

    # Downloaded .debs (apt-retry.sh install/download put them in $APT_DEBS), for jobs whose apt
    # packages are part of what they test. The key has the runner image version: a new image
    # brings new package versions, and the first job on main refills the cache. Saved on main only
    # (./.github/actions/setup/save at the end of the job): pull requests restore main's.
    - name: .deb cache key (Linux)
      if: inputs.apt-debs != '' && runner.os == 'Linux'
      id: apt-debs
      shell: bash
      env:
        NAME: ${{ inputs.apt-debs }}
      run: |
        echo "APT_DEBS=$RUNNER_TEMP/apt-debs" >> "$GITHUB_ENV"
        echo "key=apt-debs-$NAME-${ImageOS:?}-${ImageVersion:?}-$RUNNER_ARCH" >> "$GITHUB_OUTPUT"
    - name: Restore the .deb cache (Linux)
      if: inputs.apt-debs != '' && runner.os == 'Linux'
      id: apt-debs-cache
      continue-on-error: true
      env:
        SEGMENT_DOWNLOAD_TIMEOUT_MINS: '2'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/apt-debs/*.deb
        key: ${{ steps.apt-debs.outputs.key }}
    - name: Remember the .deb cache for the save step (Linux)
      if: inputs.apt-debs != '' && runner.os == 'Linux'
      shell: bash
      env:
        KEY: ${{ steps.apt-debs.outputs.key }}
        HIT: ${{ steps.apt-debs-cache.outputs.cache-hit }}
      run: |
        echo "SC_APT_DEBS_KEY=$KEY" >> "$GITHUB_ENV"
        echo "SC_APT_DEBS_HIT=${HIT:-false}" >> "$GITHUB_ENV"

    # One npm cache for the root workspace and the website (site/ has its own lockfile), only in
    # jobs that run `npm ci`: a job without it saved an empty ~/.npm first under the same key, so
    # the npm caches on main held 677 B to 75 KB and every `npm ci` went to the registry. This
    # file is part of the key: that moves past those empty entries (they are never restored
    # again and expire), and a change here that changes what the cache holds starts a new one.
    # setup-node saves its cache at the end of every job that missed it, so it runs with the
    # cache on main only; elsewhere the next two steps restore main's entry without saving one
    # (pull requests that changed a lockfile each saved ~380 MB, five OSes x 76 MB, toward the
    # 10 GB limit: .github/workflows/README.md, "Caches").
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      env:
        SEGMENT_DOWNLOAD_TIMEOUT_MINS: '2'
      with:
        node-version: 24.x
        cache: ${{ inputs.npm-ci == 'true' && github.ref == 'refs/heads/main' && 'npm' || '' }}
        package-manager-cache: ${{ inputs.npm-ci == 'true' && github.ref == 'refs/heads/main' }}
        cache-dependency-path: |
          package-lock.json
          site/package-lock.json
          .github/actions/setup/action.yml
    # Not main: setup-node's own key (node-cache-<RUNNER_OS>-<process.arch>-npm-<hashFiles of the
    # same three files>) and path (`npm config get cache`, part of the cache version), so the
    # exact entry main saved is found; after a lockfile change, main's latest entry for this OS
    # (`npm ci --prefer-offline` takes what still matches and downloads the rest).
    - name: npm cache key (restore only, not main)
      if: inputs.npm-ci == 'true' && github.ref != 'refs/heads/main'
      id: npm-cache
      shell: bash
      env:
        HASH: ${{ hashFiles('package-lock.json', 'site/package-lock.json', '.github/actions/setup/action.yml') }}
      run: |
        prefix="node-cache-$RUNNER_OS-$(node -p process.arch)-npm-"
        { echo "prefix=$prefix"; echo "key=$prefix$HASH"; echo "path=$(npm config get cache)"; } >> "$GITHUB_OUTPUT"
    - name: Restore main's npm cache (not main)
      if: inputs.npm-ci == 'true' && github.ref != 'refs/heads/main'
      continue-on-error: true
      env:
        SEGMENT_DOWNLOAD_TIMEOUT_MINS: '2'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.npm-cache.outputs.path }}
        key: ${{ steps.npm-cache.outputs.key }}
        restore-keys: ${{ steps.npm-cache.outputs.prefix }}

    # Downloads verified against scripts/build/versions.json (ffmpeg-test, MediaMTX, cloudflared:
    # SC_DOWNLOAD_CACHE, read by fetch-binaries.mjs) and pkg's Node.js base binaries
    # (PKG_CACHE_PATH, only in jobs that run package.mjs: its own entry), so a job does not
    # depend on github.com for them. One release run was lost to a github.com connect timeout.
    # restore-keys: after a pin changes, the old entry still serves the rest (fetch-binaries.mjs
    # deletes what is no longer pinned). Saved on main only (./.github/actions/setup/save).
    - name: Download cache keys
      if: inputs.ffmpeg == 'true' || inputs.downloads == 'true'
      id: dl
      shell: bash
      env:
        WITH_FFMPEG: ${{ inputs.ffmpeg }}
        PINS: ${{ hashFiles('scripts/build/versions.json') }}
        LOCK: ${{ hashFiles('package-lock.json') }}
      run: |
        echo "SC_DOWNLOAD_CACHE=$RUNNER_TEMP/sc-cache/downloads" >> "$GITHUB_ENV"
        echo "PKG_CACHE_PATH=$RUNNER_TEMP/sc-cache/pkg" >> "$GITHUB_ENV"
        # A job without ffmpeg must not save the entry that jobs with ffmpeg restore.
        dl="sc-downloads-$RUNNER_OS-$RUNNER_ARCH-ffmpeg-$WITH_FFMPEG-"
        pkg="sc-pkg-$RUNNER_OS-$RUNNER_ARCH-"
        { echo "dl-prefix=$dl"; echo "dl-key=$dl$PINS"; echo "pkg-prefix=$pkg"; echo "pkg-key=$pkg$LOCK"; } >> "$GITHUB_OUTPUT"
    - name: Restore the download cache
      if: inputs.ffmpeg == 'true' || inputs.downloads == 'true'
      id: dl-cache
      continue-on-error: true
      env:
        SEGMENT_DOWNLOAD_TIMEOUT_MINS: '2'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/sc-cache/downloads
        key: ${{ steps.dl.outputs.dl-key }}
        restore-keys: ${{ steps.dl.outputs.dl-prefix }}
    - name: Restore the pkg cache
      if: inputs.ffmpeg == 'true' || inputs.downloads == 'true'
      id: pkg-cache
      continue-on-error: true
      env:
        SEGMENT_DOWNLOAD_TIMEOUT_MINS: '2'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/sc-cache/pkg
        key: ${{ steps.dl.outputs.pkg-key }}
        restore-keys: ${{ steps.dl.outputs.pkg-prefix }}
    - name: Remember the download caches for the save step
      if: inputs.ffmpeg == 'true' || inputs.downloads == 'true'
      shell: bash
      env:
        DL_KEY: ${{ steps.dl.outputs.dl-key }}
        DL_HIT: ${{ steps.dl-cache.outputs.cache-hit }}
        PKG_KEY: ${{ steps.dl.outputs.pkg-key }}
        PKG_HIT: ${{ steps.pkg-cache.outputs.cache-hit }}
      run: |
        {
          echo "SC_DL_CACHE_KEY=$DL_KEY"
          echo "SC_DL_CACHE_HIT=${DL_HIT:-false}"
          echo "SC_PKG_CACHE_KEY=$PKG_KEY"
          echo "SC_PKG_CACHE_HIT=${PKG_HIT:-false}"
        } >> "$GITHUB_ENV"

    - if: inputs.go == 'true'
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      env:
        SEGMENT_DOWNLOAD_TIMEOUT_MINS: '2'
      with:
        go-version: 1.27.x
        cache-dependency-path: apps/tray/go.sum

    # The same pinned GPL ffmpeg on every OS (scripts/build/versions.json "ffmpeg-test": BtbN on
    # Linux and Windows, Martin Riedl on macOS, the publishers of the app's own ffmpeg pins),
    # SHA-256 verified. GPL because the test feeds encode with libx264, which the LGPL build the
    # app installs for streamers does not have. No apt (Ubuntu's ffmpeg pulled 88 packages from a
    # mirror that sometimes stalls for many minutes), Homebrew or Chocolatey (whose install
    # sometimes left no ffmpeg.exe).
    # It goes first on PATH, ahead of any shim on the image: a shim runs ffmpeg as a child, so
    # tests that kill "ffmpeg" by PID would only kill the shim. The Windows suites run the app
    # with a bare-OS PATH and hand the test feed FFMPEG_BIN.
    - name: ffmpeg for the tests (pinned, verified)
      if: inputs.ffmpeg == 'true'
      shell: bash
      run: |
        dir="$RUNNER_TEMP/ffmpeg-test"
        node "$GITHUB_WORKSPACE/scripts/build/fetch-binaries.mjs" --only ffmpeg-test --out "$dir"
        bin="$dir/ffmpeg"
        if [ "$RUNNER_OS" = Windows ]; then
          dir="$(cygpath -w "$dir")"
          bin="$dir\ffmpeg.exe"
        fi
        echo "FFMPEG_BIN=$bin" >> "$GITHUB_ENV"
        echo "$dir" >> "$GITHUB_PATH"
    - name: ffmpeg version (and the libx264 encoder the test feeds need)
      if: inputs.ffmpeg == 'true'
      shell: bash
      run: |
        "$FFMPEG_BIN" -hide_banner -version | head -n 1
        encoders="$("$FFMPEG_BIN" -hide_banner -encoders)"
        grep -q libx264 <<<"$encoders" || { echo "::error::$FFMPEG_BIN has no libx264 encoder (the test feeds need it)"; exit 1; }

    # --prefer-offline: packages in the restored cache are not re-checked with the registry.
    # The audit runs in its own CI job.
    - if: inputs.npm-ci == 'true'
      shell: bash
      run: npm ci --prefer-offline --no-audit --no-fund
