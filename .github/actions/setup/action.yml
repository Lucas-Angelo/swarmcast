name: Set up SwarmCast build tools
description: >-
  Node.js (with the npm cache), optionally Go for the tray helper and ffmpeg for the tests,
  then `npm ci`. Run actions/checkout first.

inputs:
  go:
    description: Also install Go (tray helper, apps/tray).
    default: 'false'
  ffmpeg:
    description: Also install ffmpeg from the OS package manager (tests only; the app never ships it). Sets FFMPEG_BIN.
    default: 'false'
  npm-ci:
    description: Run `npm ci`.
    default: 'true'

runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24.x
        cache: npm

    - if: inputs.go == 'true'
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: 1.27.x
        cache-dependency-path: apps/tray/go.sum

    - name: Install ffmpeg (Linux)
      if: inputs.ffmpeg == 'true' && runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends ffmpeg
        echo "FFMPEG_BIN=$(command -v ffmpeg)" >> "$GITHUB_ENV"
    - name: Install ffmpeg (macOS)
      if: inputs.ffmpeg == 'true' && runner.os == 'macOS'
      shell: bash
      run: |
        brew install ffmpeg
        echo "FFMPEG_BIN=$(command -v ffmpeg)" >> "$GITHUB_ENV"
    # The real ffmpeg.exe goes first on PATH, ahead of the Chocolatey shim: the shim runs
    # ffmpeg as a child, so tests that kill "ffmpeg" by PID would only kill the shim. The
    # Windows suites run the app with a bare-OS PATH and hand the test feed FFMPEG_BIN.
    - name: Install ffmpeg (Windows)
      if: inputs.ffmpeg == 'true' && runner.os == 'Windows'
      shell: pwsh
      run: |
        choco install ffmpeg -y --no-progress | Out-Null
        $f = Get-ChildItem C:\ProgramData\chocolatey\lib\ffmpeg -Recurse -Filter ffmpeg.exe | Select-Object -First 1
        "FFMPEG_BIN=$($f.FullName)" >> $env:GITHUB_ENV
        Split-Path $f.FullName >> $env:GITHUB_PATH
    - name: ffmpeg version
      if: inputs.ffmpeg == 'true'
      shell: bash
      run: '"$FFMPEG_BIN" -hide_banner -version | head -n 1'

    - if: inputs.npm-ci == 'true'
      shell: bash
      run: npm ci
