name: Set up SwarmCast build tools
description: >-
  Node.js (with the npm cache), optionally Go for the tray helper and ffmpeg for the tests,
  then `npm ci`. Run actions/checkout first.

inputs:
  go:
    description: Also install Go (tray helper, apps/tray).
    default: 'false'
  ffmpeg:
    description: Also install ffmpeg for the tests (the app never ships it). Sets FFMPEG_BIN.
    default: 'false'
  npm-ci:
    description: Run `npm ci`.
    default: 'true'
  apt-debs:
    description: >-
      Linux: a name for a .deb cache (for example `playwright-<hash>`). Sets APT_DEBS, which
      .github/scripts/apt-retry.sh downloads into; save it with ./.github/actions/setup/save.
    default: ''

runs:
  using: composite
  steps:
    # apt settings for every apt call of the job (apt-retry.sh adds a time limit per try). The
    # file must sort after the image's own /etc/apt/apt.conf.d/zz-retries (Retries 1, Timeout 15),
    # which overrode our earlier 99-ci-retries: apt reads the folder in order, the last value wins.
    # Timeout stays at the image's 15 s (it only fires when no data arrives; a trickling mirror is
    # apt-retry.sh's job); 3 retries instead of 1. The step fails if apt does not see our values.
    - name: apt settings (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo=(); [ "$(id -u)" = 0 ] || sudo=(sudo)
        printf '%s\n' 'Acquire::Retries "3";' 'Acquire::http::Timeout "15";' 'Acquire::https::Timeout "15";' 'Dpkg::Lock::Timeout "60";' |
          "${sudo[@]}" tee /etc/apt/apt.conf.d/zzz-ci-retries >/dev/null
        apt-config dump | grep -E '^(Acquire::Retries|Acquire::https?::Timeout|Dpkg::Lock::Timeout) '
        eval "$(apt-config shell R Acquire::Retries T Acquire::https::Timeout L Dpkg::Lock::Timeout)"
        if [ "$R $T $L" != "3 15 60" ]; then
          echo "::error::apt does not use our settings (Retries=$R https::Timeout=$T Dpkg::Lock::Timeout=$L): a file sorting after zzz-ci-retries overrides them"
          exit 1
        fi
        if [ -f /etc/apt/apt-mirrors.txt ]; then echo "Mirrors:"; cat /etc/apt/apt-mirrors.txt; fi

    # Downloaded .debs (apt-retry.sh install/download put them in $APT_DEBS), for jobs whose apt
    # packages are part of what they test. The key has the runner image version: a new image
    # brings new package versions, and the first job on main refills the cache. Saved on main only
    # (./.github/actions/setup/save at the end of the job): pull requests restore main's.
    - name: .deb cache key (Linux)
      if: inputs.apt-debs != '' && runner.os == 'Linux'
      id: apt-debs
      shell: bash
      env:
        NAME: ${{ inputs.apt-debs }}
      run: |
        echo "APT_DEBS=$RUNNER_TEMP/apt-debs" >> "$GITHUB_ENV"
        echo "key=apt-debs-$NAME-$ImageOS-$ImageVersion-$RUNNER_ARCH" >> "$GITHUB_OUTPUT"
    - name: Restore the .deb cache (Linux)
      if: inputs.apt-debs != '' && runner.os == 'Linux'
      id: apt-debs-cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/apt-debs/*.deb
        key: ${{ steps.apt-debs.outputs.key }}
    - name: Remember the .deb cache for the save step (Linux)
      if: inputs.apt-debs != '' && runner.os == 'Linux'
      shell: bash
      env:
        KEY: ${{ steps.apt-debs.outputs.key }}
        HIT: ${{ steps.apt-debs-cache.outputs.cache-hit }}
      run: |
        echo "SC_APT_DEBS_KEY=$KEY" >> "$GITHUB_ENV"
        echo "SC_APT_DEBS_HIT=${HIT:-false}" >> "$GITHUB_ENV"

    # One npm cache for the root workspace and the website (site/ has its own lockfile).
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24.x
        cache: npm
        cache-dependency-path: |
          package-lock.json
          site/package-lock.json

    - if: inputs.go == 'true'
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: 1.27.x
        cache-dependency-path: apps/tray/go.sum

    # Ubuntu's ffmpeg (what the suites have always run against), through apt-retry.sh: a time
    # limit per try, retries and a fallback mirror, because GitHub's Ubuntu mirror sometimes
    # stalls for many minutes.
    - name: Install ffmpeg (Linux)
      if: inputs.ffmpeg == 'true' && runner.os == 'Linux'
      shell: bash
      run: |
        "$GITHUB_ACTION_PATH/../../scripts/apt-retry.sh" update
        "$GITHUB_ACTION_PATH/../../scripts/apt-retry.sh" install -y --no-install-recommends ffmpeg
        echo "FFMPEG_BIN=$(command -v ffmpeg)" >> "$GITHUB_ENV"
    - name: Install ffmpeg (macOS)
      if: inputs.ffmpeg == 'true' && runner.os == 'macOS'
      shell: bash
      run: |
        brew install ffmpeg
        echo "FFMPEG_BIN=$(command -v ffmpeg)" >> "$GITHUB_ENV"
    # A pinned BtbN build, SHA-256 verified (same release as the app's pin in
    # scripts/build/versions.json), instead of Chocolatey, whose install sometimes left no
    # ffmpeg.exe. This is the GPL variant: the test feeds encode with libx264, which the LGPL
    # build the app installs for streamers does not have. Hash from BtbN's checksums.sha256.
    # The real ffmpeg.exe goes first on PATH, ahead of any shim on the image: a shim runs
    # ffmpeg as a child, so tests that kill "ffmpeg" by PID would only kill the shim. The
    # Windows suites run the app with a bare-OS PATH and hand the test feed FFMPEG_BIN.
    - name: Install ffmpeg (Windows)
      if: inputs.ffmpeg == 'true' && runner.os == 'Windows'
      shell: pwsh
      env:
        FFMPEG_URL: https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-09-30-13-08/ffmpeg-n9.0.2-17-g2a571b6068-win64-gpl-9.0.zip
        FFMPEG_SHA256: a0e45723c72141975f51d8666302e614711745f3102b704ca3f82c897a58d278
      run: |
        $zip = Join-Path $env:RUNNER_TEMP 'ffmpeg-gpl.zip'
        curl.exe --fail --location --silent --show-error --retry 5 --retry-all-errors --retry-delay 5 -o $zip $env:FFMPEG_URL
        if ($LASTEXITCODE -ne 0) { throw "Downloading ffmpeg failed (curl exit $LASTEXITCODE): $env:FFMPEG_URL" }
        $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
        if ($hash -ne $env:FFMPEG_SHA256) { throw "ffmpeg checksum mismatch: expected $env:FFMPEG_SHA256, got $hash" }
        $dir = Join-Path $env:RUNNER_TEMP 'ffmpeg'
        Expand-Archive -LiteralPath $zip -DestinationPath $dir -Force
        $f = Get-ChildItem $dir -Recurse -Filter ffmpeg.exe | Select-Object -First 1
        if (-not $f) { throw "ffmpeg.exe not found in $zip" }
        "FFMPEG_BIN=$($f.FullName)" >> $env:GITHUB_ENV
        Split-Path $f.FullName >> $env:GITHUB_PATH
    - name: ffmpeg version (and the libx264 encoder the test feeds need)
      if: inputs.ffmpeg == 'true'
      shell: bash
      run: |
        "$FFMPEG_BIN" -hide_banner -version | head -n 1
        encoders="$("$FFMPEG_BIN" -hide_banner -encoders)"
        grep -q libx264 <<<"$encoders" || { echo "::error::$FFMPEG_BIN has no libx264 encoder (the test feeds need it)"; exit 1; }

    - if: inputs.npm-ci == 'true'
      shell: bash
      run: npm ci
