name: Set up SwarmCast build tools
description: >-
  Node.js (with the npm cache), optionally ffmpeg for the tests,
  then `npm ci`. Run actions/checkout first. A cache is a speed-up, never a requirement: every
  cache restore here goes through ./.github/actions/cache-restore, which cuts a try off after
  90 s and tries once more (a stalled download hung actions/cache/restore for 12 minutes in a
  simulation, and SEGMENT_DOWNLOAD_TIMEOUT_MINS does not bound that part), then goes on without
  the cache; the job then downloads or installs what it needs.

inputs:
  ffmpeg:
    description: Also install ffmpeg for the tests (the app never ships it). Sets FFMPEG_BIN.
    default: 'false'
  app-ffmpeg:
    description: >-
      Also the pinned ffmpeg archive the app itself installs for streamers (versions.json
      "ffmpeg", this runner's target), verified, into the download cache, for a suite that serves
      it to the app from a local stand-in (scripts/test/lib/ffmpeg-stand-in.mjs): the app's
      install then never reaches the publisher at test time. Implies downloads.
    default: 'false'
  obs-studio:
    description: >-
      Also the pinned OBS Studio portable zip (versions.json "obs-studio", Windows x64 only),
      verified, into the download cache, for the Windows OBS suite, which reads it from there
      and never downloads it at test time. Implies downloads.
    default: 'false'
  npm-ci:
    description: Run `npm ci`.
    default: 'true'
  downloads:
    description: >-
      Restore the download cache (pinned tools, pkg's Node.js base binary) for a job that runs
      fetch-binaries.mjs or package.mjs. Implied by ffmpeg.
    default: 'false'
  downloads-for:
    description: >-
      The target whose pinned binaries the job fetches (`package.mjs --target`), when it is not
      the runner's own OS and architecture (for example `windows-x64` on Linux). Part of the
      download cache's key, so each entry holds one target's files.
    default: ''
  tauri-tools:
    description: >-
      Windows: restore the Tauri CLI's tools folder (NSIS and its plugin) for a job that runs
      `tauri build`; save it with ./.github/actions/setup/save.
    default: 'false'
  apt-debs:
    description: >-
      Linux: the name of the job's saved .deb set (for example `tauri-build`, `playwright-<hash>`),
      restored into APT_DEBS for .github/scripts/apt-debs.sh, which installs from it with apt
      offline; save it with ./.github/actions/setup/save.
    default: ''

runs:
  using: composite
  steps:
    # apt settings for every apt call of the job (apt-retry.sh adds a time limit per try). The
    # file must sort after the image's own /etc/apt/apt.conf.d/zz-retries (Retries 1, Timeout 15),
    # which overrode our earlier 99-ci-retries: apt reads the folder in order, the last value wins.
    # Timeout stays at the image's 15 s (it only fires when no data arrives; a trickling mirror is
    # apt-retry.sh's job); 3 retries instead of 1. The step fails if apt does not see our values.
    - name: apt settings (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo=(); [ "$(id -u)" = 0 ] || sudo=(sudo)
        printf '%s\n' 'Acquire::Retries "3";' 'Acquire::http::Timeout "15";' 'Acquire::https::Timeout "15";' 'Dpkg::Lock::Timeout "60";' |
          "${sudo[@]}" tee /etc/apt/apt.conf.d/zzz-ci-retries >/dev/null
        apt-config dump | grep -E '^(Acquire::Retries|Acquire::https?::Timeout|Dpkg::Lock::Timeout) '
        eval "$(apt-config shell R Acquire::Retries T Acquire::https::Timeout L Dpkg::Lock::Timeout)"
        if [ "$R $T $L" != "3 15 60" ]; then
          echo "::error::apt does not use our settings (Retries=$R https::Timeout=$T Dpkg::Lock::Timeout=$L): a file sorting after zzz-ci-retries overrides them"
          exit 1
        fi
        if [ -f /etc/apt/apt-mirrors.txt ]; then echo "Mirrors:"; cat /etc/apt/apt-mirrors.txt; fi

    # The job's saved .deb set (.github/scripts/apt-debs.sh; .github/workflows/README.md, "Ubuntu
    # packages"): the .debs its apt installs, SHA256SUMS and made-on. apt-debs.sh checks it against
    # SHA256SUMS and installs from it with apt offline, so a warm job never asks the Ubuntu archive.
    # Keys: apt-debs-v2-<ImageOS>-<arch>-<name>-<ImageVersion>-<hash of SHA256SUMS> (setup/save,
    # main only, a new entry only when a job had to add to the set). The restore takes the newest
    # entry for this runner image, else the newest of any image (a new runner image: apt-debs.sh
    # asks apt whether that set still fits, and goes to the archive only when it does not), else,
    # for a name that ends in a hash (playwright-<hash of package-lock.json>), the newest of any hash.
    # Transition: with no set saved yet, the .deb cache from before sets (key apt-debs-<name>-
    # <ImageOS>-<ImageVersion>-<arch>, its old path: .debs only), this image's, else the newest of
    # the same OS and architecture (`-<ImageOS>-2`: an image version, so ubuntu22 never takes
    # ubuntu22-arm64's). apt-debs.sh writes its SHA256SUMS from the files and uses it only when
    # apt says it fits (SC_APT_DEBS_LEGACY). Remove once main has saved a set for every list.
    - name: .deb set keys (Linux)
      if: inputs.apt-debs != '' && runner.os == 'Linux'
      id: apt-debs
      shell: bash
      env:
        NAME: ${{ inputs.apt-debs }}
      run: |
        echo "APT_DEBS=$RUNNER_TEMP/apt-debs" >> "$GITHUB_ENV"
        base="apt-debs-v2-${ImageOS:?}-$RUNNER_ARCH-"
        family=""
        if [[ "$NAME" =~ ^(.+)-[0-9a-f]{7,}$ ]]; then family="$base${BASH_REMATCH[1]}-"; fi
        {
          echo "key=$base$NAME-${ImageVersion:?}-"
          echo "name=$base$NAME-"
          echo "family=$family"
          echo "legacy=apt-debs-$NAME-$ImageOS-$ImageVersion-$RUNNER_ARCH"
          echo "legacy-prefix=apt-debs-$NAME-$ImageOS-2"
        } >> "$GITHUB_OUTPUT"
    - name: Restore the .deb set (Linux)
      if: inputs.apt-debs != '' && runner.os == 'Linux'
      id: apt-debs-cache
      continue-on-error: true
      env:
        SEGMENT_DOWNLOAD_TIMEOUT_MINS: '1'
      uses: ./.github/actions/cache-restore
      with:
        path: |
          ${{ runner.temp }}/apt-debs/*.deb
          ${{ runner.temp }}/apt-debs/SHA256SUMS
          ${{ runner.temp }}/apt-debs/made-on
        key: ${{ steps.apt-debs.outputs.key }}
        restore-keys: |
          ${{ steps.apt-debs.outputs.key }}
          ${{ steps.apt-debs.outputs.name }}
          ${{ steps.apt-debs.outputs.family }}
    - name: Restore the pre-v2 .deb cache (Linux, transition)
      if: inputs.apt-debs != '' && runner.os == 'Linux' && steps.apt-debs-cache.outputs.cache-matched-key == ''
      id: apt-debs-legacy
      continue-on-error: true
      env:
        SEGMENT_DOWNLOAD_TIMEOUT_MINS: '1'
      uses: ./.github/actions/cache-restore
      with:
        path: ${{ runner.temp }}/apt-debs/*.deb
        key: ${{ steps.apt-debs.outputs.legacy }}
        restore-keys: ${{ steps.apt-debs.outputs.legacy-prefix }}
    - name: Remember the .deb set for the save step (Linux)
      if: inputs.apt-debs != '' && runner.os == 'Linux'
      shell: bash
      env:
        KEY: ${{ steps.apt-debs.outputs.key }}
        MATCHED: ${{ steps.apt-debs-cache.outputs.cache-matched-key }}
        LEGACY: ${{ steps.apt-debs-legacy.outputs.cache-matched-key }}
      run: |
        echo "SC_APT_DEBS_KEY=$KEY" >> "$GITHUB_ENV"
        if [ -n "$MATCHED" ]; then
          echo ".deb set: $MATCHED (this runner image: ${KEY%-})"
        elif [ -n "$LEGACY" ]; then
          echo "SC_APT_DEBS_LEGACY=$LEGACY" >> "$GITHUB_ENV"
          echo ".deb set: none saved yet; transition from the pre-v2 cache $LEGACY (this runner image: ${KEY%-})"
        else
          echo ".deb set: none saved yet, no pre-v2 cache either (this runner image: ${KEY%-})"
        fi

    # The remote actions of this action (setup-node, actions/cache) run from copies
    # fetched with git at their pins (.github/actions/remote-pins), with tries: the runner's own
    # download of a remote action is not tried again after a 404 (.github/workflows/README.md,
    # "Remote actions"). actions/cache here only for the npm cache's save on main; cache-restore
    # fetches it by itself.
    - name: Remote actions (git fetch, with tries)
      uses: ./.github/actions/fetch-remote
      with:
        repos: actions/setup-node
    - name: Remote actions for the caches (git fetch, with tries; main)
      id: cache-action
      if: inputs.npm-ci == 'true' && github.ref == 'refs/heads/main'
      uses: ./.github/actions/fetch-remote
      with:
        repos: actions/cache
        optional: 'true'

    # One npm cache for the root workspace and the website (site/ has its own lockfile), only in
    # jobs that run `npm ci`: a job without it saved an empty ~/.npm first under the same key, so
    # the npm caches on main held 677 B to 75 KB and every `npm ci` went to the registry. This
    # file is part of the key: that moves past those empty entries (they are never restored
    # again and expire), and a change here that changes what the cache holds starts a new one.
    # Same key and path as setup-node's own npm cache (node-cache-<RUNNER_OS>-<process.arch>-npm-
    # <hashFiles of the three files>, `npm config get cache`), so its entries keep working. Not
    # setup-node's built-in cache: its restore has no time limit and its process stays up after
    # a failed download (run 41283774499: the download stalled at 0 of 79.7 MB, then setup-node
    # took 109 s more to exit). Saved from main only (pull requests that changed a lockfile each
    # saved ~380 MB, five OSes x 76 MB, toward the 10 GB limit: README.md, "Caches").
    # prebuild-install keeps the native binaries it downloads in `$npm_config_cache/_prebuilds`,
    # and npm sets npm_config_cache to this path for install scripts, so they are in this cache,
    # per OS and per CPU (macos-15-intel is x64, macos-latest arm64). That does not help a cold
    # key: main restores only its exact key, so the first run after a change to one of the three
    # files downloads them all again (run 41664754395). So no install script in our lockfiles
    # downloads anything (scripts/ci/test/install-scripts.test.ts; node-datachannel's did and is
    # replaced by a stand-in, apps/server/shims/node-datachannel).
    - uses: ./.git/remote-actions/actions/setup-node
      with:
        node-version: 24.x
        package-manager-cache: false
    - name: npm cache key
      if: inputs.npm-ci == 'true'
      id: npm-cache
      shell: bash
      env:
        HASH: ${{ hashFiles('package-lock.json', 'site/package-lock.json', '.github/actions/setup/action.yml') }}
      run: |
        prefix="node-cache-$RUNNER_OS-$(node -p process.arch)-npm-"
        { echo "prefix=$prefix"; echo "key=$prefix$HASH"; echo "path=$(npm config get cache)"; } >> "$GITHUB_OUTPUT"
    # Saved from main only, at the end of the job when main has no entry for the key yet: this
    # step only looks the key up (lookup-only), its post step saves.
    - name: Save the npm cache at the end of the job (main)
      if: inputs.npm-ci == 'true' && github.ref == 'refs/heads/main' && steps.cache-action.outputs.fetched == 'true'
      continue-on-error: true
      uses: ./.git/remote-actions/actions/cache
      with:
        path: ${{ steps.npm-cache.outputs.path }}
        key: ${{ steps.npm-cache.outputs.key }}
        lookup-only: true
    # Elsewhere also main's latest entry for this OS after a lockfile change (`npm ci
    # --prefer-offline` takes what still matches and downloads the rest); not on main, whose
    # saved entry would then carry the old lockfile's packages too.
    - name: Restore the npm cache
      if: inputs.npm-ci == 'true'
      continue-on-error: true
      env:
        SEGMENT_DOWNLOAD_TIMEOUT_MINS: '1'
      uses: ./.github/actions/cache-restore
      with:
        path: ${{ steps.npm-cache.outputs.path }}
        key: ${{ steps.npm-cache.outputs.key }}
        restore-keys: ${{ github.ref != 'refs/heads/main' && steps.npm-cache.outputs.prefix || '' }}

    # Downloads verified against scripts/build/versions.json (ffmpeg-test, MediaMTX, cloudflared,
    # Pebble, cargo-llvm-cov, the AppImage tools, the app's ffmpeg and OBS Studio archives:
    # SC_DOWNLOAD_CACHE, read by fetch-binaries.mjs)
    # and pkg's Node.js base binary (scripts/build/pkg-base.mjs, same folder), so a job does not
    # depend on github.com for them: github.com's release downloads answered 504 for most of an
    # hour while githubstatus.com showed nothing (PR #141), and one release run was lost to a
    # connect timeout. Each file is named by its SHA-256 and checked against its pin before use.
    # The key names the target whose binaries the job fetches (`for-<target>`; downloads-for, or
    # the runner's own), so an entry holds one target's files (.github/workflows/README.md,
    # "Pinned downloads in Docker"). The restore takes the newest entry for these pins
    # (`<prefix><pins>-`), else the newest of any pins (fetch-binaries.mjs deletes what is no
    # longer pinned, so after a pin change only the changed files are downloaded). setup/save
    # saves a new entry only when the job added or changed files (.github/scripts/cache-files.mjs),
    # from main and pull requests.
    - name: Download cache keys
      if: inputs.ffmpeg == 'true' || inputs.downloads == 'true' || inputs.app-ffmpeg == 'true' || inputs.obs-studio == 'true'
      id: dl
      shell: bash
      env:
        WITH_FFMPEG: ${{ inputs.ffmpeg }}
        APP_FFMPEG: ${{ inputs.app-ffmpeg }}
        OBS_STUDIO: ${{ inputs.obs-studio }}
        FOR: ${{ inputs.downloads-for }}
        PINS: ${{ hashFiles('scripts/build/versions.json') }}
      run: |
        echo "SC_DOWNLOAD_CACHE=$RUNNER_TEMP/sc-cache/downloads" >> "$GITHUB_ENV"
        # pkg reads its base binary from here; pkg-base.mjs puts it there from the download cache.
        echo "PKG_CACHE_PATH=$RUNNER_TEMP/pkg-cache" >> "$GITHUB_ENV"
        # The runner's own target, as fetch-binaries.mjs names it (hostTarget).
        if [ -z "$FOR" ]; then
          case "$RUNNER_OS" in Linux) FOR=linux ;; macOS) FOR=macos ;; Windows) FOR=windows ;; *) echo "::error::unknown RUNNER_OS $RUNNER_OS"; exit 1 ;; esac
          case "$RUNNER_ARCH" in X64) FOR="$FOR-x64" ;; ARM64) FOR="$FOR-arm64" ;; *) echo "::error::unknown RUNNER_ARCH $RUNNER_ARCH"; exit 1 ;; esac
        fi
        # A job without ffmpeg must not save the entry that jobs with ffmpeg restore. The same for
        # the archives only some suites use (app-ffmpeg, obs-studio): their jobs have their own
        # entry, and until it exists they start from the plain entry (dl-fallback) and add only
        # those archives.
        extra=""
        if [ "$APP_FFMPEG" = true ]; then extra="$extra-app-ffmpeg"; fi
        if [ "$OBS_STUDIO" = true ]; then extra="$extra-obs-studio"; fi
        dl="sc-downloads-$RUNNER_OS-$RUNNER_ARCH-ffmpeg-$WITH_FFMPEG-for-$FOR-"
        fallback=""
        if [ -n "$extra" ]; then
          fallback="$dl"
          dl="sc-downloads-$RUNNER_OS-$RUNNER_ARCH-ffmpeg-$WITH_FFMPEG$extra-for-$FOR-"
        fi
        # Restore order: this family's newest entry for these pins, then for any pins; then the
        # plain entry's, likewise (empty lines are skipped).
        {
          echo "dl-key=$dl$PINS-"
          echo "dl-prefix=$dl"
          echo "dl-fallback-key=${fallback:+$fallback$PINS-}"
          echo "dl-fallback=$fallback"
        } >> "$GITHUB_OUTPUT"
    - name: Restore the download cache
      if: inputs.ffmpeg == 'true' || inputs.downloads == 'true' || inputs.app-ffmpeg == 'true' || inputs.obs-studio == 'true'
      continue-on-error: true
      env:
        SEGMENT_DOWNLOAD_TIMEOUT_MINS: '1'
      uses: ./.github/actions/cache-restore
      with:
        path: ${{ runner.temp }}/sc-cache/downloads
        key: ${{ steps.dl.outputs.dl-key }}
        restore-keys: |
          ${{ steps.dl.outputs.dl-key }}
          ${{ steps.dl.outputs.dl-prefix }}
          ${{ steps.dl.outputs.dl-fallback-key }}
          ${{ steps.dl.outputs.dl-fallback }}
    - name: Remember the download cache for the save step
      if: inputs.ffmpeg == 'true' || inputs.downloads == 'true' || inputs.app-ffmpeg == 'true' || inputs.obs-studio == 'true'
      shell: bash
      env:
        KEY: ${{ steps.dl.outputs.dl-key }}
      run: |
        node "$GITHUB_WORKSPACE/.github/scripts/cache-files.mjs" list "$RUNNER_TEMP/sc-cache/downloads" "$RUNNER_TEMP/sc-cache/downloads.restored"
        echo "SC_DL_CACHE_KEY=$KEY" >> "$GITHUB_ENV"

    # Windows: tauri build downloads NSIS and its Tauri plugin from github.com
    # (tauri-apps/binary-releases, tauri-apps/nsis-tauri-utils) with one try each, into its tools
    # folder (%LOCALAPPDATA%\tauri), unless they are there already. That folder is cached per
    # package-lock.json (the Tauri CLI's version), saved from main only, and only when the build
    # added or changed files (setup/save; a Tauri CLI update can replace the plugin under the same
    # name). Not checked against a pin when used, unlike the download cache: main-only, like the
    # Rust cache (README.md, "Rules", Caches).
    - name: Tauri tools cache key (Windows)
      if: inputs.tauri-tools == 'true' && runner.os == 'Windows'
      id: tauri-tools
      shell: bash
      env:
        LOCK: ${{ hashFiles('package-lock.json') }}
      run: |
        prefix="sc-tauri-tools-$RUNNER_OS-$RUNNER_ARCH-"
        { echo "prefix=$prefix"; echo "key=$prefix$LOCK-"; echo "dir=$(cygpath -w "$LOCALAPPDATA/tauri")"; } >> "$GITHUB_OUTPUT"
    - name: Restore the Tauri tools (Windows)
      if: inputs.tauri-tools == 'true' && runner.os == 'Windows'
      continue-on-error: true
      env:
        SEGMENT_DOWNLOAD_TIMEOUT_MINS: '1'
      uses: ./.github/actions/cache-restore
      with:
        path: ${{ steps.tauri-tools.outputs.dir }}
        key: ${{ steps.tauri-tools.outputs.key }}
        restore-keys: |
          ${{ steps.tauri-tools.outputs.key }}
          ${{ steps.tauri-tools.outputs.prefix }}
    - name: Remember the Tauri tools for the save step (Windows)
      if: inputs.tauri-tools == 'true' && runner.os == 'Windows'
      shell: bash
      env:
        KEY: ${{ steps.tauri-tools.outputs.key }}
        DIR: ${{ steps.tauri-tools.outputs.dir }}
      run: |
        node "$GITHUB_WORKSPACE/.github/scripts/cache-files.mjs" list "$DIR" "$RUNNER_TEMP/tauri-tools.restored"
        { echo "SC_TAURI_TOOLS_KEY=$KEY"; echo "SC_TAURI_TOOLS_DIR=$DIR"; } >> "$GITHUB_ENV"

    # The same pinned GPL ffmpeg on every OS (scripts/build/versions.json "ffmpeg-test": BtbN on
    # Linux and Windows, Martin Riedl on macOS, the publishers of the app's own ffmpeg pins),
    # SHA-256 verified. GPL because the test feeds encode with libx264, which the LGPL build the
    # app installs for streamers does not have. No apt (Ubuntu's ffmpeg pulled 88 packages from a
    # mirror that sometimes stalls for many minutes), Homebrew or Chocolatey (whose install
    # sometimes left no ffmpeg.exe).
    # It goes first on PATH, ahead of any shim on the image: a shim runs ffmpeg as a child, so
    # tests that kill "ffmpeg" by PID would only kill the shim. The Windows suites run the app
    # with a bare-OS PATH and hand the test feed FFMPEG_BIN.
    - name: ffmpeg for the tests (pinned, verified)
      if: inputs.ffmpeg == 'true'
      shell: bash
      run: |
        dir="$RUNNER_TEMP/ffmpeg-test"
        node "$GITHUB_WORKSPACE/scripts/build/fetch-binaries.mjs" --only ffmpeg-test --out "$dir"
        bin="$dir/ffmpeg"
        if [ "$RUNNER_OS" = Windows ]; then
          dir="$(cygpath -w "$dir")"
          bin="$dir\ffmpeg.exe"
        fi
        echo "FFMPEG_BIN=$bin" >> "$GITHUB_ENV"
        echo "$dir" >> "$GITHUB_PATH"
    # The ffmpeg build the app installs for streamers (versions.json "ffmpeg": BtbN LGPL on Windows
    # and Linux), for the Windows quality suite, which serves this file to the app from a local
    # stand-in (scripts/test/lib/ffmpeg-stand-in.mjs) so the panel's install never reaches
    # github.com at test time (docs/TESTING.md, "No third-party service in the gate"). From the
    # download cache, or downloaded here with fetch-binaries.mjs's recoveries; SHA-256 verified
    # either way. The suite reads it from SC_DOWNLOAD_CACHE.
    - name: The app's ffmpeg archive (pinned, verified)
      if: inputs.app-ffmpeg == 'true'
      shell: bash
      run: node "$GITHUB_WORKSPACE/scripts/build/fetch-binaries.mjs" --only ffmpeg --out "$RUNNER_TEMP/ffmpeg-app"
    # The portable OBS Studio the Windows OBS suite streams with (versions.json "obs-studio"),
    # kept as its zip: the suite reads it from SC_DOWNLOAD_CACHE and never downloads it at test
    # time (docs/TESTING.md, "No third-party service in the gate"). From the download cache, or
    # downloaded here with fetch-binaries.mjs's recoveries; SHA-256 verified either way.
    - name: OBS Studio for the tests (pinned, verified)
      if: inputs.obs-studio == 'true'
      shell: bash
      run: node "$GITHUB_WORKSPACE/scripts/build/fetch-binaries.mjs" --only obs-studio --out "$RUNNER_TEMP/obs-studio"
    - name: ffmpeg version (and the libx264 encoder the test feeds need)
      if: inputs.ffmpeg == 'true'
      shell: bash
      run: |
        "$FFMPEG_BIN" -hide_banner -version | head -n 1
        encoders="$("$FFMPEG_BIN" -hide_banner -encoders)"
        grep -q libx264 <<<"$encoders" || { echo "::error::$FFMPEG_BIN has no libx264 encoder (the test feeds need it)"; exit 1; }

    # npm's own network limits for this job's npm commands (user config): a connection that goes
    # silent is given up after 60 s instead of npm's 5 minutes (fetch-timeout is the socket's idle
    # limit), and a failed request is tried up to 4 times (npm's own retry: network only). Run
    # 41283774499's `npm ci` sat 352 s with no output after a failed cache restore and ran the
    # setup step out of time; a full `npm ci` from the registry takes 4-47 s (measured on every
    # runner image, soak/npm-cold-measure).
    - name: npm network limits
      if: inputs.npm-ci == 'true'
      shell: bash
      run: |
        npm config set fetch-timeout 60000 --location=user
        npm config set fetch-retries 4 --location=user
    # --prefer-offline: packages in the restored cache are not re-checked with the registry.
    # The audit runs in its own CI job. A network error that npm's own retries did not get past
    # (a download that broke off mid-transfer is not retried by npm), or one of prebuild-install's
    # in an install script (it downloads a native binary from GitHub, outside npm's retries),
    # runs `npm ci` once more: an infrastructure retry, like apt-retry.sh; any other failure fails
    # the step. .github/scripts/npm-network-error.mjs tells them apart (tested in scripts/ci/test).
    # No install script in our lockfiles downloads anything today: node-datachannel, the one that
    # did, is replaced by a stand-in (apps/server/shims/node-datachannel; run 41664754395).
    - name: npm ci
      if: inputs.npm-ci == 'true'
      shell: bash
      run: |
        log="$RUNNER_TEMP/npm-ci.log"
        for try in 1 2; do
          if npm ci --prefer-offline --no-audit --no-fund 2>&1 | tee "$log"; then exit 0; fi
          if [ "$try" = 1 ] && line="$(node "$GITHUB_WORKSPACE/.github/scripts/npm-network-error.mjs" "$log")"; then
            echo "::warning::npm ci: network error after npm's own retries, running it once more ($line)"
            continue
          fi
          exit 1
        done
