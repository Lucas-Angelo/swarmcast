name: Pins of the remote actions we fetch with git (never run)
description: >-
  Never used as a step. ./.github/actions/fetch-remote reads the `uses:` lines below and fetches
  each action with git, at that commit, into .git/remote-actions/<owner>/<repo> of the workspace;
  our actions then run it from there, `uses:
  ./.git/remote-actions/<owner>/<repo>[/<path>]`. The runner's own download of a remote action
  from codeload.github.com is not tried again after a 404, in "Set up job" and inside a
  composite action alike, and pipeline run 41636784175 lost a job to a 404 for
  Swatinem/rust-cache at a commit that exists. The lines are in this format so Dependabot keeps
  bumping the SHAs and their version comments (.github/dependabot.yml lists .github/actions/*).
  One line per repository (actions/cache/save is actions/cache). .github/workflows/README.md,
  "Remote actions".

runs:
  using: composite
  steps:
    - if: ${{ false }}
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
    - if: ${{ false }}
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
    - if: ${{ false }}
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
    - if: ${{ false }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
    - if: ${{ false }}
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
