name: Upload a build artifact, once more after the artifact service is reachable again
description: >-
  actions/upload-artifact for an artifact the later jobs need (a staged server, the installers),
  tried a second time when the first try fails: first a wait of up to 5 minutes until the artifact
  service answers (its name resolves and it takes a request), then the upload again with
  `overwrite` (a first try that got as far as creating the artifact leaves one by that name). A
  second try that works logs `infra recovery:`; one that fails too fails the step, as before. A
  macOS VM can lose DNS mid-job: release rehearsal 42846972124 lost `desktop macos-arm64 / build`
  at "Failed to CreateArtifact: Unable to make request: ENOTFOUND", 10 minutes into the job, after
  upload-artifact's own 5 attempts (about 30 s). upload-artifact runs from a copy fetched with git
  (./.github/actions/fetch-remote; .github/workflows/README.md, "Remote actions" and "Artifact
  uploads"). Only for build artifacts: test results and logs keep `continue-on-error`.

inputs:
  name:
    description: The artifact's name.
    required: true
  path:
    description: The files (upload-artifact's `path`, exclusions allowed).
    required: true
  retention-days:
    description: Days to keep it.
    required: true
  compression-level:
    description: upload-artifact's `compression-level`.
    default: '6'

runs:
  using: composite
  steps:
    # upload-artifact runs from a copy fetched with git at its pin (.github/actions/remote-pins):
    # the runner's own download of a remote action is not tried again after a 404. Fetched once
    # per job, at its first upload; the later ones find it in place.
    - name: upload-artifact (git fetch, with tries)
      uses: ./.github/actions/fetch-remote
      with:
        repos: actions/upload-artifact
    - id: try1
      continue-on-error: true
      uses: ./.git/remote-actions/actions/upload-artifact
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
        if-no-files-found: error
        compression-level: ${{ inputs.compression-level }}
        retention-days: ${{ inputs.retention-days }}
    # The artifact service's host (ACTIONS_RESULTS_URL, which the runner gives to actions only;
    # GitHub documents results-receiver.actions.githubusercontent.com for artifacts). Any HTTP
    # answer means the name resolves and the service takes connections. What the resolver says
    # goes to the log, so a lost DNS shows as one.
    - name: Wait for the artifact service (after a failed upload)
      if: steps.try1.outcome == 'failure'
      shell: bash
      env:
        NAME: ${{ inputs.name }}
      run: |
        url="${ACTIONS_RESULTS_URL:-https://results-receiver.actions.githubusercontent.com/}"
        host="$(sed -E 's#^[a-z]+://([^/:]+).*#\1#' <<<"$url")"
        echo "::warning::upload of $NAME failed (try 1 of 2); waiting up to 300 s for $host, then one more try"
        echo "::group::upload-build diagnostics ($host)"
        case "$RUNNER_OS" in
          macOS) dscacheutil -q host -a name "$host" || true; scutil --dns | sed -n '1,12p' || true ;;
          Linux) getent hosts "$host" || true ;;
        esac
        nslookup "$host" 2>&1 | sed -n '1,12p' || true
        echo "::endgroup::"
        start=$SECONDS
        until curl -sS -o /dev/null --connect-timeout 5 --max-time 10 "https://$host/"; do
          if [ $((SECONDS - start)) -ge 300 ]; then
            echo "::warning::$host still unreachable after $((SECONDS - start)) s; trying the upload anyway"
            exit 0
          fi
          sleep 5
        done
        echo "$host answered after $((SECONDS - start)) s"
    - id: try2
      if: steps.try1.outcome == 'failure'
      uses: ./.git/remote-actions/actions/upload-artifact
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
        if-no-files-found: error
        compression-level: ${{ inputs.compression-level }}
        retention-days: ${{ inputs.retention-days }}
        overwrite: true
    - if: steps.try2.outcome == 'success'
      shell: bash
      env:
        NAME: ${{ inputs.name }}
      run: |
        echo "::warning::infra recovery: artifact $NAME uploaded on try 2 of 2"
