# Dependabot version updates.
#
# Minor and patch releases are batched into one weekly PR per ecosystem. Major versions
# are ignored on purpose: they are upgraded deliberately, by hand, after reading the
# changelog and running the full test matrix (breaking changes in Node tooling, Vite,
# Vitest, Playwright or Rust crates rarely land as a drop-in bump). Vulnerable
# dependencies are still surfaced by Dependabot alerts and by the `npm audit` CI job.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
      # Playwright 1.65 (WebKit r2388) kills its own driver with "Assertion error" in
      # WKPage._onTargetCreated on any cross-origin navigation to a page with
      # Cross-Origin-Opener-Policy: WebKit now opens the second provisional page before it
      # closes the first, on macOS and Linux (https://github.com/microsoft/playwright/issues/43067).
      # panel-login.spec.ts (the desktop splash opening the panel) needs exactly that navigation.
      # package.json holds @playwright/test on ~1.64.1 until then; 1.66 is proposed as usual,
      # and once its WebKit passes CI this entry goes.
      - dependency-name: '@playwright/test'
        versions: ['1.65.x']
    commit-message:
      prefix: deps

  # The website (site/) has its own package-lock.json (it is not a root workspace).
  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      site-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: deps(site)

  # Actions are pinned by commit SHA; Dependabot bumps the SHA and its `# vX.Y.Z` comment.
  # `/` covers .github/workflows; the composite actions in .github/actions are listed too.
  - package-ecosystem: github-actions
    directories: ['/', '/.github/actions/*']
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions:
        patterns: ['*']
    commit-message:
      prefix: ci

  # Desktop shell (Tauri, Rust). Tauri stays on 2.x: majors are ignored like everywhere else.
  - package-ecosystem: cargo
    directory: /apps/desktop/src-tauri
    schedule:
      interval: weekly
      day: monday
    groups:
      cargo-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: deps(desktop)
