name: npm measure (temporary)
# Temporary, on soak/npm-cold-measure only: how long `npm ci --prefer-offline` takes with a cold
# npm cache, a warm one, and after a restore that was aborted (SEGMENT_DOWNLOAD_TIMEOUT_MINS tiny).
on:
  push:
    branches: [soak/npm-cold-measure]
permissions:
  contents: read
jobs:
  measure:
    name: ${{ matrix.mode }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, macos-latest, windows-latest, ubuntu-24.04]
        mode: [cold-1, cold-2, cold-3, warm, aborted]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          package-manager-cache: false
      - name: key
        id: k
        env:
          HASH: ${{ hashFiles('package-lock.json', 'site/package-lock.json', '.github/actions/setup/action.yml') }}
        run: |
          prefix="node-cache-$RUNNER_OS-$(node -p process.arch)-npm-"
          { echo "prefix=$prefix"; echo "key=$prefix$HASH"; echo "path=$(npm config get cache)"; } >> "$GITHUB_OUTPUT"
          echo "npm cache dir: $(npm config get cache)"; du -sh "$(npm config get cache)" 2>/dev/null || echo "(empty)"
      - name: restore (warm, aborted)
        if: matrix.mode == 'warm' || matrix.mode == 'aborted'
        id: r
        continue-on-error: true
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: ${{ matrix.mode == 'aborted' && '0.001' || '2' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.k.outputs.path }}
          key: ${{ steps.k.outputs.key }}
          restore-keys: ${{ steps.k.outputs.prefix }}
      - name: npm ci
        env:
          MATCHED: ${{ steps.r.outputs.cache-matched-key }}
        run: |
          echo "restored: ${MATCHED:-nothing}"
          du -sh "$(npm config get cache)" 2>/dev/null || true
          start=$SECONDS
          npm ci --prefer-offline --no-audit --no-fund
          echo "NPM_CI_SECONDS=$((SECONDS - start))"
