name: desktop

# One desktop target, end to end. pipeline.yml calls this once per target, so each target's
# clean-machine tests start as soon as its own build is done, not after the slowest target's.
#
# build: the target's installers, with exactly two `tauri build`s:
# - A (0.0.0-test.1), the update test's starting point: --fast, accepts http:// update URLs and
#   trusts the key that signed the real build;
# - the real installers, which are also the update test's target.
# Pull requests and main build the release profile without LTO and with 16 codegen units (through
# CARGO_PROFILE_RELEASE_*, so `tauri bundle` still finds target/<triple>/release), and sign the
# updater artifacts with a key pair made in the job. A release (release: true, from release.yml)
# builds with the profile in Cargo.toml (fat LTO) and signs with TAURI_SIGNING_PRIVATE_KEY from
# the `release` environment; A then trusts the release key. A release rehearsal (release-flavour:
# true, pipeline.yml dispatched by hand) builds exactly as a release does (Cargo.toml's profile,
# the same bundles and time limits) but signs like a pull request, with the job's own key pair:
# it never names the `release` environment or reads its secrets. The macOS and Linux builds first
# stage their server package (release/staging/<target>, pkg-<target>: pkg's macOS binaries need
# a Mac to be signed) from web-dist; Windows takes release/staging/windows-x64 from
# pkg-windows-x64 (_build.yml).
#
# clean-machine: one job per runner image of the target, each a fresh machine that gets, as
# separate steps, whatever applies to it:
# - preflight: the staged server (the same executable the installers carry as their sidecar)
#   started on an empty data folder, a synthetic OBS feed, Google Chrome watching, P2P, kick,
#   link rotation, "Stop everything", quit, nothing left behind, and playback through a quick
#   tunnel: the package's cloudflared against a local stand-in for Cloudflare
#   (scripts/test/lib/cloudflare.mjs), so no gate depends on Cloudflare's free service; the real
#   one is covered by real-services.yml (scheduled, never gating) (scripts/test/preflight/verify.mjs).
#   Not on the arm64 image (no Google Chrome there);
# - desktop: the real installers: install, launch, panel login, autostart, kill, quit, the
#   uninstallers, and an update from build A to them with the settings kept
#   (scripts/test/desktop/verify.mjs);
# - AppImage on a minimal host: bare ubuntu:22.04 and ubuntu:24.04 containers with only the
#   libraries the install guide lists (scripts/test/docker/appimage.sh, also run weekly on more
#   bases by linux-docker.yml). The runner image has Mesa, fonts and X already, so the desktop
#   step cannot show a missing one.
# Each check's PASS/FAIL lines go to the job summary (.github/scripts/test-summary.mjs).
#
# What ships carries no development dependency and no test code (.github/scripts/no-dev-deps.mjs):
# the build checks this target's staged package and its real installers before uploading them.
on:
  workflow_call:
    inputs:
      target:
        description: windows-x64, macos-arm64, macos-x64, linux-x64 or linux-arm64.
        type: string
        required: true
      release:
        description: Release build (fat LTO, updater artifacts signed with TAURI_SIGNING_PRIVATE_KEY).
        type: boolean
        default: false
      release-flavour:
        description: Build as a release does (fat LTO, the release time limits), signed with the job's throwaway key. No environment, no secrets.
        type: boolean
        default: false
      screenshots:
        description: Also capture the Windows installer pages and app window for the website guide (artifact only).
        type: boolean
        default: false
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        required: false
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: false

permissions:
  contents: read
  actions: read # fetch-artifact's REST fallback reads this run's artifacts (.github/actions/fetch-artifact)

env:
  FORCE_COLOR: '1'
  CARGO_TERM_COLOR: always
  # What the AppImage needs from the host, as the Linux install guide lists it (the same list as
  # scripts/test/docker/Dockerfile.appimage): libGL and libEGL are on AppImage's excludelist, so
  # the AppImage cannot bring them (libEGL.so.1 is not on the Ubuntu 24.04 runner image).
  APPIMAGE_HOST_PACKAGES: libgl1 libegl1 fontconfig fonts-dejavu-core libharfbuzz0b libfribidi0

jobs:
  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # One entry: this call's target. macos-x64 is cross-built on Apple silicon (Rust, pkg and
        # the .dmg all target x86_64 from there): the Intel image took 14-25 min for these builds,
        # Apple silicon about a third; the Intel Mac runs these exact bytes in the clean-machine
        # job below. Linux builds on the
        # oldest supported Ubuntu (glibc), so the .deb/.AppImage run on newer ones too.
        include: >-
          ${{ fromJSON('{
          "windows-x64": [{"target": "windows-x64", "os": "windows-latest"}],
          "macos-arm64": [{"target": "macos-arm64", "os": "macos-latest"}],
          "macos-x64": [{"target": "macos-x64", "os": "macos-latest", "rust-target": "x86_64-apple-darwin"}],
          "linux-x64": [{"target": "linux-x64", "os": "ubuntu-22.04"}],
          "linux-arm64": [{"target": "linux-arm64", "os": "ubuntu-22.04-arm"}]
          }')[inputs.target] }}
    runs-on: ${{ matrix.os }}
    # Only a release build gets the updater signing key, and only a job that names the `release`
    # environment can read it once the key is an environment secret (docs/RELEASING.md, section 3).
    # An empty name means no environment: pull request runs never ask for it.
    environment: ${{ inputs.release && 'release' || '' }}
    # Warm-cache p99 8.8 min; a cold Rust cache (a Cargo.lock or toolchain change) costs about
    # twice that, so 2 x 8.8 x 1.5. Release builds (fat LTO) have no measurements yet.
    timeout-minutes: ${{ (inputs.release || inputs.release-flavour) && 45 || 27 }}
    defaults:
      run:
        shell: bash
    env:
      TARGET: ${{ matrix.target }}
      RELEASE: ${{ inputs.release }}
      RETENTION: ${{ github.event_name == 'pull_request' && 3 || 14 }}
    steps:
      # A macOS VM can lose DNS for its first minute: in a 10x stability run actions/checkout's three
      # tries all failed with "Could not resolve host: github.com" (run 41283766285). Wait up to
      # 3 minutes for github.com before checking out (an infrastructure wait: workflows/README.md).
      - name: Wait for github.com (macOS)
        if: runner.os == 'macOS'
        timeout-minutes: 4
        shell: bash
        run: |
          start=$SECONDS
          for i in $(seq 1 36); do
            if curl -sS -o /dev/null --connect-timeout 5 --max-time 10 https://github.com; then
              [ "$i" = 1 ] || echo "::warning::github.com answered only after $((SECONDS - start)) s ($i tries)"
              exit 0
            fi
            sleep 5
          done
          echo "::warning::github.com still unreachable after $((SECONDS - start)) s; continuing"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The download cache holds this target's files (macos-x64 is built on Apple silicon); on
      # Windows, the Tauri tools (NSIS) that tauri build would download from github.com.
      - uses: ./.github/actions/setup
        timeout-minutes: 8
        with:
          downloads: ${{ runner.os != 'Windows' }}
          downloads-for: ${{ matrix.target }}
          tauri-tools: ${{ runner.os == 'Windows' }}
          apt-debs: ${{ runner.os == 'Linux' && 'tauri-build' || '' }}
      # Before setup-rust: rust-cache puts every CARGO_* variable into its key, so test builds and
      # release builds never share a cache entry.
      - name: Build profile (test builds; releases keep Cargo.toml's)
        if: ${{ !inputs.release && !inputs.release-flavour }}
        run: |
          echo CARGO_PROFILE_RELEASE_LTO=false >> "$GITHUB_ENV"
          echo CARGO_PROFILE_RELEASE_CODEGEN_UNITS=16 >> "$GITHUB_ENV"
      # The log shows which profile a release or rehearsal built, and fails if anything overrode it.
      - name: Build profile (release flavour, Cargo.toml's)
        if: ${{ inputs.release || inputs.release-flavour }}
        run: |
          sed -n '/^\[profile\.release\]/,/^\[/p' apps/desktop/src-tauri/Cargo.toml
          if env | grep '^CARGO_PROFILE_RELEASE_'; then
            echo "::error::a CARGO_PROFILE_RELEASE_* variable overrides Cargo.toml's release profile"
            exit 1
          fi
          echo "release flavour: Cargo.toml's [profile.release], updater key: $([ "$RELEASE" = true ] && echo release || echo throwaway)"
      - uses: ./.github/actions/setup-rust
        timeout-minutes: 8
        with:
          cache-key: ${{ matrix.target }}
          targets: ${{ matrix.rust-target || '' }}
      - uses: ./.github/actions/get-build
        timeout-minutes: 10
        with:
          names: ${{ matrix.target == 'windows-x64' && 'pkg-windows-x64' || 'web-dist' }}
      - name: Version
        run: echo "VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"

      # ---- the staged server package of this target (macOS and Linux) ----
      - name: Package ${{ matrix.target }} (macOS, Linux)
        if: runner.os != 'Windows'
        run: |
          node scripts/build/package.mjs --target "$TARGET" --version "$VERSION"
          tar -cf "$RUNNER_TEMP/pkg-$TARGET.tar" "release/staging/$TARGET"
      # The bundle package.mjs just rebuilt (meta.json), the executable's snapshot, web/ = web-dist.
      - name: No development dependencies in the ${{ matrix.target }} package (macOS, Linux)
        if: runner.os != 'Windows'
        run: node .github/scripts/no-dev-deps.mjs --server --staging "release/staging/$TARGET"
      - name: Upload pkg-${{ matrix.target }}
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pkg-${{ matrix.target }}
          path: ${{ runner.temp }}/pkg-${{ matrix.target }}.tar
          if-no-files-found: error
          retention-days: ${{ env.RETENTION }}

      # ---- the two desktop builds ----
      # A key pair for this job only. Test builds sign A and the real build with it; a release
      # signs only A with it (A's own signature is never checked) and trusts the release key.
      - name: Throwaway updater key
        run: |
          key="$RUNNER_TEMP/update-test.key"
          node node_modules/@tauri-apps/cli/tauri.js signer generate --ci --password test --write-keys "$key"
          echo "TEST_KEY=$key" >> "$GITHUB_ENV"
      # Only what the update test installs (macOS: the .app and its .app.tar.gz, Linux: the
      # AppImage), with --fast: no LTO, 16 codegen units, NSIS uncompressed.
      - name: Build A (0.0.0-test.1, update test)
        run: |
          case "$TARGET" in macos-*) bundles=app ;; linux-*) bundles=appimage ;; *) bundles=nsis ;; esac
          trust=(--updater-pubkey "$TEST_KEY.pub")
          [ "$RELEASE" = true ] && trust=()
          TAURI_SIGNING_PRIVATE_KEY="$(cat "$TEST_KEY")"
          export TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD=test
          node scripts/build/desktop.mjs --target "$TARGET" --version 0.0.0-test.1 --bundles "$bundles" --fast \
            --insecure-updates "${trust[@]}"
          mkdir -p release/update-test
          mv "release/desktop/$TARGET" release/update-test/0.0.0-test.1
      # macOS: desktop.mjs retries the .dmg step by itself when hdiutil reports "Resource busy".
      # Linux: it checks that the server bundled in the .deb and the AppImage starts (--version).
      - name: Build the installers
        env:
          RELEASE_KEY: ${{ inputs.release && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          RELEASE_KEY_PASSWORD: ${{ inputs.release && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        run: |
          if [ "$RELEASE" = true ]; then
            TAURI_SIGNING_PRIVATE_KEY="$RELEASE_KEY" TAURI_SIGNING_PRIVATE_KEY_PASSWORD="$RELEASE_KEY_PASSWORD"
          else
            TAURI_SIGNING_PRIVATE_KEY="$(cat "$TEST_KEY")" TAURI_SIGNING_PRIVATE_KEY_PASSWORD=test
          fi
          export TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD
          node scripts/build/desktop.mjs --target "$TARGET" --version "$VERSION"
          ls -la "release/desktop/$TARGET" release/update-test/*
          ls "release/desktop/$TARGET"/*.sig >/dev/null || { echo "::error::no updater signatures (*.sig) in release/desktop/$TARGET"; exit 1; }
      - name: Remove the throwaway key
        if: always()
        run: rm -f "$RUNNER_TEMP/update-test.key" "$RUNNER_TEMP/update-test.key.pub"
      # Each installer unpacked: no node_modules, the sidecar's snapshot (and the same one as the
      # staged server's), web/ the same as the staged one.
      - name: No development dependencies in the installers
        run: node .github/scripts/no-dev-deps.mjs --staging "release/staging/$TARGET" --installers "release/desktop/$TARGET"

      # The .app bundle stays out: the .dmg and the updater's .app.tar.gz carry it.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ matrix.target }}
          path: |
            release/desktop/${{ matrix.target }}/
            !release/**/SwarmCast.app/**
          if-no-files-found: error
          compression-level: 0
          retention-days: ${{ env.RETENTION }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: update-test-${{ matrix.target }}
          path: |
            release/update-test/
            !release/**/SwarmCast.app/**
          if-no-files-found: error
          compression-level: 0
          retention-days: ${{ env.RETENTION }}
      - uses: ./.github/actions/setup/save
        continue-on-error: true
        timeout-minutes: 3
        if: ${{ !cancelled() && (github.ref == 'refs/heads/main' || github.event_name == 'pull_request') }}

  clean-machine:
    name: clean-machine (${{ matrix.os }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include: >-
          ${{ fromJSON('{
          "windows-x64": [{"os": "windows-latest", "target": "windows-x64", "preflight": true}],
          "macos-arm64": [{"os": "macos-latest", "target": "macos-arm64", "preflight": true}],
          "macos-x64": [{"os": "macos-15-intel", "target": "macos-x64", "preflight": true}],
          "linux-x64": [{"os": "ubuntu-22.04", "target": "linux-x64", "preflight": true, "appimage": true},
          {"os": "ubuntu-24.04", "target": "linux-x64", "preflight": true}],
          "linux-arm64": [{"os": "ubuntu-24.04-arm", "target": "linux-arm64", "appimage": true}]
          }')[inputs.target] }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      TARGET: ${{ matrix.target }}
      SC_DESKTOP_ARTIFACTS: ${{ github.workspace }}/desktop-test-logs
      SC_DESKTOP_SCREENSHOTS: ${{ inputs.screenshots && format('{0}/guide-screenshots', github.workspace) || '' }}
    steps:
      # A macOS VM can lose DNS for its first minute: in a 10x stability run actions/checkout's three
      # tries all failed with "Could not resolve host: github.com" (run 41283766285). Wait up to
      # 3 minutes for github.com before checking out (an infrastructure wait: workflows/README.md).
      - name: Wait for github.com (macOS)
        if: runner.os == 'macOS'
        timeout-minutes: 4
        shell: bash
        run: |
          start=$SECONDS
          for i in $(seq 1 36); do
            if curl -sS -o /dev/null --connect-timeout 5 --max-time 10 https://github.com; then
              [ "$i" = 1 ] || echo "::warning::github.com answered only after $((SECONDS - start)) s ($i tries)"
              exit 0
            fi
            sleep 5
          done
          echo "::warning::github.com still unreachable after $((SECONDS - start)) s; continuing"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Preflight drives Google Chrome through Playwright and streams an ffmpeg feed; both preflight
      # and the desktop step run the local Cloudflare stand-in (scripts/test/lib/cloudflare.mjs),
      # whose certificates come from an npm package, so every image gets npm ci. The desktop
      # step's apt downloads go into the .deb cache.
      # The checks below run even after one of them failed, but only once this job's setup and
      # their own downloads worked: a failed setup or artifact download is the job's one error,
      # not followed by checks that fail for want of it.
      - uses: ./.github/actions/setup
        id: setup
        timeout-minutes: 8
        with:
          npm-ci: true
          ffmpeg: ${{ matrix.preflight == true }}
          apt-debs: ${{ runner.os == 'Linux' && format('desktop-test-{0}', matrix.target) || '' }}
      - name: Version
        run: echo "VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"

      # ---------------------------------------------------------------- preflight
      - uses: ./.github/actions/get-build
        id: pkg
        timeout-minutes: 10
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && matrix.preflight }}
        with:
          names: pkg-${{ matrix.target }}
      # No Playwright browser download: verify.mjs --chrome drives the Google Chrome that the x64
      # runner images ship. Time limits on this and the checks below: 2 to 4 times their slowest
      # run; one that runs out fails, so the logs are still uploaded (a job that runs out is
      # cancelled and uploads nothing).
      # Its tunnel session waits for the live link as long as the app's own tunnel step may take
      # (apps/server/src/tunnel/start-budget.ts, 4 min, plus 1 min): 11 minutes leaves the rest of
      # the run (about 3 minutes) its margin even when the app needs all of it.
      - name: Preflight (install, stream, watch, P2P, kick, stop, tunnel)
        if: ${{ !cancelled() && steps.pkg.outcome == 'success' }}
        timeout-minutes: 11
        run: node scripts/test/preflight/verify.mjs --staging "release/staging/$TARGET" --tunnel --chrome 2>&1 | tee "$RUNNER_TEMP/preflight.log"

      # ---------------------------------------------------------------- desktop app
      - uses: ./.github/actions/fetch-artifact
        id: installers
        timeout-minutes: 10
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        with:
          name: desktop-${{ matrix.target }}
          path: release/desktop
      - uses: ./.github/actions/fetch-artifact
        id: update-test
        timeout-minutes: 10
        if: ${{ !cancelled() && steps.installers.outcome == 'success' }}
        with:
          name: update-test-${{ matrix.target }}
          path: release/update-test
      # The AppImage runs first, with only the host libraries the install guide lists. The .deb
      # pulls its own libraries: they are downloaded here first (time limit per try, retries,
      # another mirror after a slow try) into the .deb cache ($APT_DEBS), from which the test's
      # `apt-get install ./*.deb` installs them. Xvfb and D-Bus come with the image.
      - name: Linux display, the AppImage's host libraries and the .deb's dependencies
        id: host
        if: ${{ !cancelled() && steps.update-test.outcome == 'success' && runner.os == 'Linux' }}
        run: |
          command -v xvfb-run dbus-run-session
          .github/scripts/apt-retry.sh update
          # shellcheck disable=SC2086 # a list of package names
          .github/scripts/apt-retry.sh install -y --no-install-recommends $APPIMAGE_HOST_PACKAGES
          deb="$(find release/desktop -maxdepth 1 -name '*.deb' | head -n 1)"
          .github/scripts/apt-retry.sh download -y --no-install-recommends "./$deb"
      # Diagnostics only: one run's first silent NSIS install took 4 min instead of the usual
      # 15 s (the same installer again: 8 s). This records whether Defender scans what the job
      # runs, so a repeat can be told apart from a slow VM.
      - name: Defender state (Windows)
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        continue-on-error: true
        shell: pwsh
        run: Get-MpComputerStatus | Format-List AMServiceEnabled, AntivirusEnabled, RealTimeProtectionEnabled, OnAccessProtectionEnabled, IoavProtectionEnabled, BehaviorMonitorEnabled
      # The update test serves the real installers with this latest.json on 127.0.0.1 (build A
      # trusts the key that signed them, see _desktop.yml).
      # Linux: a virtual display and a session bus (WebKitGTK and the tray talk D-Bus), without
      # the accessibility bridge and the DMA-BUF renderer (no GPU under Xvfb).
      - name: Desktop (install, launch, panel, autostart, kill, quit, uninstall, update A -> real)
        if: ${{ !cancelled() && steps.update-test.outcome == 'success' && steps.host.outcome != 'failure' }}
        timeout-minutes: 10
        run: |
          node scripts/build/updater-manifest.mjs --version "$VERSION" --base-url http://127.0.0.1:17811 \
            --out release/desktop/latest.json release/desktop
          run=()
          if [ "$RUNNER_OS" = Linux ]; then
            export NO_AT_BRIDGE=1 WEBKIT_DISABLE_DMABUF_RENDERER=1
            run=(xvfb-run -a -s '-screen 0 1280x800x24' dbus-run-session --)
          fi
          "${run[@]}" node scripts/test/desktop/verify.mjs --installers release/desktop \
            --update-from release/update-test/0.0.0-test.1 --update-to release/desktop --update-port 17811 2>&1 | tee "$RUNNER_TEMP/desktop.log"

      # ---------------------------------------------------------------- AppImage, minimal host
      # The two hosts' test images, saved by an earlier run (an artifact:
      # .github/actions/test-images), so the test asks no registry and no distribution mirror;
      # none yet: appimage.sh builds them (about 1 minute each) and the save step keeps them.
      - uses: ./.github/actions/test-images
        if: ${{ !cancelled() && steps.installers.outcome == 'success' && matrix.appimage }}
        timeout-minutes: 5
        continue-on-error: true
        with:
          images: appimage:ubuntu:22.04 appimage:ubuntu:24.04
      # Restored, both hosts take about 0.5 minutes; built and saved, up to 3.2 minutes each
      # (soak run 42765482889), so 10.
      - name: AppImage on minimal ubuntu:22.04 and ubuntu:24.04 hosts
        if: ${{ !cancelled() && steps.installers.outcome == 'success' && matrix.appimage }}
        timeout-minutes: 10
        run: scripts/test/docker/appimage.sh --version "$VERSION" release/desktop/*.AppImage ubuntu:22.04 ubuntu:24.04 2>&1 | tee "$RUNNER_TEMP/appimage.log"
      - uses: ./.github/actions/test-images/save
        if: ${{ !cancelled() && matrix.appimage }}
        continue-on-error: true
        timeout-minutes: 5

      - name: Results in the job summary
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          OS: ${{ matrix.os }}
          PREFLIGHT: ${{ matrix.preflight == true }}
          APPIMAGE: ${{ matrix.appimage == true }}
        run: |
          summary() { node .github/scripts/test-summary.mjs --title "$1 ($TARGET, $OS)" --lines "$RUNNER_TEMP/$2.log"; }
          if [ "$PREFLIGHT" = true ]; then summary Preflight preflight; fi
          summary 'Desktop app' desktop
          if [ "$APPIMAGE" = true ]; then summary 'AppImage on minimal hosts' appimage; fi

      - name: Upload the app logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        continue-on-error: true
        timeout-minutes: 5
        with:
          name: desktop-test-logs-${{ matrix.target }}-${{ matrix.os }}
          path: desktop-test-logs/
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload the guide screenshots
        if: always() && inputs.screenshots && runner.os == 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: guide-screenshots-${{ matrix.target }}
          path: guide-screenshots/
          if-no-files-found: ignore
          retention-days: 7
      - uses: ./.github/actions/setup/save
        continue-on-error: true
        timeout-minutes: 3
        if: ${{ !cancelled() && (github.ref == 'refs/heads/main' || github.event_name == 'pull_request') }}
