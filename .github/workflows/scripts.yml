name: Install scripts

# The start (installer) and uninstall scripts against a fake release on 127.0.0.1, on
# Windows (PowerShell 5.1), macOS and Linux. Runs on pull requests and pushes to main that
# touch the scripts or the website pages the installer zips' offline guide is made of,
# monthly, manually, and as a gate of release.yml.
on:
  pull_request:
    paths: &scripts-paths
      - 'scripts/**'
      - 'site/offline-guide.json'
      - 'site/src/content/**'
      - 'docs/img/**'
      - 'assets/brand/**'
      - '.github/actions/**'
      - '.github/workflows/scripts.yml'
  push:
    branches: [main]
    paths: *scripts-paths
  schedule:
    - cron: '37 6 1 * *'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# Superseded pull request runs are cancelled; runs on main, tags and schedules never are.
concurrency:
  group: scripts-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The scripts and their tests need only Node.js (no npm dependencies).
      - uses: ./.github/actions/setup
        with:
          npm-ci: 'false'

      # The installer zips carry these guides as HTML, generated from the website's pages
      # (see release.yml and site/offline-guide.json). Screenshots are embedded as data: URIs;
      # anything else with src= would load from outside.
      - name: Render the streamer guides
        if: runner.os == 'Linux'
        run: |
          node scripts/build/guide-html.mjs "$RUNNER_TEMP/guide-en.html" --lang en
          node scripts/build/guide-html.mjs "$RUNNER_TEMP/guide-pt-BR.html" --lang pt-BR
          if grep -qiP '<script|src=(?!"data:)' "$RUNNER_TEMP"/guide-*.html; then
            echo "::error::The guides must stay self-contained (no scripts, no external resources)."
            exit 1
          fi

      - name: Run installer tests (macOS / Linux)
        if: runner.os != 'Windows'
        run: bash scripts/test/run.sh

      - name: Run installer tests (Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: cmd
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts\test\run.ps1

      # --- uninstallers (scripts/uninstall-*) ---
      - name: Run uninstaller tests (macOS / Linux)
        if: ${{ !cancelled() && runner.os != 'Windows' }}
        run: bash scripts/test/uninstall.sh

      - name: Run uninstaller tests (Windows PowerShell 5.1)
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        shell: cmd
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts\test\uninstall.ps1
      # --- end uninstallers ---
