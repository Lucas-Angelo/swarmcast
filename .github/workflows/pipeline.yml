name: Pipeline

# The one CI entry point for pull requests and main (.github/workflows/README.md):
#
#   changes ─┬─ quick ──────────────────────┬─ node ×3, e2e ×9, windows ×4 ──────────┐
#            ├─ build (web + windows pkg) ──┤                                         ├─ ci-ok
#            │                              └─ desktop <target> ×5: build ─ clean-machine┤
#            ├─ site (when the site changed) ──────────────────────────────────────────┤
#            └─ docker (when the Docker suites or what they run changed) ──────────────┘
#
# - macOS: at most 3 Apple silicon jobs queued or running at once, in three lanes chained with
#   `needs` (README.md, "macOS concurrency"): (1) devices' iOS job, e2e ui, e2e media; (2)
#   rendering's macOS job, e2e chat, desktop macos-arm64 (build, clean-machine); (3) node, e2e
#   live, desktop macos-x64 (build on Apple silicon, clean-machine on Intel). devices and
#   rendering run only with release-flavour (below); otherwise they are skipped at once and their
#   lane starts with the next job.
# - changes: what the change touches (.github/scripts/changes.sh). Docs-only changes skip
#   every stage; ci-ok is then green within a minute.
# - docker: the Linux Docker suites (_docker.yml: AppImage on minimal hosts, OBS streaming to the
#   staged server and the Playwright suite in containers, x64 and arm64), on their own builds. Also weekly through
#   linux-docker.yml.
# - build runs in parallel with quick; the test jobs download its artifacts (build once, test
#   the same bytes everywhere).
# - ci-ok is the one required check: it always reports, and it is red when any stage failed or
#   was cancelled, or did not run although the change needed it, and on any re-run (a failure is
#   fixed, not re-run until green). `changes` checks that ci-ok waits for every job.
# - No test is retried anywhere (README.md, "Rules"); retries are for the network only.
#
# Also runs monthly with everything (catches rot: dead downloads, runner image changes, and
# ubuntu-latest as a canary), by hand (workflow_dispatch, with the Windows options below), and
# from release.yml with `release: true` (fat LTO desktop builds signed with the updater key).
# By hand with `release-flavour`: a release rehearsal that publishes nothing. Every stage, the
# desktop apps built as a release builds them (fat LTO, the release time limits) but signed with
# a throwaway key made in the job (never the `release` environment or its secrets), plus the
# phone suites (devices.yml) and rendering.yml; ci-ok waits for all of them. Dispatch it on a
# soak/* marker branch, never on main's commit (README.md, "The pipeline").
# No merge_group: GitHub offers the merge queue to organization-owned repositories only, and this
# one belongs to a user (https://github.blog/changelog/2023-07-12-pull-request-merge-queue-is-now-generally-available/).
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 6 1 * *'
  workflow_dispatch:
    inputs:
      windows-runners:
        description: 'Windows suites: JSON list of runners'
        default: '["windows-latest"]'
      windows-suites:
        description: 'Windows suites: JSON list of suites'
        default: '["app","quality","direct","obs"]'
      screenshots:
        description: Also capture the Windows installer pages and app window for the website guide (artifact only).
        type: boolean
        default: false
      release-flavour:
        description: 'Release rehearsal: desktop builds as in a release (fat LTO) signed with a throwaway key, plus devices and rendering. Publishes nothing.'
        type: boolean
        default: false
  workflow_call:
    inputs:
      release:
        description: Release run from release.yml, with every stage and the desktop builds in release flavour.
        type: boolean
        default: false
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        required: false
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: false

permissions:
  contents: read
  actions: read # fetch-artifact's REST fallback reads this run's artifacts (.github/actions/fetch-artifact)

# Superseded pull request runs are cancelled; runs on main, tags, schedules and releases never are.
concurrency:
  group: pipeline-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      app: ${{ steps.changes.outputs.app }}
      site: ${{ steps.changes.outputs.site }}
      docker: ${{ steps.changes.outputs.docker }}
    steps:
      # A pull request's merge commit and its two parents.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - id: changes
        env:
          ALL: ${{ inputs.release || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        run: |
          all=(); [ "$ALL" = true ] && all=(--all)
          .github/scripts/changes.sh "${all[@]}" | tee -a "$GITHUB_OUTPUT"
      # ci-ok is the only required check, so a job it does not wait for would gate nothing.
      - name: ci-ok waits for every job
        shell: bash
        run: |
          file=.github/workflows/pipeline.yml
          jobs="$(awk '/^jobs:/ { in_jobs = 1; next } in_jobs && /^  [A-Za-z0-9_-]+:/ { sub(/^  /, ""); sub(/:.*/, ""); print }' "$file" | grep -vx ci-ok | sort)"
          needs="$(sed -n '/^  ci-ok:/,/^  [A-Za-z0-9_-]*:/ s/^    needs: *\[\(.*\)\]/\1/p' "$file" | tr ',' '\n' | tr -d ' ' | sort)"
          if [ -z "$jobs" ] || [ "$jobs" != "$needs" ]; then
            echo "::error file=$file,title=ci-ok::ci-ok must need every other job (one line, needs: [...]). Missing: $(comm -23 <(echo "$jobs") <(echo "$needs") | xargs); unknown: $(comm -13 <(echo "$jobs") <(echo "$needs") | xargs)"
            exit 1
          fi
          echo "ci-ok waits for: $(echo "$needs" | xargs)"

  quick:
    name: quick
    needs: changes
    if: needs.changes.outputs.app == 'true'
    uses: ./.github/workflows/_quick.yml

  build:
    name: build
    needs: changes
    if: needs.changes.outputs.app == 'true'
    uses: ./.github/workflows/_build.yml

  # One call per target: its build, then its clean-machine jobs (one per runner image), which
  # start as soon as that target's build is done. Only a release passes the updater key on (from
  # release.yml); other runs sign with a throwaway key made in the job, release-flavour included.
  desktop-windows-x64:
    name: desktop windows-x64
    needs: [changes, build]
    uses: ./.github/workflows/_desktop.yml
    with:
      target: windows-x64
      release: ${{ inputs.release == true }}
      release-flavour: ${{ inputs.release-flavour == true }}
      screenshots: ${{ inputs.screenshots == true }}
    secrets: &tauri-key
      TAURI_SIGNING_PRIVATE_KEY: ${{ inputs.release && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ inputs.release && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}

  # The two macOS targets are in the macOS lanes (README.md, "macOS concurrency"). A chained call
  # needs nothing of the call before it and runs whatever its result (not when the run is
  # cancelled), so every check still runs.
  # macOS lane 2, last: after e2e chat. Its build and clean-machine are both Apple silicon jobs,
  # one after the other.
  desktop-macos-arm64:
    name: desktop macos-arm64
    needs: [changes, build, e2e-macos-chat]
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.build.result == 'success' }}
    uses: ./.github/workflows/_desktop.yml
    with:
      target: macos-arm64
      release: ${{ inputs.release == true }}
      release-flavour: ${{ inputs.release-flavour == true }}
      screenshots: ${{ inputs.screenshots == true }}
    secrets: *tauri-key

  # macOS lane 3, last: after e2e live, the build on Apple silicon, then the Intel clean-machine
  # (macos-15-intel, not an Apple silicon runner).
  desktop-macos-x64:
    name: desktop macos-x64
    needs: [changes, build, e2e-macos-live]
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.build.result == 'success' }}
    uses: ./.github/workflows/_desktop.yml
    with:
      target: macos-x64
      release: ${{ inputs.release == true }}
      release-flavour: ${{ inputs.release-flavour == true }}
      screenshots: ${{ inputs.screenshots == true }}
    secrets: *tauri-key

  desktop-linux-x64:
    name: desktop linux-x64
    needs: [changes, build]
    uses: ./.github/workflows/_desktop.yml
    with:
      target: linux-x64
      release: ${{ inputs.release == true }}
      release-flavour: ${{ inputs.release-flavour == true }}
      screenshots: ${{ inputs.screenshots == true }}
    secrets: *tauri-key

  desktop-linux-arm64:
    name: desktop linux-arm64
    needs: [changes, build]
    uses: ./.github/workflows/_desktop.yml
    with:
      target: linux-arm64
      release: ${{ inputs.release == true }}
      release-flavour: ${{ inputs.release-flavour == true }}
      screenshots: ${{ inputs.screenshots == true }}
    secrets: *tauri-key

  # ---------------------------------------------------------------- test stage
  # The macOS jobs are separate calls, one Apple silicon job each, chained in three lanes
  # (README.md, "macOS concurrency"); each call names its stage like the others, so the checks
  # still read `node / ... (macos-latest)` and `e2e / <group> (macos-latest)`. A chained call runs
  # whatever the result of the call before it (not when the run is cancelled).
  node:
    name: node
    needs: [quick, build]
    uses: ./.github/workflows/_node.yml
    with:
      os: ${{ github.event_name == 'schedule' && '["ubuntu-24.04","ubuntu-latest","windows-latest"]' || '["ubuntu-24.04","windows-latest"]' }}

  # macOS lane 3, first: as soon as `quick` and `build` are done.
  node-macos:
    name: node
    needs: [quick, build]
    if: ${{ !cancelled() && needs.quick.result == 'success' && needs.build.result == 'success' }}
    uses: ./.github/workflows/_node.yml
    with:
      os: '["macos-latest"]'

  e2e:
    name: e2e
    needs: [quick, build]
    uses: ./.github/workflows/_e2e.yml
    with:
      os: ${{ github.event_name == 'schedule' && '["ubuntu-24.04","ubuntu-latest"]' || '["ubuntu-24.04"]' }}
      chat-windows: true

  # macOS lane 2, second: the chat group (with the viewer chat UI) after rendering (a release
  # rehearsal; otherwise skipped at once); desktop macos-arm64 after it.
  e2e-macos-chat:
    name: e2e
    needs: [quick, build, rendering]
    if: ${{ !cancelled() && needs.quick.result == 'success' && needs.build.result == 'success' }}
    uses: ./.github/workflows/_e2e.yml
    with:
      os: '["macos-latest"]'
      groups: '["chat"]'

  # macOS lane 1, second: the ui group after devices (a release rehearsal; otherwise skipped at
  # once); e2e media after it.
  e2e-macos-ui:
    name: e2e
    needs: [quick, build, devices]
    if: ${{ !cancelled() && needs.quick.result == 'success' && needs.build.result == 'success' }}
    uses: ./.github/workflows/_e2e.yml
    with:
      os: '["macos-latest"]'
      groups: '["ui"]'

  # macOS lane 1, last: the media group after e2e ui.
  e2e-macos-media:
    name: e2e
    needs: [quick, build, e2e-macos-ui]
    if: ${{ !cancelled() && needs.quick.result == 'success' && needs.build.result == 'success' }}
    uses: ./.github/workflows/_e2e.yml
    with:
      os: '["macos-latest"]'
      groups: '["media"]'

  # macOS lane 3, second: the live group after the macOS node job; desktop macos-x64 after it.
  e2e-macos-live:
    name: e2e
    needs: [quick, build, node-macos]
    if: ${{ !cancelled() && needs.quick.result == 'success' && needs.build.result == 'success' }}
    uses: ./.github/workflows/_e2e.yml
    with:
      os: '["macos-latest"]'
      groups: '["live"]'

  windows:
    name: windows
    needs: [quick, build]
    uses: ./.github/workflows/_windows.yml
    with:
      runners: ${{ inputs.windows-runners || '["windows-latest"]' }}
      suites: ${{ inputs.windows-suites || '["app","quality","direct","obs"]' }}

  # ---------------------------------------------------------------- release-flavour only
  # The phone suites and the rendering checks, which otherwise run on their labels. Each heads a
  # macOS lane (README.md, "macOS concurrency"): devices' iOS job (macos-26, Apple silicon) before
  # the macOS e2e ui and media jobs (lane 1), rendering's macOS job before e2e chat and desktop
  # macos-arm64 (lane 2). Both build what they test themselves, so they start once `changes` is
  # done. In any other run they are skipped straight away, and the next job of the lane does not
  # wait for them.
  devices:
    name: devices
    needs: changes
    if: inputs.release-flavour == true && needs.changes.result == 'success'
    uses: ./.github/workflows/devices.yml
    with:
      every-event: true

  rendering:
    name: rendering
    needs: changes
    if: inputs.release-flavour == true && needs.changes.result == 'success'
    uses: ./.github/workflows/rendering.yml

  site:
    name: site
    needs: changes
    if: needs.changes.outputs.site == 'true'
    uses: ./.github/workflows/_site.yml

  docker:
    name: docker
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    uses: ./.github/workflows/_docker.yml

  # ---------------------------------------------------------------- the required check
  # The verdict and nothing else: one shell step, no checkout, no action, no artifact. Anything
  # more would make the one required check depend on GitHub's services a second time (an artifact
  # download that retries for minutes, a checkout during an Actions incident) and add to the
  # little it does. Each stage's jobs write their own results to their summaries.
  ci-ok:
    name: ci-ok
    needs: [changes, quick, build, desktop-windows-x64, desktop-macos-arm64, desktop-macos-x64, desktop-linux-x64, desktop-linux-arm64, node, node-macos, e2e, e2e-macos-chat, e2e-macos-ui, e2e-macos-media, e2e-macos-live, devices, rendering, windows, site, docker]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Red when a stage failed or was cancelled, when `changes` itself did not succeed, when a
      # stage the change needs did not run (skipped), or when this is a re-run: GitHub shows only
      # the latest attempt on the pull request, so a green re-run would hide the failure. A
      # failure is fixed and pushed (or, after a GitHub outage, a new run is started), never
      # re-run until green. Green with every stage skipped for a docs-only change. devices and
      # rendering are needed only with release-flavour.
      - name: Verdict
        env:
          NEEDS: ${{ toJSON(needs) }}
          APP: ${{ needs.changes.outputs.app }}
          SITE: ${{ needs.changes.outputs.site }}
          DOCKER: ${{ needs.changes.outputs.docker }}
          FLAVOUR: ${{ inputs.release-flavour == true }}
          ATTEMPT: ${{ github.run_attempt }}
        run: |
          app_stages='quick build desktop-windows-x64 desktop-macos-arm64 desktop-macos-x64 desktop-linux-x64 desktop-linux-arm64 node node-macos e2e e2e-macos-chat e2e-macos-ui e2e-macos-media e2e-macos-live windows'
          bad=0
          {
            echo '## ci-ok'
            echo
            echo "Change: app=${APP:-?}, site=${SITE:-?}, docker=${DOCKER:-?}, release-flavour=${FLAVOUR}"
            echo
            echo '| stage | result | |'
            echo '|---|---|---|'
          } >> "$GITHUB_STEP_SUMMARY"
          for stage in $(jq -r 'keys_unsorted[]' <<<"$NEEDS"); do
            result="$(jq -r --arg s "$stage" '.[$s].result' <<<"$NEEDS")"
            needed=false
            [ "$stage" = changes ] && needed=true
            [ "$APP" = true ] && [[ " $app_stages " == *" $stage "* ]] && needed=true
            [ "$SITE" = true ] && [ "$stage" = site ] && needed=true
            [ "$DOCKER" = true ] && [ "$stage" = docker ] && needed=true
            [ "$FLAVOUR" = true ] && [[ "$stage" == devices || "$stage" == rendering ]] && needed=true
            verdict=ok
            case "$result" in
              success) ;;
              skipped) [ "$needed" = false ] || verdict='needed, did not run' ;;
              *) verdict="$result" ;;
            esac
            [ "$verdict" = ok ] || bad=$((bad + 1))
            mark=$([ "$verdict" = ok ] && echo '✅' || echo "❌ $verdict")
            echo "| $stage | $result | $mark |" >> "$GITHUB_STEP_SUMMARY"
            printf '%-22s %-10s %s\n' "$stage" "$result" "$verdict"
          done
          if [ "$ATTEMPT" != 1 ]; then
            bad=$((bad + 1))
            echo "| (run attempt) | $ATTEMPT | ❌ a re-run cannot pass: fix the failure and push, or start a new run |" >> "$GITHUB_STEP_SUMMARY"
            echo "run attempt $ATTEMPT: a re-run cannot pass"
          fi
          if [ "$bad" -gt 0 ]; then
            echo "::error title=ci-ok::$bad stage(s) failed, were cancelled or did not run (see the table above)"
            exit 1
          fi
