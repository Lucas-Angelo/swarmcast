name: Pipeline

# The one CI entry point for pull requests, the merge queue and main (.github/README.md):
#
#   changes ─┬─ quick ──────────────────────┬─ node ×3, e2e ×4, windows ×5 ──────────┐
#            ├─ build (web + windows pkgs) ─┤                                         ├─ ci-ok
#            │                              └─ desktop <target> ×5: build ─ clean-machine┤
#            └─ site (when the site changed) ──────────────────────────────────────────┘
#
# - changes: what the change touches (.github/scripts/changes.sh). Docs-only changes skip
#   every stage; ci-ok is then green within a minute.
# - build runs in parallel with quick; the test jobs download its artifacts (build once, test
#   the same bytes everywhere).
# - ci-ok is the one required check: it always reports, and it is red when any stage failed or
#   was cancelled, or did not run although the change needed it.
#
# Also runs monthly with everything (catches rot: dead downloads, runner image changes, and
# ubuntu-latest as a canary), by hand (workflow_dispatch, with the Windows options below), and
# from release.yml with `release: true` (fat LTO desktop builds signed with the updater key).
on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  schedule:
    - cron: '17 6 1 * *'
  workflow_dispatch:
    inputs:
      windows-runners:
        description: 'Windows suites: JSON list of runners'
        default: '["windows-latest"]'
      windows-suites:
        description: 'Windows suites: JSON list of suites'
        default: '["installer","app","quality","direct","obs"]'
      screenshots:
        description: Also capture the Windows installer pages and app window for the website guide (artifact only).
        type: boolean
        default: false
  workflow_call:
    inputs:
      release:
        description: Release run from release.yml, with every stage and the desktop builds in release flavour.
        type: boolean
        default: false
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        required: false
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: false

permissions:
  contents: read

# Superseded pull request runs are cancelled; runs on main, tags, schedules and releases never are.
concurrency:
  group: pipeline-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      app: ${{ steps.changes.outputs.app }}
      site: ${{ steps.changes.outputs.site }}
      scripts: ${{ steps.changes.outputs.scripts }}
    steps:
      # A pull request's merge commit and its two parents.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - id: changes
        env:
          ALL: ${{ inputs.release || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        run: |
          all=(); [ "$ALL" = true ] && all=(--all)
          .github/scripts/changes.sh "${all[@]}" | tee -a "$GITHUB_OUTPUT"

  quick:
    name: quick
    needs: changes
    if: needs.changes.outputs.app == 'true'
    uses: ./.github/workflows/_quick.yml

  build:
    name: build
    needs: changes
    if: needs.changes.outputs.app == 'true'
    uses: ./.github/workflows/_build.yml

  # One call per target: its build, then its clean-machine jobs (one per runner image), which
  # start as soon as that target's build is done. Only a release passes the updater key on (from
  # release.yml); other runs sign with a throwaway key made in the job.
  desktop-windows-x64:
    name: desktop windows-x64
    needs: [changes, build]
    uses: ./.github/workflows/_desktop.yml
    with:
      target: windows-x64
      release: ${{ inputs.release == true }}
      scripts: ${{ needs.changes.outputs.scripts == 'true' }}
      screenshots: ${{ inputs.screenshots == true }}
    secrets: &tauri-key
      TAURI_SIGNING_PRIVATE_KEY: ${{ inputs.release && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ inputs.release && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}

  desktop-macos-arm64:
    name: desktop macos-arm64
    needs: [changes, build]
    uses: ./.github/workflows/_desktop.yml
    with:
      target: macos-arm64
      release: ${{ inputs.release == true }}
      scripts: ${{ needs.changes.outputs.scripts == 'true' }}
      screenshots: ${{ inputs.screenshots == true }}
    secrets: *tauri-key

  desktop-macos-x64:
    name: desktop macos-x64
    needs: [changes, build]
    uses: ./.github/workflows/_desktop.yml
    with:
      target: macos-x64
      release: ${{ inputs.release == true }}
      scripts: ${{ needs.changes.outputs.scripts == 'true' }}
      screenshots: ${{ inputs.screenshots == true }}
    secrets: *tauri-key

  desktop-linux-x64:
    name: desktop linux-x64
    needs: [changes, build]
    uses: ./.github/workflows/_desktop.yml
    with:
      target: linux-x64
      release: ${{ inputs.release == true }}
      scripts: ${{ needs.changes.outputs.scripts == 'true' }}
      screenshots: ${{ inputs.screenshots == true }}
    secrets: *tauri-key

  desktop-linux-arm64:
    name: desktop linux-arm64
    needs: [changes, build]
    uses: ./.github/workflows/_desktop.yml
    with:
      target: linux-arm64
      release: ${{ inputs.release == true }}
      scripts: ${{ needs.changes.outputs.scripts == 'true' }}
      screenshots: ${{ inputs.screenshots == true }}
    secrets: *tauri-key

  # ---------------------------------------------------------------- test stage
  node:
    name: node
    needs: [quick, build]
    uses: ./.github/workflows/_node.yml

  e2e:
    name: e2e
    needs: [quick, build]
    uses: ./.github/workflows/_e2e.yml

  windows:
    name: windows
    needs: [quick, build]
    uses: ./.github/workflows/_windows.yml
    with:
      runners: ${{ inputs.windows-runners || '["windows-latest"]' }}
      suites: ${{ inputs.windows-suites || '["installer","app","quality","direct","obs"]' }}

  site:
    name: site
    needs: changes
    if: needs.changes.outputs.site == 'true'
    uses: ./.github/workflows/_site.yml

  # ---------------------------------------------------------------- the required check
  ci-ok:
    name: ci-ok
    needs: [changes, quick, build, desktop-windows-x64, desktop-macos-arm64, desktop-macos-x64, desktop-linux-x64, desktop-linux-arm64, node, e2e, windows, site]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # Red when a stage failed or was cancelled, when `changes` itself did not succeed, or when a
      # stage the change needs did not run (skipped). Green with every stage skipped for a
      # docs-only change.
      - name: Verdict
        env:
          NEEDS: ${{ toJSON(needs) }}
          APP: ${{ needs.changes.outputs.app }}
          SITE: ${{ needs.changes.outputs.site }}
        run: |
          app_stages='quick build desktop-windows-x64 desktop-macos-arm64 desktop-macos-x64 desktop-linux-x64 desktop-linux-arm64 node e2e windows'
          bad=0
          {
            echo '## ci-ok'
            echo
            echo "Change: app=${APP:-?}, site=${SITE:-?}"
            echo
            echo '| stage | result | |'
            echo '|---|---|---|'
          } >> "$GITHUB_STEP_SUMMARY"
          for stage in $(jq -r 'keys_unsorted[]' <<<"$NEEDS"); do
            result="$(jq -r --arg s "$stage" '.[$s].result' <<<"$NEEDS")"
            needed=false
            [ "$stage" = changes ] && needed=true
            [ "$APP" = true ] && [[ " $app_stages " == *" $stage "* ]] && needed=true
            [ "$SITE" = true ] && [ "$stage" = site ] && needed=true
            verdict=ok
            case "$result" in
              success) ;;
              skipped) [ "$needed" = false ] || verdict='needed, did not run' ;;
              *) verdict="$result" ;;
            esac
            [ "$verdict" = ok ] || bad=$((bad + 1))
            mark=$([ "$verdict" = ok ] && echo '✅' || echo "❌ $verdict")
            echo "| $stage | $result | $mark |" >> "$GITHUB_STEP_SUMMARY"
            printf '%-22s %-10s %s\n' "$stage" "$result" "$verdict"
          done
          if [ "$bad" -gt 0 ]; then
            echo "::error title=ci-ok::$bad stage(s) failed, were cancelled or did not run (see the table above)"
            exit 1
          fi

      # The Windows suites' table (scripts/test/windows/summarize.mjs), after failed suites too.
      # A suite that stopped before writing its result file gets a line instead of a silent gap.
      - name: Windows suites summary (checkout)
        if: ${{ !cancelled() && needs.windows.result != 'skipped' }}
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/test/windows
      - name: Windows suites summary (results)
        if: ${{ !cancelled() && needs.windows.result != 'skipped' }}
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: win-*
          path: results
      - name: Windows suites summary
        if: ${{ !cancelled() && needs.windows.result != 'skipped' }}
        continue-on-error: true
        env:
          RUNNERS: ${{ inputs.windows-runners || '["windows-latest"]' }}
          SUITES: ${{ inputs.windows-suites || '["installer","app","quality","direct","obs"]' }}
        run: |
          mkdir -p results
          node scripts/test/windows/summarize.mjs results
          missing=()
          for suite in $(jq -r '.[]' <<<"$SUITES"); do
            for os in $(jq -r '.[]' <<<"$RUNNERS"); do
              [ -f "results/win-$suite-$os/results-$suite-$os.json" ] || missing+=("- ⚠️ **$suite** on $os: no results (the suite failed or stopped before writing them; see its job log)")
            done
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            printf '\n### Suites without results\n\n%s\n' "$(printf '%s\n' "${missing[@]}")" | tee -a results/summary.md >> "$GITHUB_STEP_SUMMARY"
            printf '%s\n' "${missing[@]}"
          fi
      - name: Windows suites summary (upload)
        if: ${{ !cancelled() && needs.windows.result != 'skipped' }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-e2e-summary
          path: results/summary.md
          if-no-files-found: ignore
