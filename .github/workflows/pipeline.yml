name: Pipeline

# soak/mf-diag only: the failure path of .github/scripts/media-foundation.ps1 (not for main).
on:
  workflow_dispatch:
    inputs:
      windows-runners:
        description: unused
        default: '["windows-latest"]'
      windows-suites:
        description: unused
        default: '[]'
      screenshots:
        description: unused
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  mf:
    name: mf failure path ${{ matrix.case }}
    strategy:
      fail-fast: false
      matrix:
        case: [never-finishes, dism-fails, enabled]
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Simulate
        shell: pwsh
        env:
          CASE: ${{ matrix.case }}
        run: |
          $d = $env:RUNNER_TEMP
          [DateTime]::UtcNow.ToString('o') | Set-Content "$d\media-foundation.start"
          $feature = if ($env:CASE -eq 'dism-fails') { 'NoSuchFeature' } else { 'ServerMediaFoundation' }
          if ($env:CASE -ne 'never-finishes') {
            $c = "dism.exe /English /Online /Enable-Feature /FeatureName:$feature /All /NoRestart /LogPath:`"$d\media-foundation-dism.log`" >`"$d\media-foundation.log`" 2>&1 & (echo !errorlevel!)>`"$d\media-foundation.tmp`" & move /y `"$d\media-foundation.tmp`" `"$d\media-foundation.done`" >nul"
            Start-Process cmd.exe -WindowStyle Hidden -ArgumentList "/d /v:on /c $c"
          }
      - name: Wait (expected to fail except for enabled)
        id: wait
        continue-on-error: true
        timeout-minutes: 4
        shell: pwsh
        run: .github/scripts/media-foundation.ps1 wait -Seconds 120
      - name: Check the outcome
        shell: bash
        env:
          CASE: ${{ matrix.case }}
          OUTCOME: ${{ steps.wait.outcome }}
        run: |
          echo "case $CASE: wait step $OUTCOME"
          if [ "$CASE" = enabled ]; then [ "$OUTCOME" = success ]; else [ "$OUTCOME" = failure ]; fi
