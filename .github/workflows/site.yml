name: Website

# Deploys the website in site/ to GitHub Pages: https://lucas-angelo.github.io/swarmcast/
# The build and tests are _site.yml; pull requests run them through pipeline.yml (no deploy).
#
# - push to main touching the site: build, test, deploy;
# - after "Usage stats" (stats.yml) succeeds: rebuild with the fresh numbers, then deploy;
# - workflow_dispatch: build; deploys only when run on main.
#
# Needs Settings → Pages → Source: "GitHub Actions" (the deploy job fails until then).
# The usage numbers are read from the `stats` branch written by stats.yml; without it the
# site just hides them.
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/img/**'
      - 'assets/brand/**'
      - 'apps/admin/src/onboarding/img/**'
      - 'packages/shared/src/i18n/**'
      - 'packages/shared/web/font-licenses.mjs'
      - '.github/actions/**'
      - '.github/workflows/site.yml'
      - '.github/workflows/_site.yml'
  workflow_run:
    workflows: [Usage stats]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Website
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    uses: ./.github/workflows/_site.yml
    with:
      pages: ${{ github.ref == 'refs/heads/main' }}

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
