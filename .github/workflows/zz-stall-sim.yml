name: cache stall simulation (temporary)
# Temporary, on soak/cache-stall-sim only: `npm ci` from the registry (no npm cache) when some
# connections to registry.npmjs.org stop delivering data mid-transfer (one in five connections,
# after 100 kB of reply), with npm's defaults and with the limits the setup action sets.
on:
  push:
    branches: [soak/cache-stall-sim]
permissions:
  contents: read
jobs:
  npm:
    name: registry stalls mid-transfer, ${{ matrix.config }}
    strategy:
      fail-fast: false
      matrix:
        config: [npm defaults, setup limits]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          package-manager-cache: false
      - name: npm ci with stalled connections
        env:
          CONFIG: ${{ matrix.config }}
        run: |
          if [ "$CONFIG" = "setup limits" ]; then
            npm config set fetch-timeout 60000 --location=user
            npm config set fetch-retries 4 --location=user
          fi
          echo "fetch-timeout=$(npm config get fetch-timeout) fetch-retries=$(npm config get fetch-retries)"
          for t in iptables ip6tables; do
            sudo "$t" -t mangle -A OUTPUT -p tcp --dport 443 -m string --string "registry.npmjs.org" --algo bm -m statistic --mode random --probability 0.2 -j CONNMARK --set-mark 7
            sudo "$t" -A INPUT -p tcp --sport 443 -m connmark --mark 7 -m connbytes --connbytes 100000: --connbytes-dir reply --connbytes-mode bytes -j DROP
          done
          start=$SECONDS
          npm ci --prefer-offline --no-audit --no-fund
          echo "NPM_CI_SECONDS=$((SECONDS - start))"
          sudo iptables -L INPUT -n -v | grep DROP
