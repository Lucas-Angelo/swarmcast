name: windows

# The Windows end-to-end suites (pipeline.yml test stage) on fresh GitHub-hosted VMs: each takes
# the real windows-x64 package (pkg-windows-x64 from _build.yml, plus the "newer" one for the
# update tests), assembles the release folders and installer zip like release.yml, serves them
# locally and drives the real start script with a bare-OS PATH, then the app with Google Chrome,
# Microsoft Edge and Firefox (Playwright), the real Cloudflare quick tunnel, direct mode, the
# quality ladder and real OBS Studio (scripts/test/windows). Each job writes its suite's results
# to its summary (.github/scripts/test-summary.mjs); `node scripts/test/windows/summarize.mjs` makes
# one table of all of them from the downloaded win-* artifacts.
on:
  workflow_call:
    inputs:
      runners:
        description: JSON list of Windows runners.
        type: string
        default: '["windows-latest"]'
      suites:
        description: JSON list of suites.
        type: string
        default: '["installer","app","quality","direct","obs"]'

permissions:
  contents: read

env:
  FORCE_COLOR: '1'

jobs:
  suite:
    name: ${{ matrix.suite }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.runners) }}
        suite: ${{ fromJSON(inputs.suites) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      # Firefox decodes H.264/AAC through Media Foundation, which Windows Server only has as an
      # optional feature (Windows 10/11 have it, except the "N" editions; client images such as
      # windows-11-arm have no Get-WindowsFeature). Installing it takes about 3 minutes (189 s
      # median), so it starts first, in its own process, and runs during setup; the step before
      # the suite waits for it.
      - name: Start installing Media Foundation for Firefox (app)
        if: matrix.suite == 'app'
        shell: pwsh
        run: |
          if (-not (Get-Command Get-WindowsFeature -ErrorAction SilentlyContinue)) { 'Client Windows: Media Foundation comes with the OS'; exit 0 }
          $dir = $env:RUNNER_TEMP
          @'
          param($Dir)
          $ErrorActionPreference = 'Stop'
          try {
            $f = Get-WindowsFeature Server-Media-Foundation
            $out = "Server-Media-Foundation before: $($f.InstallState)`n"
            if ($f.InstallState -ne 'Installed') { $out += Install-WindowsFeature Server-Media-Foundation | Format-List | Out-String }
            Set-Content (Join-Path $Dir 'media-foundation.log') $out
            Set-Content (Join-Path $Dir 'media-foundation.done') 'done'
          } catch {
            Set-Content (Join-Path $Dir 'media-foundation.log') ($_ | Out-String)
            Set-Content (Join-Path $Dir 'media-foundation.done') 'error'
          }
          '@ | Set-Content (Join-Path $dir 'media-foundation.ps1')
          $p = Start-Process powershell.exe -PassThru -WindowStyle Hidden -ArgumentList @('-NoProfile', '-NonInteractive', '-ExecutionPolicy', 'Bypass', '-File', (Join-Path $dir 'media-foundation.ps1'), $dir)
          "Media Foundation install started (PID $($p.Id))"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # ffmpeg is only for the test harness (OBS-like feed, FFMPEG_BIN); the installer and the
      # app run with a bare-OS PATH and never see it.
      - uses: ./.github/actions/setup
        timeout-minutes: 8
        with:
          ffmpeg: 'true'
      - uses: ./.github/actions/get-build
        timeout-minutes: 5
        with:
          names: pkg-windows-x64

      - name: Prepare
        env:
          SUITE: ${{ matrix.suite }}
          OS: ${{ matrix.os }}
        run: |
          echo "SC_ARTIFACTS=$RUNNER_TEMP/sc-artifacts" >> "$GITHUB_ENV"
          echo "SC_RUNNER_LABEL=$OS" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/sc-artifacts"
          # The installer suite also updates to the "newer" package _build.yml made.
          if [ "$SUITE" = installer ]; then
            echo "SC_NEWER=$(node -p "const v=require('./package.json').version.split('-')[0].split('.');v[2]=+v[2]+1;v.join('.')")" >> "$GITHUB_ENV"
          fi
      - name: Playwright Firefox
        timeout-minutes: 8
        if: matrix.suite == 'app'
        run: npx playwright install firefox
      - name: Assemble release folders and the installer zip
        run: node scripts/test/windows/make-release.mjs --out release/win-e2e ${SC_NEWER:+--newer "$SC_NEWER"}

      # 10 minutes is about 3 times the slowest install seen; past that, fail with what it printed.
      - name: Wait for Media Foundation (app)
        if: matrix.suite == 'app'
        timeout-minutes: 11
        shell: pwsh
        run: |
          if (-not (Get-Command Get-WindowsFeature -ErrorAction SilentlyContinue)) { 'Client Windows: Media Foundation comes with the OS'; exit 0 }
          $done = Join-Path $env:RUNNER_TEMP 'media-foundation.done'
          $log = Join-Path $env:RUNNER_TEMP 'media-foundation.log'
          $sw = [Diagnostics.Stopwatch]::StartNew()
          while (-not (Test-Path $done) -and $sw.Elapsed.TotalMinutes -lt 10) { Start-Sleep -Seconds 2 }
          if (Test-Path $log) { Get-Content $log }
          "Waited $([int]$sw.Elapsed.TotalSeconds) s"
          $f = Get-WindowsFeature Server-Media-Foundation
          "Server-Media-Foundation: $($f.InstallState)"
          if ($f.InstallState -ne 'Installed') { throw "Media Foundation is not installed ($($f.InstallState)); see above" }

      # 11 minutes: the slowest suite took 7.4 (installer). A step that runs out fails, so the
      # results and logs below are still uploaded (a job that runs out is cancelled).
      - name: Run the ${{ matrix.suite }} suite
        timeout-minutes: 11
        env:
          SUITE: ${{ matrix.suite }}
          OS: ${{ matrix.os }}
        run: node "scripts/test/windows/$SUITE.mjs" --work release/win-e2e ${SC_NEWER:+--newer "$SC_NEWER"} --out "$SC_ARTIFACTS/results-$SUITE-$OS.json"
      - name: Results in the job summary
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          SUITE: ${{ matrix.suite }}
          OS: ${{ matrix.os }}
        run: node .github/scripts/test-summary.mjs --title "Windows $SUITE suite ($OS)" --windows "$SC_ARTIFACTS/results-$SUITE-$OS.json"
      # No test is retried (README.md, "Rules"): a check the suite recorded as "passed on retry"
      # (lib.mjs checkWithRetry) failed first, so it fails the job here, whatever the suite's exit code.
      - name: No check passed only on a retry
        if: ${{ !cancelled() }}
        env:
          RESULTS: ${{ runner.temp }}/sc-artifacts/results-${{ matrix.suite }}-${{ matrix.os }}.json
        run: |
          [ -f "$RESULTS" ] || exit 0 # no results: the suite step has failed already
          # shellcheck disable=SC2016 # JavaScript in single quotes
          node -e '
            const retried = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).results.filter((r) => r.retry);
            const line = (s) => String(s).split("\n")[0].replaceAll("%", "%25");
            for (const r of retried) console.log(`::error title=Passed only on a retry::[${line(r.section)}] ${line(r.name)}: ${line(r.detail)}`);
            process.exit(retried.length ? 1 : 0);
          ' "$RESULTS"

      - name: Upload results, logs and screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        continue-on-error: true
        timeout-minutes: 5
        with:
          name: win-${{ matrix.suite }}-${{ matrix.os }}
          path: ${{ runner.temp }}/sc-artifacts
          if-no-files-found: warn
          retention-days: 14
      - uses: ./.github/actions/setup/save
        continue-on-error: true
        timeout-minutes: 3
        if: ${{ !cancelled() && (github.ref == 'refs/heads/main' || github.event_name == 'pull_request') }}
