name: CodeQL

# Note: uploading code scanning results from a private repository requires GitHub Code
# Security (Advanced Security). Public repositories get it for free.

# Runs monthly, manually (Actions tab / `gh workflow run`), or from a pull request comment
# such as `/run all` (see pr-commands.yml). No push triggers: Actions minutes are paid on a
# private repo.
on:
  schedule:
    - cron: '57 6 1 * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    # Code scanning on private repositories needs GitHub Advanced Security; run once public.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      # Needed by the CodeQL action to read workflow run metadata in private repositories.
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none
          # apps/tray (the Go tray helper) is built explicitly: it is a module in a subdirectory.
          - language: go
            build-mode: manual
          # The workflows themselves (injection, unpinned actions, excessive permissions...).
          - language: actions
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        if: matrix.language == 'go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.x
          cache-dependency-path: apps/tray/go.sum
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended
      - name: Build the tray helper
        if: matrix.language == 'go'
        working-directory: apps/tray
        run: go build ./...
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}
