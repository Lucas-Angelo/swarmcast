name: CodeQL

# Code scanning (security-extended queries) of the TypeScript/JavaScript, the Go tray helper
# and the workflows. Runs on pull requests and pushes to main (docs- and site-only changes
# skip it), monthly and manually.
on:
  pull_request:
    paths-ignore: &app-paths-ignore
      - '**.md'
      - 'docs/**'
      - 'site/**'
  push:
    branches: [main]
    paths-ignore: *app-paths-ignore
  schedule:
    - cron: '57 6 1 * *'
  workflow_dispatch:

permissions:
  contents: read

# Superseded pull request runs are cancelled; runs on main and schedules never are.
concurrency:
  group: codeql-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none
          # apps/tray (the Go tray helper) is built explicitly: it is a module in a subdirectory.
          - language: go
            build-mode: manual
          # The workflows themselves (injection, unpinned actions, excessive permissions...).
          - language: actions
            build-mode: none
          # The desktop shell (apps/desktop/src-tauri).
          - language: rust
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        if: matrix.language == 'go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.x
          cache-dependency-path: apps/tray/go.sum
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended
      - name: Build the tray helper
        if: matrix.language == 'go'
        working-directory: apps/tray
        run: go build ./...
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}
