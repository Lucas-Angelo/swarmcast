name: Release

# On a `v*` tag: check the tag, run the whole pipeline (pipeline.yml with `release: true`: every
# stage, the same as pull requests, with the desktop apps built in release flavour and signed
# with the updater key), sign and archive the script-mode packages the pipeline built, and
# publish the GitHub release only if everything passed.
#
# A published release is never changed (immutable releases, docs/RELEASING.md section 4): the
# release is created as a draft, every asset is uploaded and checked, the assets get a build
# provenance attestation, and only then is the draft published. Nothing edits it afterwards.
#
# The signing jobs name the `release` environment, whose secrets only `v*` tags can read. GitHub
# creates an environment that a workflow names and that does not exist yet (without rules or
# secrets; the repository secrets then still apply), so this works before and after it is set up.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

# One release run per tag; a release run is never cancelled by another one.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_COLOR: '1'

jobs:
  verify:
    name: Verify tag and changelog
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # For the updater key check: environment secrets are visible only to jobs that name it.
    environment: release
    outputs:
      version: ${{ steps.version.outputs.version }}
      channel: ${{ steps.channel.outputs.channel }}
      is_latest: ${{ steps.channel.outputs.is_latest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Every branch and tag: the tag commit must be on main or a maintenance branch.
          fetch-depth: 0
      - name: Tag must match package.json version
        id: version
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${version} (expected tag v${version})."
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      # A published release is never changed or replaced (installed apps and the scripts may
      # already have it): a re-pushed or moved tag of a released version stops here.
      - name: No release exists for this tag yet
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::A GitHub release for ${GITHUB_REF_NAME} already exists; it is never changed. Ship the next version instead (see docs/RELEASING.md)."
            exit 1
          fi
      # The desktop app's updater only installs packages signed with this key.
      - name: The updater signing key must be set
        env:
          HAS_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD != '' }}
        run: |
          if [ "$HAS_KEY" != true ]; then
            echo "::error::Set the TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD secrets (Settings > Environments > release, docs/RELEASING.md section 3): without them the desktop installers have no update signatures."
            exit 1
          fi
      # X.Y.Z (stable) or X.Y.Z-beta.N / X.Y.Z-rc.N (a pre-release, the beta channel); any other
      # pre-release identifier stops here (scripts/releases/version.mjs). is_latest: only a stable
      # version at least every published stable one becomes GitHub's "Latest" (a hotfix on an
      # older line does not take the download button back).
      - name: Release channel (stable, or beta for beta.N / rc.N)
        id: channel
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mapfile -t stable < <(gh release list -R "$GITHUB_REPOSITORY" --exclude-pre-releases --exclude-drafts --limit 1000 --json tagName --jq '.[].tagName')
          node scripts/releases/version.mjs "$VERSION" "${stable[@]}" | tee -a "$GITHUB_OUTPUT"
      - name: The tag is on main or a maintenance branch
        shell: bash
        run: |
          minor="$(node -p "require('./package.json').version.split('.').slice(0, 2).join('.')")"
          branches="$(git branch -r --contains "$GITHUB_SHA" --format '%(refname:short)')"
          echo "$branches"
          if ! grep -qxE "origin/main|origin/release/${minor//./\\.}" <<<"$branches"; then
            echo "::error::${GITHUB_REF_NAME} (${GITHUB_SHA}) is not on main or release/${minor}: tag the release commit there (docs/RELEASING.md, section 4)."
            exit 1
          fi
      # A new minor or major ships to everyone only after its beta: X.Y.0 needs a published
      # X.Y.0-beta.N or X.Y.0-rc.N (patch releases normally skip betas).
      - name: A new minor was a beta first
        if: steps.channel.outputs.channel == 'stable'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          [[ "$VERSION" == *.0 ]] || { echo "Patch release: no beta needed."; exit 0; }
          betas="$(gh release list -R "$GITHUB_REPOSITORY" --exclude-drafts --limit 1000 --json tagName,isPrerelease \
            --jq '.[] | select(.isPrerelease) | .tagName' | grep -xE "v${VERSION//./\\.}-(beta|rc)\.[0-9]+" || true)"
          if [ -z "$betas" ]; then
            echo "::error::v${VERSION} is a new minor: publish and verify v${VERSION}-beta.1 first (docs/RELEASING.md, section 4)."
            exit 1
          fi
          echo "Published pre-releases of ${VERSION}:"; echo "$betas"
      # Stable: its own `## [X.Y.Z]` section. Pre-release: `## [Unreleased]`, which becomes the
      # X.Y.Z section when the stable version ships. Either becomes the release notes and the
      # update dialog, so it must not be empty.
      - name: CHANGELOG.md has the release notes
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          CHANNEL: ${{ steps.channel.outputs.channel }}
        run: |
          section="${VERSION}"
          [ "$CHANNEL" = beta ] && section="Unreleased"
          node scripts/releases/notes.mjs --section "$section" CHANGELOG.md > /dev/null

  # ---- Gate: the whole pipeline. Nothing is signed or published unless all of it passes. ----
  # It builds the desktop installers in release flavour (updater artifacts signed with the
  # Tauri key) and tests them on every OS; publish uploads the very artifacts that were tested.
  pipeline:
    name: Pipeline
    needs: verify
    uses: ./.github/workflows/pipeline.yml
    with:
      release: true
    secrets:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

  # The script-mode packages the pipeline built and tested (pkg-<target>: release/staging), signed
  # when the code-signing secrets exist, smoke-tested on their own platform and archived.
  build:
    name: Sign ${{ matrix.target }}
    needs: [verify, pipeline]
    strategy:
      fail-fast: true
      matrix:
        include:
          - { target: windows-x64, os: windows-latest }
          - { target: macos-arm64, os: macos-latest }
          - { target: macos-x64, os: macos-15-intel }
          - { target: linux-x64, os: ubuntu-24.04 }
          - { target: linux-arm64, os: ubuntu-24.04-arm }
    runs-on: ${{ matrix.os }}
    environment: release
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      TARGET: ${{ matrix.target }}
      STAGING: release/staging/${{ matrix.target }}
      # Only "true"/"false" here: the secrets themselves are mapped into the signing steps
      # alone, so nothing else in the job sees them.
      MACOS_SIGNING: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 != '' && secrets.MACOS_CERTIFICATE_PASSWORD != '' && secrets.MACOS_SIGN_IDENTITY != '' }}
      MACOS_NOTARIZE: ${{ secrets.APPLE_ID != '' && secrets.APPLE_TEAM_ID != '' && secrets.APPLE_APP_PASSWORD != '' }}
      WINDOWS_SIGNING: ${{ secrets.WINDOWS_CERTIFICATE_PFX_BASE64 != '' && secrets.WINDOWS_CERTIFICATE_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          npm-ci: 'false'
      - uses: ./.github/actions/get-build
        with:
          names: pkg-${{ matrix.target }}
      - name: The staged package is this version
        run: |
          staged="$(cat "$STAGING/VERSION")"
          [ "$staged" = "$VERSION" ] || { echo "::error::$STAGING is version $staged, not $VERSION"; exit 1; }

      # ---- macOS code signing (skipped unless the MACOS_* secrets exist) ----
      - name: Import macOS signing certificate
        if: runner.os == 'macOS' && env.MACOS_SIGNING == 'true'
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/swarmcast-signing.keychain-db"
          keychain_password="$(openssl rand -base64 32)"
          cert="$RUNNER_TEMP/certificate.p12"
          printf '%s' "$MACOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$cert"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$cert" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" -f pkcs12 -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" > /dev/null
          # Put the temporary keychain first in the search list, keeping the existing ones.
          existing="$(security list-keychains -d user | tr -d '"' | xargs)"
          # shellcheck disable=SC2086 # word splitting of the keychain list is intended
          security list-keychains -d user -s "$keychain" $existing
          rm -f "$cert"
          echo "MACOS_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      - name: Sign macOS binaries
        if: runner.os == 'macOS' && env.MACOS_SIGNING == 'true'
        env:
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          # The swarmcast binary embeds Node.js: V8's JIT needs these entitlements under the
          # hardened runtime (same set as the official Node.js macOS builds).
          entitlements="$RUNNER_TEMP/node-entitlements.plist"
          cat > "$entitlements" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>com.apple.security.cs.allow-jit</key><true/>
            <key>com.apple.security.cs.allow-unsigned-executable-memory</key><true/>
            <key>com.apple.security.cs.disable-library-validation</key><true/>
          </dict>
          </plist>
          PLIST
          found=0
          while IFS= read -r -d '' bin; do
            found=$((found + 1))
            extra=()
            if [ "$(basename "$bin")" = swarmcast ]; then extra=(--entitlements "$entitlements"); fi
            echo "Signing $bin"
            codesign --force --options runtime --timestamp --keychain "$MACOS_KEYCHAIN" \
              --sign "$MACOS_SIGN_IDENTITY" "${extra[@]}" "$bin"
            codesign --verify --strict --verbose=2 "$bin"
          done < <(find "$STAGING" -type f \( -name swarmcast -o -name mediamtx -o -name cloudflared -o -name swarmcast-tray \) -print0)
          if [ "$found" -ne 4 ]; then
            echo "::error::Expected 4 binaries to sign in $STAGING, found $found."
            exit 1
          fi

      # ---- Windows code signing (skipped unless the WINDOWS_* secrets exist) ----
      - name: Sign Windows binaries
        if: runner.os == 'Windows' && env.WINDOWS_SIGNING == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PFX_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_PFX_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $pfx = Join-Path $env:RUNNER_TEMP 'certificate.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_PFX_BASE64))
          try {
            $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
              Where-Object { $_.FullName -match '\\x64\\' } |
              Sort-Object FullName -Descending |
              Select-Object -First 1
            if (-not $signtool) { throw 'signtool.exe not found' }
            $ours = @('swarmcast.exe', 'swarmcast-tray.exe')
            $names = $ours + @('mediamtx.exe', 'cloudflared.exe')
            $files = Get-ChildItem $env:STAGING -Recurse -File | Where-Object { $names -contains $_.Name }
            if ($files.Count -ne $names.Count) { throw "Expected $($names.Count) binaries in $env:STAGING, found $($files.Count)" }
            foreach ($file in $files) {
              # Keep a third-party vendor's valid Authenticode signature instead of replacing it.
              if (($ours -notcontains $file.Name) -and (Get-AuthenticodeSignature $file.FullName).Status -eq 'Valid') {
                Write-Host "Already signed by its vendor: $($file.FullName)"
                continue
              }
              Write-Host "Signing $($file.FullName)"
              & $signtool.FullName sign /f $pfx /p $env:WINDOWS_CERTIFICATE_PASSWORD /fd sha256 /tr http://timestamp.digicert.com /td sha256 $file.FullName
              if ($LASTEXITCODE -ne 0) { throw "signtool sign failed for $($file.Name)" }
              & $signtool.FullName verify /pa $file.FullName
              if ($LASTEXITCODE -ne 0) { throw "signtool verify failed for $($file.Name)" }
            }
          } finally {
            Remove-Item $pfx -Force -ErrorAction SilentlyContinue
          }

      # Runs the (signed, when signing is configured) staged build on its own platform.
      - name: Smoke test
        run: |
          exe=swarmcast
          if [ "$RUNNER_OS" = Windows ]; then exe=swarmcast.exe; fi
          "$STAGING/$exe" --smoke-test

      - name: Notarize macOS build
        if: runner.os == 'macOS' && env.MACOS_SIGNING == 'true' && env.MACOS_NOTARIZE == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          zip="$RUNNER_TEMP/swarmcast-notarize.zip"
          ditto -c -k --keepParent "$STAGING" "$zip"
          xcrun notarytool submit "$zip" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" --wait --timeout 30m --output-format json > "$RUNNER_TEMP/notary.json" || true
          cat "$RUNNER_TEMP/notary.json"
          status="$(node -p "JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8')).status" "$RUNNER_TEMP/notary.json")"
          if [ "$status" != Accepted ]; then
            id="$(node -p "JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8')).id" "$RUNNER_TEMP/notary.json")"
            xcrun notarytool log "$id" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" || true
            echo "::error::Notarization finished with status '$status'."
            exit 1
          fi

      - name: Remove temporary keychain
        if: always() && env.MACOS_KEYCHAIN != ''
        run: security delete-keychain "$MACOS_KEYCHAIN" || true

      - name: Archive
        run: node scripts/build/archive.mjs --target "$TARGET" --version "$VERSION"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: swarmcast-${{ matrix.target }}
          path: release/SwarmCast-v${{ env.VERSION }}-${{ matrix.target }}.*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    name: Publish GitHub release
    needs: [verify, pipeline, build]
    runs-on: ubuntu-24.04
    environment: release
    timeout-minutes: 15
    permissions:
      contents: write # create and publish the release
      id-token: write # sign the build provenance attestation (Sigstore)
      attestations: write # store it with the repository's attestations
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      TAG: ${{ github.ref_name }}
      CHANNEL: ${{ needs.verify.outputs.channel }}
      IS_LATEST: ${{ needs.verify.outputs.is_latest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          npm-ci: 'false'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: swarmcast-*
          merge-multiple: true
          path: release
      # binaries.json: publisher URLs + SHA-256 of the tools SwarmCast does not ship (ffmpeg,
      # "bundle": false in versions.json). The standalone start scripts read it to download
      # ffmpeg on the user's machine straight from its publisher. Listed in SHA256SUMS.txt.
      - name: Add binaries.json (ffmpeg pins)
        run: node scripts/build/binaries-json.mjs release/binaries.json
      - name: Add start scripts
        run: |
          cp scripts/start-windows.ps1 scripts/start-windows.cmd scripts/start-linux.sh scripts/start-macos.command release/
          # Same script under a .sh name, for `curl ... | bash`-style use on macOS.
          cp scripts/start-macos.command release/start-macos.sh
          chmod 755 release/start-macos.command release/start-macos.sh release/start-linux.sh
          # .gitattributes checks these out with CRLF; cmd.exe needs it for the .cmd.
          for f in release/start-windows.ps1 release/start-windows.cmd; do
            if grep -q $'[^\r]$' "$f" || grep -qx '' "$f"; then
              echo "::error::$f does not have CRLF line endings."
              exit 1
            fi
          done

      # One zip per platform for an offline script install: the start script(s), the package,
      # a one-line SHA256SUMS.txt (the scripts install from these local files), a short
      # README.txt and the full guide in both languages.
      - name: Build installer bundles
        run: |
          guides="$RUNNER_TEMP/guides"
          mkdir -p "$guides"
          # Generated from the website's pages (site/offline-guide.json): one source for both.
          node scripts/build/guide-html.mjs "$guides/READ-ME - How to go live.html" --lang en --version "$VERSION"
          node scripts/build/guide-html.mjs "$guides/LEIA-ME - Como fazer a live.html" --lang pt-BR --version "$VERSION"

          # README.txt: UTF-8 with BOM (Notepad/TextEdit pick the encoding), CRLF for Windows.
          readme() {
            local guide_en='Full step-by-step guide (OBS, going live, problems): open "READ-ME - How to go live.html".'
            local guide_pt='Guia completo passo a passo (OBS, live, problemas): abra "LEIA-ME - Como fazer a live.html".'
            printf '\xef\xbb\xbf'
            case "$1" in
              windows-*)
                sed 's/$/\r/' <<EOF
          EN: 1) Extract this zip (right-click > Extract All). 2) In the extracted folder, double-click start-windows.cmd.
          EN: First run: if "Windows protected your PC" appears, click "More info" > "Run anyway" (and "Run" if asked).
          EN: It installs or updates SwarmCast and opens the panel in your browser. Keep its window open while you stream.
          EN: $guide_en
          PT: 1) Extraia este zip (botão direito > Extrair tudo). 2) Na pasta extraída, dê dois cliques em start-windows.cmd.
          PT: Primeira vez: se aparecer "O Windows protegeu o computador", clique em "Mais informações" > "Executar assim mesmo".
          PT: Ele instala ou atualiza o SwarmCast e abre o painel no navegador. Deixe a janela aberta durante a live.
          PT: $guide_pt
          EOF
                ;;
              macos-*)
                cat <<EOF
          EN: 1) Double-click this zip to extract it. 2) In the extracted folder, double-click start-macos.command.
          EN: First run: macOS blocks it. Right-click the file > Open > Open. macOS 15+: System Settings > Privacy & Security > Open Anyway.
          EN: It installs or updates SwarmCast and opens the panel in your browser. Keep its window open while you stream.
          EN: $guide_en
          PT: 1) Dê dois cliques neste zip para extrair. 2) Na pasta extraída, dê dois cliques em start-macos.command.
          PT: Primeira vez: o macOS bloqueia. Botão direito no arquivo > Abrir > Abrir. macOS 15+: Ajustes > Privacidade e Segurança > Abrir Mesmo Assim.
          PT: Ele instala ou atualiza o SwarmCast e abre o painel no navegador. Deixe a janela aberta durante a live.
          PT: $guide_pt
          EOF
                ;;
              linux-*)
                cat <<EOF
          EN: 1) Extract this zip. 2) Open a terminal in the extracted folder and run: ./start-linux.sh
          EN: No sudo needed; only if curl/tar are missing it explains why and asks for your password to install them.
          EN: It installs or updates SwarmCast and opens the panel in your browser. Keep the terminal open while you stream.
          EN: $guide_en
          PT: 1) Extraia este zip. 2) Abra um terminal na pasta extraída e rode: ./start-linux.sh
          PT: Não precisa de sudo; só se curl/tar estiverem faltando ele explica o motivo e pede sua senha para instalá-los.
          PT: Ele instala ou atualiza o SwarmCast e abre o painel no navegador. Deixe o terminal aberto durante a live.
          PT: $guide_pt
          EOF
                ;;
            esac
          }

          for target in windows-x64 macos-arm64 macos-x64 linux-x64 linux-arm64; do
            case "$target" in
              windows-*) pkg="SwarmCast-v${VERSION}-${target}.zip"; scripts=(start-windows.cmd start-windows.ps1) ;;
              macos-*) pkg="SwarmCast-v${VERSION}-${target}.tar.gz"; scripts=(start-macos.command) ;;
              *) pkg="SwarmCast-v${VERSION}-${target}.tar.gz"; scripts=(start-linux.sh) ;;
            esac
            if [ ! -f "release/$pkg" ]; then
              echo "::error::Missing release/$pkg"
              exit 1
            fi
            dir="$RUNNER_TEMP/bundles/$target"
            rm -rf "$dir"
            mkdir -p "$dir"
            for f in "${scripts[@]}"; do cp "release/$f" "$dir/"; done
            cp "release/$pkg" release/binaries.json "$guides"/*.html "$dir/"
            # The package and binaries.json (the zip downloads ffmpeg online when it can).
            (cd release && sha256sum "$pkg" binaries.json) > "$dir/SHA256SUMS.txt"
            readme "$target" > "$dir/README.txt"
            chmod 644 "$dir"/*
            case "$target" in
              macos-*) chmod 755 "$dir/start-macos.command" ;;
              linux-*) chmod 755 "$dir/start-linux.sh" ;;
            esac
            # Info-ZIP stores the Unix permissions, so the start script stays executable.
            out="$GITHUB_WORKSPACE/release/SwarmCast-v${VERSION}-${target}-installer.zip"
            files=("${scripts[@]}" "$pkg" binaries.json SHA256SUMS.txt README.txt "READ-ME - How to go live.html" "LEIA-ME - Como fazer a live.html")
            (cd "$dir" && zip -X -q "$out" "${files[@]}")
            unzip -Z "$out"
          done
          for t in macos-arm64 macos-x64; do
            unzip -Z "release/SwarmCast-v${VERSION}-${t}-installer.zip" start-macos.command | grep -q '^-rwxr-xr-x' ||
              { echo "::error::start-macos.command lost its executable bit in the $t zip."; exit 1; }
          done
          for t in linux-x64 linux-arm64; do
            unzip -Z "release/SwarmCast-v${VERSION}-${t}-installer.zip" start-linux.sh | grep -q '^-rwxr-xr-x' ||
              { echo "::error::start-linux.sh lost its executable bit in the $t zip."; exit 1; }
          done

      # --- uninstallers (scripts/uninstall-*) ---
      # Release assets, and each installer zip gets its platform's uninstaller (zip adds
      # the files to the archive built above).
      - name: Add uninstall scripts
        run: |
          cp scripts/uninstall-windows.ps1 scripts/uninstall-windows.cmd scripts/uninstall-linux.sh scripts/uninstall-macos.command release/
          chmod 755 release/uninstall-linux.sh release/uninstall-macos.command
          for f in release/uninstall-windows.ps1 release/uninstall-windows.cmd; do
            if grep -q $'[^\r]$' "$f" || grep -qx '' "$f"; then
              echo "::error::$f does not have CRLF line endings."
              exit 1
            fi
          done
          for target in windows-x64 macos-arm64 macos-x64 linux-x64 linux-arm64; do
            case "$target" in
              windows-*) files=(uninstall-windows.cmd uninstall-windows.ps1) ;;
              macos-*) files=(uninstall-macos.command) ;;
              *) files=(uninstall-linux.sh) ;;
            esac
            dir="$RUNNER_TEMP/uninstall/$target"
            rm -rf "$dir"
            mkdir -p "$dir"
            for f in "${files[@]}"; do cp "release/$f" "$dir/"; done
            chmod 644 "$dir"/*
            case "$target" in
              macos-*) chmod 755 "$dir/uninstall-macos.command" ;;
              linux-*) chmod 755 "$dir/uninstall-linux.sh" ;;
            esac
            out="$GITHUB_WORKSPACE/release/SwarmCast-v${VERSION}-${target}-installer.zip"
            if [ ! -f "$out" ]; then
              echo "::error::Missing $out"
              exit 1
            fi
            (cd "$dir" && zip -X -q "$out" "${files[@]}")
            for f in "${files[@]}"; do
              unzip -Z "$out" "$f" >/dev/null || { echo "::error::$f is missing from the $target installer zip."; exit 1; }
            done
            case "$target" in
              macos-*) f=uninstall-macos.command ;;
              linux-*) f=uninstall-linux.sh ;;
              *) f="" ;;
            esac
            if [ -n "$f" ]; then
              unzip -Z "$out" "$f" | grep -q '^-rwxr-xr-x' ||
                { echo "::error::$f lost its executable bit in the $target zip."; exit 1; }
            fi
          done
      # --- end uninstallers ---

      # notes.md goes into latest.json (the app's update dialog); the release page also gets, for a
      # pre-release, what a beta is and where to report on it (notes-page.md).
      - name: Extract release notes from CHANGELOG.md
        run: |
          section="$VERSION"
          [ "$CHANNEL" = beta ] && section="Unreleased"
          node scripts/releases/notes.mjs --section "$section" CHANGELOG.md > notes.md
          if [ "$CHANNEL" = beta ]; then
            {
              echo "**Beta version** of the next update: new features, may have bugs. Your settings are kept."
              echo "Desktop app: turn on **Get beta versions** on the panel's Desktop app card to get it (and the next betas) as updates;"
              echo "turn it off at any time, and you stay on the beta until the next stable version is newer."
              echo "Found a problem? Tell us in [Discussions → Beta feedback](https://github.com/${GITHUB_REPOSITORY}/discussions/categories/beta-feedback)."
              echo
              cat notes.md
            } > notes-page.md
          else
            cp notes.md notes-page.md
          fi
          cat notes-page.md

      # ---- Desktop app: the tested installers + .sig (desktop.yml) and the updater manifest ----
      - name: Download the desktop installers
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: desktop-*
          merge-multiple: true
          path: release/desktop
      # latest.json: what the app's updater reads at releases/latest/download/latest.json
      # (version, notes, per-platform URL + signature). /latest skips pre-releases.
      - name: Add latest.json (desktop updater manifest)
        run: |
          node scripts/build/updater-manifest.mjs --version "$VERSION" --notes-file notes.md --require-all \
            --base-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}" --out release/latest.json release/desktop
          mv release/desktop/* release/
          rmdir release/desktop

      - name: Generate SHA256SUMS.txt
        run: node scripts/build/checksums.mjs release

      # Draft first: nobody sees the release (and /releases/latest does not move) until every
      # asset is there. A draft left by an earlier failed attempt of this tag was never public, so
      # it is deleted; a published release is never touched (checked again right here).
      - name: Create the release as a draft, with every asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l release
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::A published release for $TAG exists; it is never changed."
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq ".[] | select(.draft and .tag_name == \"$TAG\") | .id" | while read -r id; do
            echo "Deleting the unpublished draft $id of an earlier attempt"
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
          done
          # A pre-release is never "Latest": /releases/latest (stable apps, the start scripts, the
          # site's download button) keeps pointing at the stable release.
          flags=(--latest="$IS_LATEST")
          if [ "$CHANNEL" = beta ]; then flags=(--prerelease --latest=false); fi
          gh release create "$TAG" release/* --draft --verify-tag --title "SwarmCast $TAG" --notes-file notes-page.md "${flags[@]}"
      - name: Every asset is on the draft, byte for byte the same size
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq ".[] | select(.draft and .tag_name == \"$TAG\") | .id" | head -n 1)"
          [ -n "$id" ] || { echo "::error::no draft release for $TAG"; exit 1; }
          echo "DRAFT_ID=$id" >> "$GITHUB_ENV"
          gh api "repos/$GITHUB_REPOSITORY/releases/$id/assets?per_page=100" --paginate \
            --jq '.[] | select(.state == "uploaded") | "\(.name) \(.size)"' | sort > "$RUNNER_TEMP/remote.txt"
          (cd release && for f in *; do [ -f "$f" ] && echo "$f $(stat -c %s "$f")"; done) | sort > "$RUNNER_TEMP/local.txt"
          if ! diff -u "$RUNNER_TEMP/local.txt" "$RUNNER_TEMP/remote.txt"; then
            echo "::error::the draft's assets differ from release/ (above: - local, + on the draft)"
            exit 1
          fi
          echo "$(wc -l < "$RUNNER_TEMP/local.txt") assets on the draft"
      # Build provenance for every asset (SHA-256 subjects), verifiable with
      # `gh attestation verify <file> -R Lucas-Angelo/swarmcast`.
      - name: Attest the assets
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release/*
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$DRAFT_ID" -F draft=false -f make_latest="$IS_LATEST" \
            --jq '"Published \(.html_url) (pre-release: \(.prerelease))"'
      # What stable apps read must not have moved for a pre-release.
      - name: releases/latest is the expected release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2>/dev/null || echo none)"
          echo "releases/latest: $latest"
          if [ "$CHANNEL" = beta ] && [ "$latest" = "$TAG" ]; then echo "::error::the pre-release $TAG became Latest"; exit 1; fi
          if [ "$IS_LATEST" = true ] && [ "$latest" != "$TAG" ]; then echo "::error::$TAG should be Latest, it is $latest"; exit 1; fi
