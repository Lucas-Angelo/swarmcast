name: Release

# On a `v*` tag: check the tag, run the whole pipeline (pipeline.yml with `release: true`: every
# stage, the same as pull requests, with the desktop apps built in release flavour and signed
# with the updater key), and publish the GitHub release only if everything passed. A release
# carries the desktop installers, the updater's files (.sig, .app.tar.gz, latest.json) and
# SHA256SUMS.txt, nothing else (docs/RELEASING.md section 4).
#
# A published release is never changed (immutable releases, docs/RELEASING.md section 4): the
# release is created as a draft, every asset is uploaded and checked, the assets get a build
# provenance attestation, and only then is the draft published. Nothing edits it afterwards.
#
# The jobs that sign or publish name the `release` environment, whose secrets only `v*` tags can read. GitHub
# creates an environment that a workflow names and that does not exist yet (without rules or
# secrets; the repository secrets then still apply), so this works before and after it is set up.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  actions: read # fetch-artifact's REST fallback reads this run's artifacts (.github/actions/fetch-artifact)

# One release run per tag; a release run is never cancelled by another one.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_COLOR: '1'

jobs:
  verify:
    name: Verify tag and changelog
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # For the updater key check: environment secrets are visible only to jobs that name it.
    environment: release
    outputs:
      version: ${{ steps.version.outputs.version }}
      channel: ${{ steps.channel.outputs.channel }}
      is_latest: ${{ steps.channel.outputs.is_latest }}
    steps:
      # A macOS VM can lose DNS for its first minute: in a 10x stability run actions/checkout's three
      # tries all failed with "Could not resolve host: github.com" (run 41283766285). Wait up to
      # 3 minutes for github.com before checking out (an infrastructure wait: workflows/README.md).
      - name: Wait for github.com (macOS)
        if: runner.os == 'macOS'
        timeout-minutes: 4
        shell: bash
        run: |
          start=$SECONDS
          for i in $(seq 1 36); do
            if curl -sS -o /dev/null --connect-timeout 5 --max-time 10 https://github.com; then
              [ "$i" = 1 ] || echo "::warning::github.com answered only after $((SECONDS - start)) s ($i tries)"
              exit 0
            fi
            sleep 5
          done
          echo "::warning::github.com still unreachable after $((SECONDS - start)) s; continuing"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Every branch and tag: the tag commit must be on main or a maintenance branch.
          fetch-depth: 0
      - name: Tag must match package.json version
        id: version
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${version} (expected tag v${version})."
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      # A published release is never changed or replaced (installed apps may already have it):
      # a re-pushed or moved tag of a released version stops here.
      - name: No release exists for this tag yet
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::A GitHub release for ${GITHUB_REF_NAME} already exists; it is never changed. Ship the next version instead (see docs/RELEASING.md)."
            exit 1
          fi
      # The desktop app's updater only installs packages signed with this key.
      - name: The updater signing key must be set
        env:
          HAS_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD != '' }}
        run: |
          if [ "$HAS_KEY" != true ]; then
            echo "::error::Set the TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD secrets (Settings > Environments > release, docs/RELEASING.md section 3): without them the desktop installers have no update signatures."
            exit 1
          fi
      # X.Y.Z (stable) or X.Y.Z-beta.N / X.Y.Z-rc.N (a pre-release, the beta channel); any other
      # pre-release identifier stops here (scripts/releases/version.mjs). is_latest: only a stable
      # version at least every published stable one becomes GitHub's "Latest" (a hotfix on an
      # older line does not take the download button back).
      - name: Release channel (stable, or beta for beta.N / rc.N)
        id: channel
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mapfile -t stable < <(gh release list -R "$GITHUB_REPOSITORY" --exclude-pre-releases --exclude-drafts --limit 1000 --json tagName --jq '.[].tagName')
          node scripts/releases/version.mjs "$VERSION" "${stable[@]}" | tee -a "$GITHUB_OUTPUT"
      # Stable: main, or the maintenance branch release/X.Y. A pre-release may also be tagged on
      # the minor's release pull request branch release/X.Y.Z, before it is merged into main (main
      # only takes the stable version).
      - name: The tag is on main or a release branch
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mapfile -t branches < <(git branch -r --contains "$GITHUB_SHA" --format '%(refname:short)')
          node scripts/releases/version.mjs --on-branch "$VERSION" "${branches[@]}"
      # A new minor or major ships to everyone only after its beta: X.Y.0 needs a published
      # X.Y.0-beta.N or X.Y.0-rc.N (patch releases normally skip betas).
      - name: A new minor was a beta first
        if: steps.channel.outputs.channel == 'stable'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          [[ "$VERSION" == *.0 ]] || { echo "Patch release: no beta needed."; exit 0; }
          betas="$(gh release list -R "$GITHUB_REPOSITORY" --exclude-drafts --limit 1000 --json tagName,isPrerelease \
            --jq '.[] | select(.isPrerelease) | .tagName' | grep -xE "v${VERSION//./\\.}-(beta|rc)\.[0-9]+" || true)"
          if [ -z "$betas" ]; then
            echo "::error::v${VERSION} is a new minor: publish and verify v${VERSION}-beta.1 first (docs/RELEASING.md, section 4)."
            exit 1
          fi
          echo "Published pre-releases of ${VERSION}:"; echo "$betas"
      # Stable: its own `## [X.Y.Z]` section. Pre-release: `## [Unreleased]`, which becomes the
      # X.Y.Z section when the stable version ships. Either becomes the release notes and the
      # update dialog, so it must not be empty.
      - name: CHANGELOG.md has the release notes
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          CHANNEL: ${{ steps.channel.outputs.channel }}
        run: |
          section="${VERSION}"
          [ "$CHANNEL" = beta ] && section="Unreleased"
          node scripts/releases/notes.mjs --section "$section" CHANGELOG.md > /dev/null

  # ---- Gate: the whole pipeline. Nothing is signed or published unless all of it passes. ----
  # It builds the desktop installers in release flavour (updater artifacts signed with the
  # Tauri key) and tests them on every OS; publish uploads the very artifacts that were tested.
  pipeline:
    name: Pipeline
    needs: verify
    uses: ./.github/workflows/pipeline.yml
    with:
      release: true
    secrets:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

  publish:
    name: Publish GitHub release
    needs: [verify, pipeline]
    runs-on: ubuntu-24.04
    environment: release
    timeout-minutes: 15
    permissions:
      contents: write # create and publish the release
      id-token: write # sign the build provenance attestation (Sigstore)
      attestations: write # store it with the repository's attestations
      actions: read # fetch-artifact's REST fallback
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      TAG: ${{ github.ref_name }}
      CHANNEL: ${{ needs.verify.outputs.channel }}
      IS_LATEST: ${{ needs.verify.outputs.is_latest }}
    steps:
      # A macOS VM can lose DNS for its first minute: in a 10x stability run actions/checkout's three
      # tries all failed with "Could not resolve host: github.com" (run 41283766285). Wait up to
      # 3 minutes for github.com before checking out (an infrastructure wait: workflows/README.md).
      - name: Wait for github.com (macOS)
        if: runner.os == 'macOS'
        timeout-minutes: 4
        shell: bash
        run: |
          start=$SECONDS
          for i in $(seq 1 36); do
            if curl -sS -o /dev/null --connect-timeout 5 --max-time 10 https://github.com; then
              [ "$i" = 1 ] || echo "::warning::github.com answered only after $((SECONDS - start)) s ($i tries)"
              exit 0
            fi
            sleep 5
          done
          echo "::warning::github.com still unreachable after $((SECONDS - start)) s; continuing"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        timeout-minutes: 8
        with:
          npm-ci: 'false'
      # notes.md goes into latest.json (the app's update dialog); the release page also gets, for a
      # pre-release, what a beta is and where to report on it (notes-page.md).
      - name: Extract release notes from CHANGELOG.md
        run: |
          section="$VERSION"
          [ "$CHANNEL" = beta ] && section="Unreleased"
          node scripts/releases/notes.mjs --section "$section" CHANGELOG.md > notes.md
          if [ "$CHANNEL" = beta ]; then
            {
              echo "**Beta version** of the next update: new features, may have bugs. Your settings are kept."
              echo "Desktop app: turn on **Get beta versions** on the panel's Desktop app card to get it (and the next betas) as updates;"
              echo "turn it off at any time, and you stay on the beta until the next stable version is newer."
              echo "Found a problem? Tell us in [Discussions → Beta feedback](https://github.com/${GITHUB_REPOSITORY}/discussions/categories/beta-feedback)."
              echo
              cat notes.md
            } > notes-page.md
          else
            cp notes.md notes-page.md
          fi
          cat notes-page.md

      # ---- Desktop app: the tested installers + .sig (desktop.yml) and the updater manifest ----
      - name: Download the desktop installers
        uses: ./.github/actions/fetch-artifact
        timeout-minutes: 10
        with:
          pattern: desktop-*
          merge-multiple: true
          path: release/desktop
      # latest.json: what the app's updater reads at releases/latest/download/latest.json
      # (version, notes, per-platform URL + signature). /latest skips pre-releases.
      - name: Add latest.json (desktop updater manifest)
        run: |
          node scripts/build/updater-manifest.mjs --version "$VERSION" --notes-file notes.md --require-all \
            --base-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}" --out release/latest.json release/desktop
          mv release/desktop/* release/
          rmdir release/desktop
      # Only what the desktop app and its updater use: the installers, the updater's .app.tar.gz
      # and .sig files, latest.json (SHA256SUMS.txt is added next). Anything else stops here.
      - name: Nothing but the desktop installers and the updater's files
        run: |
          bad="$(find release -mindepth 1 -maxdepth 1 ! -name '*.dmg' ! -name '*-setup.exe' ! -name '*.deb' ! -name '*.AppImage' \
            ! -name '*.app.tar.gz' ! -name '*.sig' ! -name latest.json -printf '%f\n')"
          if [ -n "$bad" ]; then echo "::error::unexpected release assets: $(echo "$bad" | xargs)"; exit 1; fi

      - name: Generate SHA256SUMS.txt
        run: node scripts/build/checksums.mjs release

      # Draft first: nobody sees the release (and /releases/latest does not move) until every
      # asset is there. A draft left by an earlier failed attempt of this tag was never public, so
      # it is deleted; a published release is never touched (checked again right here).
      - name: Create the release as a draft, with every asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l release
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::A published release for $TAG exists; it is never changed."
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq ".[] | select(.draft and .tag_name == \"$TAG\") | .id" | while read -r id; do
            echo "Deleting the unpublished draft $id of an earlier attempt"
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
          done
          # A pre-release is never "Latest": /releases/latest (stable apps, the site's download
          # button) keeps pointing at the stable release.
          flags=(--latest="$IS_LATEST")
          if [ "$CHANNEL" = beta ]; then flags=(--prerelease --latest=false); fi
          gh release create "$TAG" release/* --draft --verify-tag --title "SwarmCast $TAG" --notes-file notes-page.md "${flags[@]}"
      - name: Every asset is on the draft, byte for byte the same size
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq ".[] | select(.draft and .tag_name == \"$TAG\") | .id" | head -n 1)"
          [ -n "$id" ] || { echo "::error::no draft release for $TAG"; exit 1; }
          echo "DRAFT_ID=$id" >> "$GITHUB_ENV"
          gh api "repos/$GITHUB_REPOSITORY/releases/$id/assets?per_page=100" --paginate \
            --jq '.[] | select(.state == "uploaded") | "\(.name) \(.size)"' | sort > "$RUNNER_TEMP/remote.txt"
          (cd release && for f in *; do [ -f "$f" ] && echo "$f $(stat -c %s "$f")"; done) | sort > "$RUNNER_TEMP/local.txt"
          if ! diff -u "$RUNNER_TEMP/local.txt" "$RUNNER_TEMP/remote.txt"; then
            echo "::error::the draft's assets differ from release/ (above: - local, + on the draft)"
            exit 1
          fi
          echo "$(wc -l < "$RUNNER_TEMP/local.txt") assets on the draft"
      # Build provenance for every asset (SHA-256 subjects), verifiable with
      # `gh attestation verify <file> -R Lucas-Angelo/swarmcast`.
      - name: Attest the assets
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release/*
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$DRAFT_ID" -F draft=false -f make_latest="$IS_LATEST" \
            --jq '"Published \(.html_url) (pre-release: \(.prerelease))"'
      # What stable apps read must not have moved for a pre-release.
      - name: releases/latest is the expected release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2>/dev/null || echo none)"
          echo "releases/latest: $latest"
          if [ "$CHANNEL" = beta ] && [ "$latest" = "$TAG" ]; then echo "::error::the pre-release $TAG became Latest"; exit 1; fi
          if [ "$IS_LATEST" = true ] && [ "$latest" != "$TAG" ]; then echo "::error::$TAG should be Latest, it is $latest"; exit 1; fi
