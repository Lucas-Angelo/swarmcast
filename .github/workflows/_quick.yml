name: quick

# The fast checks of the pipeline (pipeline.yml), on one Ubuntu runner: lint, typecheck, npm audit,
# the upstream-binaries check and cargo fmt. Every test stage waits for this job and for `build`,
# so it is kept about as short as `build` (p50 0.9 min): the unit tests, 0.8 of its 1.9 minutes,
# run in the node jobs on every OS (_node.yml), Ubuntu included.
on:
  workflow_call:

permissions:
  contents: read

env:
  FORCE_COLOR: '1'

jobs:
  quick:
    name: lint, typecheck, audit, fmt
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # A macOS VM can lose DNS for its first minute: in a 10x stability run actions/checkout's three
      # tries all failed with "Could not resolve host: github.com" (run 41283766285). Wait up to
      # 3 minutes for github.com before checking out (an infrastructure wait: workflows/README.md).
      - name: Wait for github.com (macOS)
        if: runner.os == 'macOS'
        timeout-minutes: 4
        shell: bash
        run: |
          start=$SECONDS
          for i in $(seq 1 36); do
            if curl -sS -o /dev/null --connect-timeout 5 --max-time 10 https://github.com; then
              [ "$i" = 1 ] || echo "::warning::github.com answered only after $((SECONDS - start)) s ($i tries)"
              exit 0
            fi
            sleep 5
          done
          echo "::warning::github.com still unreachable after $((SECONDS - start)) s; continuing"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        timeout-minutes: 8
      # The saved Rust toolchain for cargo fmt at the end, fetched now with the job's other caches.
      - uses: ./.github/actions/rust-toolchain/restore
        continue-on-error: true
        timeout-minutes: 4
      - run: npm run lint
      - run: npm run typecheck
      # Reads package-lock.json; fails on high or critical advisories in runtime dependencies.
      - name: npm audit (production dependencies)
        if: ${{ !cancelled() }}
        run: npm audit --omit=dev --audit-level=high

      # Reports MediaMTX/cloudflared releases newer than the pins in scripts/build/versions.json,
      # and a new upstream build of the pinned AppImage runtime (a rolling `continuous` release).
      # SwarmCast ships pinned, verified versions on purpose, so a newer release is only a warning
      # on pull requests, main and releases; the monthly scheduled run fails (the rot alarm). It
      # never opens PRs: run `node scripts/build/update-binaries.mjs` locally to apply the update.
      - name: Upstream binaries up to date
        if: ${{ !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          status=0
          node scripts/build/update-binaries.mjs --check 2>&1 | tee binaries.txt || status=$?
          {
            echo '## Upstream binaries'
            echo
            echo '```'
            cat binaries.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then
            if [ "$GITHUB_EVENT_NAME" = schedule ]; then exit "$status"; fi
            echo "::warning title=Upstream binaries::Newer MediaMTX/cloudflared releases or a new AppImage runtime build exist (see the job summary); run node scripts/build/update-binaries.mjs to update the pins (the runtime by hand, docs/RELEASING.md section 8)."
          fi

      # The pinned toolchain with rustfmt, from the runner image or the saved copy, which the job
      # restored at its start (after setup): no download from static.rust-lang.org unless neither
      # has it (README.md, "Rust toolchain").
      - name: Rust toolchain for cargo fmt
        id: rust
        if: ${{ !cancelled() }}
        timeout-minutes: 6
        uses: ./.github/actions/rust-toolchain
        with:
          components: rustfmt
      - name: cargo fmt
        if: ${{ !cancelled() && steps.rust.outcome == 'success' }}
        env:
          TOOLCHAIN: ${{ steps.rust.outputs.toolchain }}
          RUSTUP_AUTO_INSTALL: '0'
          RUSTUP_DIST_SERVER: ${{ steps.rust.outputs.dist-server }}
        run: cargo "+$TOOLCHAIN" fmt --check --manifest-path apps/desktop/src-tauri/Cargo.toml
