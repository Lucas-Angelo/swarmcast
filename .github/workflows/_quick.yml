name: quick

# The fast checks of the pipeline (pipeline.yml), on one Ubuntu runner: lint, typecheck, unit tests
# (macOS and Windows run them in _node.yml), npm audit, the upstream-binaries check and cargo fmt.
on:
  workflow_call:

permissions:
  contents: read

env:
  FORCE_COLOR: '1'

jobs:
  quick:
    name: lint, typecheck, unit, audit, fmt
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # A macOS VM can lose DNS for its first minute: in a 10x stability run actions/checkout's three
      # tries all failed with "Could not resolve host: github.com" (run 41283766285). Wait up to
      # 3 minutes for github.com before checking out (an infrastructure wait: workflows/README.md).
      - name: Wait for github.com (macOS)
        if: runner.os == 'macOS'
        timeout-minutes: 4
        shell: bash
        run: |
          start=$SECONDS
          for i in $(seq 1 36); do
            if curl -sS -o /dev/null --connect-timeout 5 --max-time 10 https://github.com; then
              [ "$i" = 1 ] || echo "::warning::github.com answered only after $((SECONDS - start)) s ($i tries)"
              exit 0
            fi
            sleep 5
          done
          echo "::warning::github.com still unreachable after $((SECONDS - start)) s; continuing"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        timeout-minutes: 8
      # `npm test` also runs the website's unit tests (site/test/unit), which need its packages.
      - name: Install the website's dependencies
        run: npm ci --prefix site --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      # With coverage: Vitest fails the step when a floor is not met (scripts/coverage/floors.json).
      - name: Unit tests
        run: npm run coverage:unit
      # Kept for every run that was not cancelled (green ones too): per-test results and timings.
      - name: Upload the unit test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        continue-on-error: true
        timeout-minutes: 5
        with:
          name: vitest-unit-ubuntu-24.04
          path: test-results/vitest-unit.json
          if-no-files-found: warn
          retention-days: 14
      # The coverage table (with the floors) in the job summary; lcov, json-summary and the HTML
      # report as an artifact.
      - name: Unit coverage
        if: ${{ !cancelled() }}
        run: node scripts/coverage/report.mjs unit
      - name: Upload the unit coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        continue-on-error: true
        timeout-minutes: 5
        with:
          name: coverage-unit-ubuntu-24.04
          path: coverage/unit/
          if-no-files-found: warn
          retention-days: 14
      # Reads package-lock.json; fails on high or critical advisories in runtime dependencies.
      - name: npm audit (production dependencies)
        if: ${{ !cancelled() }}
        run: npm audit --omit=dev --audit-level=high

      # Reports MediaMTX/cloudflared releases newer than the pins in scripts/build/versions.json,
      # and a new upstream build of the pinned AppImage runtime (a rolling `continuous` release).
      # SwarmCast ships pinned, verified versions on purpose, so a newer release is only a warning
      # on pull requests, main and releases; the monthly scheduled run fails (the rot alarm). It
      # never opens PRs: run `node scripts/build/update-binaries.mjs` locally to apply the update.
      - name: Upstream binaries up to date
        if: ${{ !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          status=0
          node scripts/build/update-binaries.mjs --check 2>&1 | tee binaries.txt || status=$?
          {
            echo '## Upstream binaries'
            echo
            echo '```'
            cat binaries.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then
            if [ "$GITHUB_EVENT_NAME" = schedule ]; then exit "$status"; fi
            echo "::warning title=Upstream binaries::Newer MediaMTX/cloudflared releases or a new AppImage runtime build exist (see the job summary); run node scripts/build/update-binaries.mjs to update the pins (the runtime by hand, docs/RELEASING.md section 8)."
          fi

      - name: cargo fmt
        if: ${{ !cancelled() }}
        run: |
          channel="$(sed -n 's/^channel *= *"\(.*\)"$/\1/p' apps/desktop/src-tauri/rust-toolchain.toml)"
          rustup toolchain install "$channel" --profile minimal --component rustfmt --no-self-update
          cargo "+$channel" fmt --check --manifest-path apps/desktop/src-tauri/Cargo.toml
