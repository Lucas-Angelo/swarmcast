name: node

# Per OS (pipeline.yml test stage): the unit tests (macOS and Windows; Ubuntu runs them in
# `quick`), the integration tests (the parallel `integration` project, then the serial
# `integration-media` one: vitest.integration.config.ts), and the desktop shell's Rust checks
# (clippy, cargo test, crate licences, the glib advisory guard). Uses web-dist from _build.yml.
# When they changed (input scripts): the start and uninstall scripts against a fake release on
# 127.0.0.1 (scripts/test/run.sh; run.ps1 on Windows PowerShell 5.1). They need only Node.js and
# run here rather than in the clean-machine jobs, which are on the pipeline's critical path.
# Vitest writes its own job summary; cargo test and the script tests go through
# .github/scripts/test-summary.mjs. Test steps have their own time limit (2 to 7 times their
# slowest run), so a hung one fails and the steps that upload its results still run.
on:
  workflow_call:
    inputs:
      scripts:
        description: Also run the install-script tests.
        type: boolean
        default: true

permissions:
  contents: read
  actions: read # fetch-artifact's REST fallback reads this run's artifacts (.github/actions/fetch-artifact)

env:
  FORCE_COLOR: '1'
  CARGO_TERM_COLOR: always

jobs:
  node:
    name: unit, integration, rust${{ inputs.scripts && ', install scripts' || '' }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Pinned Ubuntu, so an image switch never lands in the middle of a change (ubuntu-latest
        # moves to 26.04 from 2026-10-19). The monthly run adds ubuntu-latest as a canary.
        os: ${{ fromJSON(github.event_name == 'schedule' && '["ubuntu-24.04","ubuntu-latest","windows-latest","macos-latest"]' || '["ubuntu-24.04","windows-latest","macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      # A macOS VM can lose DNS for its first minute: in a 10x stability run actions/checkout's three
      # tries all failed with "Could not resolve host: github.com" (run 41283766285). Wait up to
      # 3 minutes for github.com before checking out (an infrastructure wait: workflows/README.md).
      - name: Wait for github.com (macOS)
        if: runner.os == 'macOS'
        timeout-minutes: 4
        shell: bash
        run: |
          start=$SECONDS
          for i in $(seq 1 36); do
            if curl -sS -o /dev/null --connect-timeout 5 --max-time 10 https://github.com; then
              [ "$i" = 1 ] || echo "::warning::github.com answered only after $((SECONDS - start)) s ($i tries)"
              exit 0
            fi
            sleep 5
          done
          echo "::warning::github.com still unreachable after $((SECONDS - start)) s; continuing"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        timeout-minutes: 8
        with:
          ffmpeg: 'true'
          apt-debs: ${{ runner.os == 'Linux' && 'tauri-build' || '' }}
      - uses: ./.github/actions/get-build
        timeout-minutes: 10
        with:
          names: web-dist
      # MediaMTX and cloudflared for the host into vendor/<target>/, verified against the SHA-256
      # values pinned in scripts/build/versions.json (the integration tests run them). Before the
      # unit tests, so a unit failure does not leave the integration tests without them.
      - run: npm run fetch-bins
        timeout-minutes: 5

      # `npm test` also runs the website's unit tests (site/test/unit), which need its packages.
      # With coverage: Vitest fails the step when a floor is not met (scripts/coverage/floors.json).
      - name: Unit tests (macOS, Windows)
        if: runner.os != 'Linux'
        timeout-minutes: 5
        run: |
          npm ci --prefix site --no-audit --no-fund
          npm run coverage:unit
      - name: Upload the unit test results
        if: ${{ !cancelled() && runner.os != 'Linux' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        continue-on-error: true
        timeout-minutes: 5
        with:
          name: vitest-unit-${{ matrix.os }}
          path: test-results/vitest-unit.json
          if-no-files-found: warn
          retention-days: 14

      # Lifecycle tests that rely on POSIX signals skip themselves on Windows. With coverage, and
      # this OS's floors (vitest.integration.config.ts).
      - name: Integration tests
        timeout-minutes: 5
        if: ${{ !cancelled() }}
        run: npm run coverage:integration
      # Kept for every run that was not cancelled (green ones too): per-test results and timings,
      # and the fake OBS's ffmpeg stderr (fake-obs.log).
      - name: Upload the integration test results and logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        continue-on-error: true
        timeout-minutes: 5
        with:
          name: integration-${{ matrix.os }}
          path: |
            test-results/
            !test-results/vitest-unit.json
          if-no-files-found: warn
          retention-days: 14
      # The coverage tables of this job's Vitest runs (with their floors) in the job summary.
      - name: Unit and integration coverage
        if: ${{ !cancelled() }}
        env:
          SUITES: ${{ runner.os == 'Linux' && 'integration' || 'unit integration' }}
        run: |
          read -ra suites <<<"$SUITES"
          node scripts/coverage/report.mjs "${suites[@]}"

      # ---- apps/desktop/src-tauri ----
      - uses: ./.github/actions/setup-rust
        timeout-minutes: 8
        if: ${{ !cancelled() }}
        with:
          components: clippy,llvm-tools
          cache-key: checks
      - name: cargo clippy
        if: ${{ !cancelled() }}
        timeout-minutes: 6
        working-directory: apps/desktop/src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings
      # `cargo test --locked` instrumented by cargo-llvm-cov (scripts/coverage/desktop.mjs), then its
      # table and floors (scripts/coverage/floors.json) in the job summary.
      - name: cargo-llvm-cov
        if: ${{ !cancelled() }}
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-llvm-cov@0.9.1
      - name: cargo test
        id: cargo-test
        if: ${{ !cancelled() }}
        timeout-minutes: 6
        run: npm run coverage:desktop 2>&1 | tee "$RUNNER_TEMP/cargo-test.log"
      - name: Desktop coverage
        if: ${{ !cancelled() && steps.cargo-test.outcome == 'success' }}
        run: node scripts/coverage/report.mjs desktop --check
      - name: Upload the coverage reports
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 5
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ matrix.os }}
          path: coverage/
          if-no-files-found: warn
          retention-days: 14
      # Dependabot alert GHSA-wrw7-89jp-8q8g (glib 0.18, locked by Tauri 2's GTK 3 stack): not
      # exploitable while nothing compiled for Linux uses glib::VariantStrIter. This keeps it so.
      - name: glib advisory guard
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        run: node scripts/test/desktop/glib-advisory.mjs
      # Licences of the crates compiled into the app (this OS's target): fails on a crate with no
      # licence or one outside the allowed list, like the installer build does.
      - name: Crate licences
        if: ${{ !cancelled() }}
        run: node scripts/build/crate-licenses.mjs --check

      # ---- start and uninstall scripts ----
      - name: Install scripts (macOS / Linux)
        if: ${{ !cancelled() && inputs.scripts && runner.os != 'Windows' }}
        timeout-minutes: 6
        run: |
          {
            bash scripts/test/run.sh
            bash scripts/test/uninstall.sh
          } 2>&1 | tee "$RUNNER_TEMP/install-scripts.log"
      # From Git Bash (as soak.yml runs them), so the output also goes to the log for the summary.
      - name: Install scripts (Windows PowerShell 5.1)
        if: ${{ !cancelled() && inputs.scripts && runner.os == 'Windows' }}
        timeout-minutes: 6
        run: |
          {
            powershell.exe -NoProfile -ExecutionPolicy Bypass -File 'scripts\test\run.ps1'
            powershell.exe -NoProfile -ExecutionPolicy Bypass -File 'scripts\test\uninstall.ps1'
          } 2>&1 | tee "$RUNNER_TEMP/install-scripts.log"
      - name: Results in the job summary (cargo test, install scripts)
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          OS: ${{ matrix.os }}
          SCRIPTS: ${{ inputs.scripts }}
        run: |
          node .github/scripts/test-summary.mjs --title "cargo test ($OS)" --cargo "$RUNNER_TEMP/cargo-test.log"
          if [ "$SCRIPTS" = true ]; then
            node .github/scripts/test-summary.mjs --title "Start and uninstall scripts ($OS)" --lines "$RUNNER_TEMP/install-scripts.log"
          fi
      - uses: ./.github/actions/setup/save
        continue-on-error: true
        timeout-minutes: 3
        if: ${{ !cancelled() && (github.ref == 'refs/heads/main' || github.event_name == 'pull_request') }}
