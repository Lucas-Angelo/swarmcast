name: PR commands

# Run the (paid) pipelines on a pull request by commenting, instead of on every push:
#   /run all        CI + install scripts + pre-release check + Windows matrix
#   /run ci         lint, typecheck, unit, integration, E2E
#   /run scripts    installer/uninstaller tests on Windows, macOS, Linux
#   /run preflight  clean-machine check of the real package on Windows, macOS, Ubuntu
#   /run windows    exhaustive Windows matrix
# Only people with write access (owner, members, collaborators) can trigger runs.

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  dispatch:
    if: >-
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/run') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      pull-requests: write
      contents: read
    steps:
      - name: Start the requested workflows on the PR branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.issue.number }}
          BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          cmd="$(printf '%s' "$BODY" | head -n1 | awk '{print $2}')"
          case "$cmd" in
            all)       files="ci.yml scripts.yml preflight.yml windows.yml" ;;
            ci)        files="ci.yml" ;;
            scripts)   files="scripts.yml" ;;
            preflight) files="preflight.yml" ;;
            windows)   files="windows.yml" ;;
            *)
              gh pr comment "$PR" -R "$REPO" --body "Unknown command \`$cmd\`. Use \`/run all|ci|scripts|preflight|windows\`."
              exit 0 ;;
          esac
          head_repo="$(gh pr view "$PR" -R "$REPO" --json headRepositoryOwner,headRepository --jq '.headRepositoryOwner.login + "/" + .headRepository.name')"
          if [ "$head_repo" != "$REPO" ]; then
            gh pr comment "$PR" -R "$REPO" --body "Pipelines can only be started for branches in this repository."
            exit 0
          fi
          ref="$(gh pr view "$PR" -R "$REPO" --json headRefName --jq .headRefName)"
          started=""
          for f in $files; do
            gh workflow run "$f" -R "$REPO" --ref "$ref"
            started="$started \`$f\`"
          done
          gh pr comment "$PR" -R "$REPO" --body "Started:$started on \`$ref\`. Results: https://github.com/$REPO/actions"
