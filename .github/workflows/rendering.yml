name: Rendering

# The chat's nasty-string corpus and the viewer chat UI rendered by every browser engine on every
# desktop OS (docs/CHAT.md "Rendering checks", chat plan §10.4): apps/viewer/test/chat against the
# mock hub, with the OS's own fonts and shaper. Windows: Google Chrome, Microsoft Edge, Firefox;
# macOS: Safari's WebKit, Chrome, Firefox, an iPhone and a Pixel; Ubuntu: Chrome, Firefox, WebKit.
# The report of each job has a screenshot of the corpus per engine (playwright-report/chat-ui).
# Real phones and the iOS/Android system browsers stay a manual check before a release.
#
# Start it: the `rendering` label on a pull request (remove and add it again for another run), by
# hand once this file is on the default branch, or monthly. It reports separately: `ci-ok`
# (pipeline.yml) does not wait for it. The pull request gate already runs the same specs on
# Ubuntu and macOS (_e2e.yml, chat group).
on:
  pull_request:
    types: [labeled]
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: '23 8 3 * *'

permissions:
  contents: read

concurrency:
  group: rendering-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

env:
  FORCE_COLOR: '1'

jobs:
  render:
    name: ${{ matrix.os }}
    if: github.event_name != 'pull_request' || github.event.label.name == 'rendering'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            browsers: firefox
            projects: --project=chromium --project=firefox --project=edge
          - os: macos-latest
            browsers: firefox webkit
            projects: --project=chromium --project=firefox --project=webkit --project=mobile-webkit --project=mobile-chromium
          - os: ubuntu-24.04
            browsers: firefox webkit
            projects: --project=chromium --project=firefox --project=webkit
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      # A macOS VM can lose DNS for its first minute: in a 10x stability run actions/checkout's three
      # tries all failed with "Could not resolve host: github.com" (run 41283766285). Wait up to
      # 3 minutes for github.com before checking out (an infrastructure wait: workflows/README.md).
      - name: Wait for github.com (macOS)
        if: runner.os == 'macOS'
        timeout-minutes: 4
        shell: bash
        run: |
          start=$SECONDS
          for i in $(seq 1 36); do
            if curl -sS -o /dev/null --connect-timeout 5 --max-time 10 https://github.com; then
              [ "$i" = 1 ] || echo "::warning::github.com answered only after $((SECONDS - start)) s ($i tries)"
              exit 0
            fi
            sleep 5
          done
          echo "::warning::github.com still unreachable after $((SECONDS - start)) s; continuing"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Linux: the browsers' system libraries come from apt into the same .deb cache as _e2e.yml's.
      - uses: ./.github/actions/setup
        timeout-minutes: 8
        with:
          apt-debs: ${{ runner.os == 'Linux' && format('playwright-{0}', hashFiles('package-lock.json')) || '' }}
      - name: Build the viewer
        run: npm run build -w @swarmcast/shared && npm run build -w @swarmcast/viewer
      # The `chromium` projects run the runner image's Google Chrome (CI=true), Edge is preinstalled
      # on Windows; Firefox and WebKit come from Playwright. Their Linux libraries through
      # apt-retry.sh (time limit per try, retries, another mirror), as in _e2e.yml: `install
      # --with-deps` runs apt without a limit, and GitHub's mirror has stalled it for 20+ minutes.
      - name: Playwright browsers
        timeout-minutes: 10
        env:
          BROWSERS: ${{ matrix.browsers }}
        run: |
          # shellcheck disable=SC2086 # BROWSERS is a list
          npx playwright install $BROWSERS
          # shellcheck disable=SC2086
          if [ "$RUNNER_OS" = Linux ]; then .github/scripts/apt-retry.sh playwright-deps $BROWSERS; fi
      # No retries; --fail-on-flaky-tests fails the run if a config ever retries a test that then passes.
      - name: Corpus and chat UI
        timeout-minutes: 15
        env:
          CHAT_EDGE: ${{ runner.os == 'Windows' && '1' || '' }}
          PROJECTS: ${{ matrix.projects }}
        run: |
          # shellcheck disable=SC2086 # PROJECTS is a list of flags
          npx playwright test -c apps/viewer/test/chat/playwright.config.ts $PROJECTS --fail-on-flaky-tests
      - name: Results in the job summary
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          OS: ${{ matrix.os }}
        run: node .github/scripts/test-summary.mjs --title "Chat corpus and UI ($OS)" --playwright test-results/chat-ui.json
      - name: Upload the report and screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        continue-on-error: true
        timeout-minutes: 5
        with:
          name: rendering-${{ matrix.os }}
          path: |
            playwright-report/chat-ui/
            test-results/chat-ui/
            test-results/chat-ui.json
          if-no-files-found: warn
          retention-days: 30
      - uses: ./.github/actions/setup/save
        continue-on-error: true
        timeout-minutes: 3
        if: ${{ !cancelled() && (github.ref == 'refs/heads/main' || github.event_name == 'pull_request') }}
