name: e2e

# The Playwright suite (pipeline.yml test stage) on Ubuntu and macOS, split by tag rather than by
# --shard (sharding balances by file, which would put the heavy media files together):
# - media: the tests tagged @media (live video, P2P, the quality ladder, adaptive delay, attack);
# - ui: everything else (--grep-invert @media, so an untagged test still runs somewhere).
# Each group runs every project (Google Chrome, Firefox, WebKit) with workers: 1
# (playwright.config.ts). Windows browsers are covered by the Windows suites (_windows.yml).
on:
  workflow_call:

permissions:
  contents: read

env:
  FORCE_COLOR: '1'

jobs:
  e2e:
    name: ${{ matrix.group }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Monthly canary on ubuntu-latest, as for the node tests.
        os: ${{ fromJSON(github.event_name == 'schedule' && '["ubuntu-24.04","ubuntu-latest","macos-latest"]' || '["ubuntu-24.04","macos-latest"]') }}
        group: [ui, media]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Linux: the browsers' system libraries come from apt, cached as .debs per runner image and
      # Playwright version (package-lock.json).
      - uses: ./.github/actions/setup
        with:
          ffmpeg: 'true'
          apt-debs: ${{ runner.os == 'Linux' && format('playwright-{0}', hashFiles('package-lock.json')) || '' }}
      - uses: ./.github/actions/get-build
        with:
          names: web-dist
      - run: npm run fetch-bins
      # The Playwright version comes from package-lock.json. The `chromium` project runs Google
      # Chrome (channel: 'chrome', for H.264/AAC), which GitHub's runner images ship.
      - name: Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      # Ubuntu: Firefox and WebKit come from Playwright's CDN (cached per version). Their system
      # libraries come through apt-retry.sh (time-limited downloads, retries, mirror failover,
      # then an offline install), not `install-deps`, whose own apt calls have no limit (GitHub's
      # Ubuntu mirror has stalled `playwright install --with-deps` for 20+ minutes).
      # Saved on main only (end of the job), like the other caches.
      - name: Restore the Playwright browsers (Linux)
        if: runner.os == 'Linux'
        id: browsers
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}
      - name: Playwright browsers and their system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          npx playwright install firefox webkit
          .github/scripts/apt-retry.sh playwright-deps firefox webkit
      # macOS: the `chromium` project runs Google Chrome, so only Firefox and WebKit (macOS needs
      # no system libraries for them).
      - name: Playwright browsers (macOS)
        if: runner.os == 'macOS'
        run: npx playwright install firefox webkit
      - name: Playwright, ${{ matrix.group }} group
        env:
          GROUP: ${{ matrix.group }}
        run: |
          if [ "$GROUP" = media ]; then grep=(--grep @media); else grep=(--grep-invert @media); fi
          npx playwright test "${grep[@]}"
      # Kept for every run that was not cancelled, so a test that passed on retry (flaky) still
      # leaves its trace: the HTML report, results.json, traces, e2e-server.log, fake-obs.log.
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-${{ matrix.os }}-${{ matrix.group }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
      - name: Save the Playwright browsers (Linux, main)
        if: ${{ !cancelled() && runner.os == 'Linux' && github.ref == 'refs/heads/main' && steps.browsers.outputs.cache-hit != 'true' && matrix.group == 'ui' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}
      - uses: ./.github/actions/setup/save
        if: ${{ !cancelled() }}
