name: e2e

# The Playwright suite (pipeline.yml test stage) on Ubuntu and macOS, in three groups split by
# tag and file rather than by --shard (sharding balances by file count, which would put the heavy
# media files together). The three greps are exact complements: every test runs in one group.
# - media: the tests tagged @media (live video, P2P, the quality ladder, attack) except the files
#   in MEDIA_WITH_UI and CHAT_FILES;
# - chat: the files in CHAT_FILES, whatever their tag: the chat, its moderation, privacy and flood
#   (@media), the nickname rules, and the browser check of the join page;
# - ui: everything else: the untagged and @ui tests (so an untagged test or a new file still
#   runs somewhere) and the @media files in MEDIA_WITH_UI.
# Why three: with two groups (ui, media), the last 60 pipeline runs took 8.1-10.6 min (ui) and
# 6.4-7.1 (media) on Ubuntu, but 7.7-12.8 and 6.3-8.0 on macOS, and one macOS ui run hit the
# 13-minute limit 9 tests before the end: macOS runners differ by up to 2x on the UI tests (the
# media tests wait for measured windows, so they vary less). Per file, all three projects, on the
# slowest macOS runs: p2p 302-311 s, adaptive-delay 161, chat 99, chat-moderation-api 97, viewer
# 78, chat-moderation 60, chat-flood 59, branding-panel 54, quality 48-53, browser-check 43, the
# other eight files 10-30 each, so each group has 400-420 s of tests there.
# Playwright matches --grep against "<project> <file> <describe> <title> <tags>", so a file name
# can be part of the pattern. Each group runs every project (Google Chrome, Firefox, WebKit) with
# workers: 1 (playwright.config.ts). Windows: Google Chrome, Microsoft Edge and Firefox run the
# viewer chat UI here (chat-windows) and the app itself in the Windows suites (_windows.yml).
#
# No test is retried (retries: 0 in the configs); --fail-on-flaky-tests fails the run anyway if a
# config ever retries and a test passes only on its retry. Each Playwright run's results go to
# the job summary (.github/scripts/test-summary.mjs).
on:
  workflow_call:

permissions:
  contents: read
  actions: read # fetch-artifact's REST fallback reads this run's artifacts (.github/actions/fetch-artifact)

env:
  FORCE_COLOR: '1'
  MEDIA_WITH_UI: 'adaptive-delay\.spec'
  CHAT_FILES: '(chat|chat-flood|chat-moderation|chat-moderation-api|chat-privacy|nickname|browser-check)\.spec'

jobs:
  e2e:
    name: ${{ matrix.group }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Monthly canary on ubuntu-latest, as for the node tests.
        os: ${{ fromJSON(github.event_name == 'schedule' && '["ubuntu-24.04","ubuntu-latest","macos-latest"]' || '["ubuntu-24.04","macos-latest"]') }}
        group: [ui, chat, media]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      # A macOS VM can lose DNS for its first minute: in a 10x stability run actions/checkout's three
      # tries all failed with "Could not resolve host: github.com" (run 41283766285). Wait up to
      # 3 minutes for github.com before checking out (an infrastructure wait: workflows/README.md).
      - name: Wait for github.com (macOS)
        if: runner.os == 'macOS'
        timeout-minutes: 4
        shell: bash
        run: |
          start=$SECONDS
          for i in $(seq 1 36); do
            if curl -sS -o /dev/null --connect-timeout 5 --max-time 10 https://github.com; then
              [ "$i" = 1 ] || echo "::warning::github.com answered only after $((SECONDS - start)) s ($i tries)"
              exit 0
            fi
            sleep 5
          done
          echo "::warning::github.com still unreachable after $((SECONDS - start)) s; continuing"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Linux: the browsers' system libraries come from apt, cached as .debs per runner image and
      # Playwright version (package-lock.json).
      - uses: ./.github/actions/setup
        timeout-minutes: 8
        with:
          ffmpeg: 'true'
          apt-debs: ${{ runner.os == 'Linux' && format('playwright-{0}', hashFiles('package-lock.json')) || '' }}
      - uses: ./.github/actions/get-build
        timeout-minutes: 10
        with:
          names: web-dist
      - run: npm run fetch-bins
      # The Playwright version comes from package-lock.json. The `chromium` project runs Google
      # Chrome (channel: 'chrome', for H.264/AAC), which GitHub's runner images ship.
      - name: Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      # Ubuntu: Firefox and WebKit come from Playwright's CDN (cached per version). Their system
      # libraries come through apt-retry.sh (time-limited downloads, retries, mirror failover,
      # then an offline install), not `install-deps`, whose own apt calls have no limit (GitHub's
      # Ubuntu mirror has stalled `playwright install --with-deps` for 20+ minutes).
      # Saved on main only (end of the job), like the other caches.
      - name: Restore the Playwright browsers (Linux)
        if: runner.os == 'Linux'
        id: browsers
        # A time limit per try and one more try (the save step below is the job's reference to
        # actions/cache, whose restore code it runs).
        uses: ./.github/actions/cache-restore
        continue-on-error: true
        timeout-minutes: 4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}
      - name: Playwright browsers and their system libraries (Linux)
        timeout-minutes: 8
        if: runner.os == 'Linux'
        run: |
          npx playwright install firefox webkit
          .github/scripts/apt-retry.sh playwright-deps firefox webkit
      # macOS: the `chromium` project runs Google Chrome, so only Firefox and WebKit (macOS needs
      # no system libraries for them).
      - name: Playwright browsers (macOS)
        timeout-minutes: 8
        if: runner.os == 'macOS'
        run: npx playwright install firefox webkit
      # 13 minutes, a hang guard: about 7.2 min of tests per group on the slowest macOS runners seen
      # (55 %); the first runs of the three groups took 5.9/4.3/6.0 min (ui/chat/media) on Ubuntu
      # and 6.7/4.7/6.2 on macOS. A step that runs out fails, so the report and the logs are still
      # uploaded (a job that runs out is cancelled and uploads nothing).
      - name: Playwright, ${{ matrix.group }} group
        timeout-minutes: 13
        env:
          GROUP: ${{ matrix.group }}
          # Server-side coverage: every Node process writes its V8 coverage here when it exits.
          NODE_V8_COVERAGE: ${{ runner.temp }}/v8-e2e
        run: |
          case "$GROUP" in
            media) grep=(--grep @media --grep-invert "$MEDIA_WITH_UI|$CHAT_FILES") ;;
            chat) grep=(--grep "$CHAT_FILES") ;;
            ui) grep=(--grep "^(?!.*@media)|$MEDIA_WITH_UI" --grep-invert "$CHAT_FILES") ;;
            *) echo "::error::unknown e2e group $GROUP"; exit 1 ;;
          esac
          npx playwright test "${grep[@]}" --fail-on-flaky-tests
      # The e2e server's coverage (scripts/coverage/e2e-server.mjs keeps that process's files, c8
      # maps them onto the sources), its table in the job summary and this group's floors
      # (scripts/coverage/floors.json). Only after a passing run: a failed one covers less.
      - name: e2e server coverage
        env:
          GROUP: ${{ matrix.group }}
        run: |
          node scripts/coverage/e2e-server.mjs "$RUNNER_TEMP/v8-e2e"
          node scripts/coverage/report.mjs e2e-server --key "$GROUP" --check
      - name: Upload the e2e server coverage
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 5
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-e2e-server-${{ matrix.os }}-${{ matrix.group }}
          path: coverage/e2e-server/
          if-no-files-found: ignore
          retention-days: 14
      # The viewer chat UI against a mock hub (apps/viewer/test/chat: the built watch page, no
      # server, no network): every engine plus an iPhone in 1-2.5 minutes, so it rides along with
      # the chat group instead of a job of its own. The same flows against the real server are in
      # apps/server/test/e2e/chat.spec.ts.
      - name: Playwright, viewer chat UI (mock hub)
        if: ${{ !cancelled() && matrix.group == 'chat' }}
        timeout-minutes: 5
        run: npx playwright test -c apps/viewer/test/chat/playwright.config.ts --fail-on-flaky-tests
      - name: Results in the job summary
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          TITLE: Playwright, ${{ matrix.group }} group (${{ matrix.os }})
          CHAT: ${{ matrix.group == 'chat' && format('Viewer chat UI, mock hub ({0})', matrix.os) || '' }}
        run: |
          node .github/scripts/test-summary.mjs --title "$TITLE" --playwright test-results/results.json
          if [ -n "$CHAT" ]; then node .github/scripts/test-summary.mjs --title "$CHAT" --playwright test-results/chat-ui.json; fi
      # Kept for every run that was not cancelled (green ones too): the HTML report, results.json,
      # the traces and screenshots of failed tests, e2e-server.log, fake-obs.log.
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        continue-on-error: true
        timeout-minutes: 5
        with:
          name: playwright-${{ matrix.os }}-${{ matrix.group }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
      - name: Save the Playwright browsers (Linux, main)
        if: ${{ !cancelled() && runner.os == 'Linux' && github.ref == 'refs/heads/main' && steps.browsers.outputs.cache-hit != 'true' && matrix.group == 'ui' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        timeout-minutes: 3
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}
      - uses: ./.github/actions/setup/save
        continue-on-error: true
        timeout-minutes: 3
        if: ${{ !cancelled() && (github.ref == 'refs/heads/main' || github.event_name == 'pull_request') }}

  # The viewer chat UI against the mock hub on Windows, with Windows's own fonts and text shaping:
  # Google Chrome and Microsoft Edge from the runner image, Firefox from Playwright. Linux and
  # macOS run it in the chat group above; rendering.yml adds the screenshots and phone emulation.
  chat-windows:
    name: chat UI (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      # A macOS VM can lose DNS for its first minute: in a 10x stability run actions/checkout's three
      # tries all failed with "Could not resolve host: github.com" (run 41283766285). Wait up to
      # 3 minutes for github.com before checking out (an infrastructure wait: workflows/README.md).
      - name: Wait for github.com (macOS)
        if: runner.os == 'macOS'
        timeout-minutes: 4
        shell: bash
        run: |
          start=$SECONDS
          for i in $(seq 1 36); do
            if curl -sS -o /dev/null --connect-timeout 5 --max-time 10 https://github.com; then
              [ "$i" = 1 ] || echo "::warning::github.com answered only after $((SECONDS - start)) s ($i tries)"
              exit 0
            fi
            sleep 5
          done
          echo "::warning::github.com still unreachable after $((SECONDS - start)) s; continuing"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        timeout-minutes: 5
      - uses: ./.github/actions/get-build
        timeout-minutes: 10
        with:
          names: web-dist
      - name: Playwright Firefox
        timeout-minutes: 5
        run: npx playwright install firefox
      - name: Playwright, viewer chat UI (mock hub)
        timeout-minutes: 5
        env:
          CHAT_EDGE: '1'
        run: npx playwright test -c apps/viewer/test/chat/playwright.config.ts --project=chromium --project=firefox --project=edge --fail-on-flaky-tests
      - name: Results in the job summary
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: node .github/scripts/test-summary.mjs --title 'Viewer chat UI, mock hub (windows-latest)' --playwright test-results/chat-ui.json
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        continue-on-error: true
        timeout-minutes: 5
        with:
          name: playwright-windows-latest-chat
          path: |
            playwright-report/chat-ui/
            test-results/chat-ui/
            test-results/chat-ui.json
          if-no-files-found: ignore
          retention-days: 14
      - uses: ./.github/actions/setup/save
        continue-on-error: true
        timeout-minutes: 3
        if: ${{ !cancelled() && (github.ref == 'refs/heads/main' || github.event_name == 'pull_request') }}
