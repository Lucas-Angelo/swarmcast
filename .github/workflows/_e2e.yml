name: e2e

# The Playwright suite (pipeline.yml test stage) on Ubuntu and macOS, in four groups split by
# tag and file rather than by --shard (sharding balances by file count, which would put the heavy
# media files together). The four greps are exact complements: every test runs in one group.
# - chat: the files in CHAT_FILES, whatever their tag: the chat, its moderation, polls, privacy
#   and flood (@media), and the nickname rules;
# - live: the files in LIVE_FILES, whatever their tag: P2P, the adaptive delay, the stream start,
#   the attack shield and the browser check it turns on;
# - media: the other tests tagged @media (audio only, the quality ladder; a new @media file lands
#   here) and the @ui files in UI_WITH_MEDIA (the player's controls);
# - ui: everything else: the untagged and @ui tests (so an untagged test or a new file still
#   runs somewhere).
# Why four (2026-11-11): with three groups (ui, chat, media) and the 0.5.x specs, 111 pipeline
# runs of 2026-11-07 to 11-11 took p50/p90/max 13.0/15.7/17.8 min (ui), 10.7/12.9/14.0 (chat)
# and 16.1/16.8/17.6 (media) on macOS, up to 89 % of the 20-minute hang guard, and 11.3/12.7/14.4,
# 9.8/10.3/10.8 and 14.7/15.0/15.2 on Ubuntu: about 41 minutes of tests on macOS at p50, which no
# three groups fit at 60 % of the guard. Per file, all three projects, macOS p50 (max) in
# seconds: audio-only 485 (498), p2p 263 (284), chat 161 (194), adaptive-delay 154 (157),
# first-goto 134 (198), chat-moderation-api 126 (165), chat-moderation 125 (159), stream-start
# 99, viewer 96 (123), chat-polls 81 (111), player-controls 70 (80), quality 68, browser-check 56
# (70), chat-flood 55, the other 14 files 8-41 each. Replayed per run from those runs' own test
# times (each group's tests plus the step's own 20-30 s), the four groups take p50/p90/max on
# macOS 10.2/11.9/12.6 min (chat), 10.3/10.8/11.1 (live), 11.0/11.6/11.9 (media), 9.9/11.9/13.5
# (ui), and at most 10.2 on Ubuntu: p90 at 60 % of the guard or less, so a runner 1.5 times
# slower still ends by 18 minutes. macOS runners differ by up to 2x on the UI tests (the media
# tests wait for measured windows, so they vary less), hence the ui group's spread.
# Playwright matches --grep against "<project> <file> <describe> <title> <tags>", so a file name
# can be part of the pattern. Each group runs every project (Google Chrome, Firefox, WebKit) with
# workers: 1 (playwright.config.ts). Windows: Google Chrome, Microsoft Edge and Firefox run the
# viewer chat UI here (chat-windows) and the app itself in the Windows suites (_windows.yml).
#
# No test is retried (retries: 0 in the configs); --fail-on-flaky-tests fails the run anyway if a
# config ever retries and a test passes only on its retry. Each Playwright run's results go to
# the job summary (.github/scripts/test-summary.mjs).
#
# pipeline.yml calls it five times, so each macOS group can take its place in a macOS lane
# (README.md, "macOS concurrency"): Ubuntu with every group plus the Windows chat UI; then one
# call per macOS group (chat, live, media, ui), each after the job before it in its lane. Every call
# names its stage `e2e`, so the checks read `e2e / <group> (<runner>)` as before.
on:
  workflow_call:
    inputs:
      os:
        description: JSON list of the runners to run the groups on.
        type: string
        required: true
      groups:
        description: JSON list of the groups (ui, chat, live, media) to run on each of them.
        type: string
        default: '["ui","chat","live","media"]'
      chat-windows:
        description: Also run the viewer chat UI on Windows (the chat-windows job).
        type: boolean
        default: false

permissions:
  contents: read
  actions: read # fetch-artifact's REST fallback reads this run's artifacts (.github/actions/fetch-artifact)

env:
  FORCE_COLOR: '1'
  CHAT_FILES: '(chat|chat-flood|chat-moderation|chat-moderation-api|chat-polls|chat-privacy|nickname)\.spec'
  LIVE_FILES: '(p2p|adaptive-delay|stream-start|attack|browser-check)\.spec'
  UI_WITH_MEDIA: 'player-controls\.spec'

jobs:
  e2e:
    name: ${{ matrix.group }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # From pipeline.yml, with the monthly canary on ubuntu-latest, as for the node tests.
        os: ${{ fromJSON(inputs.os) }}
        group: ${{ fromJSON(inputs.groups) }}
    runs-on: ${{ matrix.os }}
    # Setup about 5 minutes, the group's Playwright step up to 20, the chat group's viewer chat UI
    # step up to 10, then the summary and coverage steps.
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      # A macOS VM can lose DNS for its first minute: in a 10x stability run actions/checkout's three
      # tries all failed with "Could not resolve host: github.com" (run 41283766285). Wait up to
      # 3 minutes for github.com before checking out (an infrastructure wait: workflows/README.md).
      - name: Wait for github.com (macOS)
        if: runner.os == 'macOS'
        timeout-minutes: 4
        shell: bash
        run: |
          start=$SECONDS
          for i in $(seq 1 36); do
            if curl -sS -o /dev/null --connect-timeout 5 --max-time 10 https://github.com; then
              [ "$i" = 1 ] || echo "::warning::github.com answered only after $((SECONDS - start)) s ($i tries)"
              exit 0
            fi
            sleep 5
          done
          echo "::warning::github.com still unreachable after $((SECONDS - start)) s; continuing"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Linux: the browsers' system libraries come from apt, cached as .debs per runner image and
      # Playwright version (package-lock.json).
      - uses: ./.github/actions/setup
        timeout-minutes: 8
        with:
          ffmpeg: 'true'
          apt-debs: ${{ runner.os == 'Linux' && format('playwright-{0}', hashFiles('package-lock.json')) || '' }}
      - uses: ./.github/actions/get-build
        timeout-minutes: 10
        with:
          names: web-dist
      - run: npm run fetch-bins
      # The Playwright version comes from package-lock.json. The `chromium` project runs Google
      # Chrome (channel: 'chrome', for H.264/AAC), which GitHub's runner images ship.
      - name: Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      # Ubuntu: Firefox and WebKit come from Playwright's CDN (cached per version). Their system
      # libraries come through apt-retry.sh (time-limited downloads, retries, mirror failover,
      # then an offline install), not `install-deps`, whose own apt calls have no limit (GitHub's
      # Ubuntu mirror has stalled `playwright install --with-deps` for 20+ minutes).
      # Saved on main only (end of the job), like the other caches.
      - name: Restore the Playwright browsers (Linux)
        if: runner.os == 'Linux'
        id: browsers
        # A time limit per try and one more try (the save step below is the job's reference to
        # actions/cache, whose restore code it runs).
        uses: ./.github/actions/cache-restore
        continue-on-error: true
        timeout-minutes: 4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}
      - name: Playwright browsers and their system libraries (Linux)
        timeout-minutes: 8
        if: runner.os == 'Linux'
        run: |
          npx playwright install firefox webkit
          .github/scripts/apt-retry.sh playwright-deps firefox webkit
      # macOS: the `chromium` project runs Google Chrome, so only Firefox and WebKit (macOS needs
      # no system libraries for them).
      - name: Playwright browsers (macOS)
        timeout-minutes: 8
        if: runner.os == 'macOS'
        run: npx playwright install firefox webkit
      # 20 minutes, a hang guard. The first runs of the three groups took 5.9/4.3/6.0 min
      # (ui/chat/media) on Ubuntu and 6.7/4.7/6.2 on macOS; with the 0.5.0 specs the old 13-minute
      # limit stopped a macOS media run 0.1 min after its last test passed (run 41543787536), and
      # with the 0.5.x specs three groups reached 89 % of this one (see the top of the file). The
      # four groups' p90 is at most 11.9 minutes on macOS and 10.2 on Ubuntu. A step that runs out
      # fails, so the report and the logs are still uploaded (a job that runs out is cancelled and
      # uploads nothing).
      - name: Playwright, ${{ matrix.group }} group
        id: e2e
        timeout-minutes: 20
        env:
          GROUP: ${{ matrix.group }}
          # Server-side coverage: every Node process writes its V8 coverage here when it exits.
          NODE_V8_COVERAGE: ${{ runner.temp }}/v8-e2e
        run: |
          case "$GROUP" in
            chat) grep=(--grep "$CHAT_FILES") ;;
            live) grep=(--grep "$LIVE_FILES") ;;
            media) grep=(--grep "@media|$UI_WITH_MEDIA" --grep-invert "$CHAT_FILES|$LIVE_FILES") ;;
            ui) grep=(--grep "^(?!.*@media)" --grep-invert "$CHAT_FILES|$LIVE_FILES|$UI_WITH_MEDIA") ;;
            *) echo "::error::unknown e2e group $GROUP"; exit 1 ;;
          esac
          npx playwright test "${grep[@]}" --fail-on-flaky-tests
      # The e2e server's coverage (scripts/coverage/e2e-server.mjs keeps that process's files, c8
      # maps them onto the sources), its table in the job summary and this group's floors
      # (scripts/coverage/floors.json). Only after a passing run: a failed one covers less.
      - name: e2e server coverage
        env:
          GROUP: ${{ matrix.group }}
        run: |
          node scripts/coverage/e2e-server.mjs "$RUNNER_TEMP/v8-e2e"
          node scripts/coverage/report.mjs e2e-server --key "$GROUP" --check
      - name: Upload the e2e server coverage
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 5
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-e2e-server-${{ matrix.os }}-${{ matrix.group }}
          path: coverage/e2e-server/
          if-no-files-found: ignore
          retention-days: 14
      # The viewer chat UI against a mock hub (apps/viewer/test/chat: the built watch page, no
      # server, no network): every engine plus an iPhone, so it rides along with the chat group
      # instead of a job of its own. The same flows against the real server are in
      # apps/server/test/e2e/chat.spec.ts. Two workers on every runner (its playwright.config.ts).
      # With the 0.5.x specs (326 tests) it took 3.1-5.3 minutes on Ubuntu with two, but 4.9-10.1
      # (p50 7.3, p90 8.4) on macOS, whose 3 CPUs gave Playwright's default a single worker: run
      # 43000767631 reached the 10-minute limit at test 301, every test passing, no gap over 12 s.
      # The macOS hosts with more CPUs, at two workers, took 2.4-3.2 (pipeline runs of 2026-11-07 to
      # 11-11). Ubuntu ran its tests 1.8 times faster than their summed durations at two workers, so
      # macOS should take about 4.3 (p50) to 6.5 (the slowest runner) minutes: the 10-minute limit,
      # a hang guard, keeps half again over the slowest.
      # Also after a failed e2e run, but not when a setup step failed (the binaries, the
      # browsers): then the e2e step never ran, and the failed step is the job's one error.
      - name: Playwright, viewer chat UI (mock hub)
        if: ${{ !cancelled() && matrix.group == 'chat' && (steps.e2e.outcome == 'success' || steps.e2e.outcome == 'failure') }}
        timeout-minutes: 10
        run: npx playwright test -c apps/viewer/test/chat/playwright.config.ts --fail-on-flaky-tests
      - name: Results in the job summary
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          TITLE: Playwright, ${{ matrix.group }} group (${{ matrix.os }})
          CHAT: ${{ matrix.group == 'chat' && format('Viewer chat UI, mock hub ({0})', matrix.os) || '' }}
        run: |
          node .github/scripts/test-summary.mjs --title "$TITLE" --playwright test-results/results.json
          if [ -n "$CHAT" ]; then node .github/scripts/test-summary.mjs --title "$CHAT" --playwright test-results/chat-ui.json; fi
      # Kept for every run that was not cancelled (green ones too): the HTML report, results.json,
      # the traces and screenshots of failed tests, e2e-server.log, fake-obs.log.
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        continue-on-error: true
        timeout-minutes: 5
        with:
          name: playwright-${{ matrix.os }}-${{ matrix.group }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
      # actions/cache/save from the copy fetched with git at its pin (the browsers' restore fetched
      # it already, as a rule): README.md, "Remote actions".
      - name: actions/cache (git fetch, with tries; Linux, main)
        id: cache-action
        if: ${{ !cancelled() && runner.os == 'Linux' && github.ref == 'refs/heads/main' && steps.browsers.outputs.cache-hit != 'true' && matrix.group == 'ui' }}
        timeout-minutes: 3
        uses: ./.github/actions/fetch-remote
        with:
          repos: actions/cache
          optional: 'true'
      - name: Save the Playwright browsers (Linux, main)
        if: ${{ !cancelled() && steps.cache-action.outputs.fetched == 'true' }}
        uses: ./.git/remote-actions/actions/cache/save
        continue-on-error: true
        timeout-minutes: 3
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}
      - uses: ./.github/actions/setup/save
        continue-on-error: true
        timeout-minutes: 3
        if: ${{ !cancelled() && (github.ref == 'refs/heads/main' || github.event_name == 'pull_request') }}

  # The viewer chat UI against the mock hub on Windows, with Windows's own fonts and text shaping:
  # Google Chrome and Microsoft Edge from the runner image, Firefox from Playwright. Linux and
  # macOS run it in the chat group above; rendering.yml adds the screenshots and phone emulation.
  chat-windows:
    name: chat UI (windows-latest)
    if: inputs.chat-windows
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      # A macOS VM can lose DNS for its first minute: in a 10x stability run actions/checkout's three
      # tries all failed with "Could not resolve host: github.com" (run 41283766285). Wait up to
      # 3 minutes for github.com before checking out (an infrastructure wait: workflows/README.md).
      - name: Wait for github.com (macOS)
        if: runner.os == 'macOS'
        timeout-minutes: 4
        shell: bash
        run: |
          start=$SECONDS
          for i in $(seq 1 36); do
            if curl -sS -o /dev/null --connect-timeout 5 --max-time 10 https://github.com; then
              [ "$i" = 1 ] || echo "::warning::github.com answered only after $((SECONDS - start)) s ($i tries)"
              exit 0
            fi
            sleep 5
          done
          echo "::warning::github.com still unreachable after $((SECONDS - start)) s; continuing"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        timeout-minutes: 5
      - uses: ./.github/actions/get-build
        timeout-minutes: 10
        with:
          names: web-dist
      - name: Playwright Firefox
        timeout-minutes: 5
        run: npx playwright install firefox
      # 2.2-3.9 minutes for the three browsers (runs 41526190584 to 41544935868); twice the slowest.
      - name: Playwright, viewer chat UI (mock hub)
        timeout-minutes: 8
        env:
          CHAT_EDGE: '1'
        run: npx playwright test -c apps/viewer/test/chat/playwright.config.ts --project=chromium --project=firefox --project=edge --fail-on-flaky-tests
      - name: Results in the job summary
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: node .github/scripts/test-summary.mjs --title 'Viewer chat UI, mock hub (windows-latest)' --playwright test-results/chat-ui.json
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        continue-on-error: true
        timeout-minutes: 5
        with:
          name: playwright-windows-latest-chat
          path: |
            playwright-report/chat-ui/
            test-results/chat-ui/
            test-results/chat-ui.json
          if-no-files-found: ignore
          retention-days: 14
      - uses: ./.github/actions/setup/save
        continue-on-error: true
        timeout-minutes: 3
        if: ${{ !cancelled() && (github.ref == 'refs/heads/main' || github.event_name == 'pull_request') }}
