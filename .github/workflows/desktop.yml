name: Desktop app

# The Tauri desktop app (apps/desktop, docs/DESKTOP.md):
# - rust: cargo fmt, clippy and the unit tests of apps/desktop/src-tauri on each OS;
# - build: the installers of every target, plus two throwaway-signed test builds (A and B,
#   accepting http:// update URLs) for the update test;
# - test: clean-machine tests of those installers on each OS (scripts/test/desktop/verify.mjs):
#   install, launch, panel login, autostart, kill (nothing left running), quit, the
#   uninstallers, and an update A -> B with the settings kept.
#
# Runs on pull requests and pushes to main (docs- and site-only changes skip it), monthly,
# manually, and from release.yml, which passes `release: true` and the updater signing key
# and publishes the tested installers, their .sig files and latest.json.
on:
  pull_request:
    paths-ignore: &app-paths-ignore
      - '**.md'
      - 'docs/**'
      - 'site/**'
  push:
    branches: [main]
    paths-ignore: *app-paths-ignore
  schedule:
    - cron: '7 7 1 * *'
  workflow_dispatch:
    inputs:
      screenshots:
        description: Also capture the Windows installer pages and app window for the website guide (artifact only).
        type: boolean
        default: false
  workflow_call:
    inputs:
      release:
        description: Release build (updater artifacts signed with TAURI_SIGNING_PRIVATE_KEY).
        type: boolean
        default: false
      version:
        description: Version to build (defaults to package.json).
        type: string
        default: ''
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        required: false
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: false

permissions:
  contents: read

# Superseded pull request runs are cancelled; runs on main, tags and schedules never are.
concurrency:
  group: desktop-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_COLOR: '1'
  CARGO_TERM_COLOR: always
  # Tauri v2 build prerequisites on Linux (WebKitGTK 4.1, tray, AppImage tooling).
  LINUX_BUILD_DEPS: build-essential pkg-config libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev file xz-utils

jobs:
  rust:
    name: Rust checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: apps/desktop/src-tauri
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          npm-ci: 'false'
      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install "$(sed -n 's/^channel *= *"\(.*\)"$/\1/p' rust-toolchain.toml)" --profile minimal --component rustfmt,clippy --no-self-update
      # Saved from main only: pull requests restore main's cache instead of each storing a copy
      # (the repository's 10 GB cache limit).
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apps/desktop/src-tauri -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      # TODO(WP2a): `apt-retry.sh download $LINUX_BUILD_DEPS` with the .deb cache once it exists.
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          "$GITHUB_WORKSPACE/.github/scripts/apt-retry.sh" update
          # shellcheck disable=SC2086 # a list of package names
          "$GITHUB_WORKSPACE/.github/scripts/apt-retry.sh" install -y --no-install-recommends $LINUX_BUILD_DEPS
      - name: cargo fmt
        if: runner.os == 'Linux'
        run: cargo fmt --check
      - name: cargo clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: cargo test
        run: cargo test --locked
      # Dependabot alert GHSA-wrw7-89jp-8q8g (glib 0.18, locked by Tauri 2's GTK 3 stack): not
      # exploitable while nothing compiled for Linux uses glib::VariantStrIter. This keeps it so.
      - name: glib advisory guard
        if: runner.os == 'Linux'
        working-directory: .
        run: node scripts/test/desktop/glib-advisory.mjs
      # Licences of the crates compiled into the app (this OS's target): fails on a crate with no
      # licence or one outside the allowed list, like the installer build does.
      - name: Crate licences
        working-directory: .
        run: node scripts/build/crate-licenses.mjs --check

  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: windows-x64, os: windows-latest }
          - { target: macos-arm64, os: macos-latest }
          # The last Intel macOS image GitHub offers.
          - { target: macos-x64, os: macos-15-intel }
          # The oldest supported Ubuntu (glibc): the .deb/.AppImage then run on newer ones too.
          - { target: linux-x64, os: ubuntu-22.04 }
          - { target: linux-arm64, os: ubuntu-22.04-arm }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install "$(sed -n 's/^channel *= *"\(.*\)"$/\1/p' apps/desktop/src-tauri/rust-toolchain.toml)" --profile minimal --no-self-update
      # Saved from main only (see the rust job). target/ holds the dependencies twice: for the
      # release profile and for the --fast test builds.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apps/desktop/src-tauri -> target
          key: ${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      # TODO(WP2a): `apt-retry.sh download $LINUX_BUILD_DEPS` with the .deb cache once it exists.
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          .github/scripts/apt-retry.sh update
          # shellcheck disable=SC2086 # a list of package names
          .github/scripts/apt-retry.sh install -y --no-install-recommends $LINUX_BUILD_DEPS

      - name: Version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: echo "VERSION=${INPUT_VERSION:-$(node -p "require('./package.json').version")}" >> "$GITHUB_ENV"
      - run: npm run build
      # The server sidecar and its resources (release/staging/<target>), as the script mode ships them.
      - name: Assemble release/staging/${{ matrix.target }}
        run: node scripts/build/package.mjs --target "$TARGET" --version "$VERSION" --no-archive

      # Update test builds: A (0.0.0-test.1) and B (0.0.0-test.2), signed with a key pair made
      # for this job only and trusting its public key, plus B's latest.json for a local server.
      # Only what the update test uses (macOS: the .app and its .app.tar.gz, no .dmg; Linux: the
      # AppImage), and --fast: no LTO, 16 codegen units, NSIS uncompressed.
      - name: Update test builds A and B (throwaway key)
        run: |
          case "$TARGET" in macos-*) bundles=app ;; linux-*) bundles=appimage ;; *) bundles=nsis ;; esac
          key="$RUNNER_TEMP/update-test.key"
          node node_modules/@tauri-apps/cli/tauri.js signer generate --ci --password test --write-keys "$key"
          TAURI_SIGNING_PRIVATE_KEY="$(cat "$key")"
          export TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD=test
          for v in 0.0.0-test.1 0.0.0-test.2; do
            node scripts/build/desktop.mjs --target "$TARGET" --version "$v" --bundles "$bundles" --fast \
              --insecure-updates --updater-pubkey "$key.pub"
            mkdir -p release/update-test
            mv "release/desktop/$TARGET" "release/update-test/$v"
          done
          node scripts/build/updater-manifest.mjs --version 0.0.0-test.2 --base-url http://127.0.0.1:47811 \
            --out release/update-test/0.0.0-test.2/latest.json release/update-test/0.0.0-test.2
          rm -f "$key" "$key.pub"

      # The real installers. Only release builds get the updater signing key (never pull
      # requests); other builds have no .sig files. macOS: desktop.mjs retries the .dmg step by
      # itself when hdiutil reports "Resource busy". Linux: it checks that the server bundled in
      # the .deb and the AppImage starts (--version).
      - name: Build the installers
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ inputs.release && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ inputs.release && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        run: node scripts/build/desktop.mjs --target "$TARGET" --version "$VERSION"
      - run: ls -la "release/desktop/$TARGET" release/update-test/*

      # The .app bundle stays out: the .dmg and the updater's .app.tar.gz carry it.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ matrix.target }}
          path: |
            release/desktop/${{ matrix.target }}/
            !release/**/SwarmCast.app/**
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: update-test-${{ matrix.target }}
          path: |
            release/update-test/
            !release/**/SwarmCast.app/**
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

  test:
    name: Clean-machine test ${{ matrix.target }} on ${{ matrix.os }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: windows-x64, os: windows-latest }
          - { target: macos-arm64, os: macos-latest }
          - { target: macos-x64, os: macos-15-intel }
          - { target: linux-x64, os: ubuntu-22.04 }
          - { target: linux-x64, os: ubuntu-24.04 }
          - { target: linux-arm64, os: ubuntu-24.04-arm }
    runs-on: ${{ matrix.os }}
    # Linux installs the .deb's dependencies through apt (that is part of the test), and
    # GitHub's Ubuntu mirror can be very slow: apt-retry.sh gives it time to try another mirror.
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    env:
      SC_DESKTOP_ARTIFACTS: ${{ github.workspace }}/desktop-test-logs
      SC_DESKTOP_SCREENSHOTS: ${{ inputs.screenshots && format('{0}/guide-screenshots', github.workspace) || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          npm-ci: 'false'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: desktop-${{ matrix.target }}
          path: release/desktop
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: update-test-${{ matrix.target }}
          path: release/update-test
      # The .deb pulls its own libraries. Those are downloaded here first (time limit per try,
      # retries, another mirror after a slow try), so the test's `apt-get install ./*.deb`
      # resolves and installs them from the local cache. Xvfb and D-Bus come with the image.
      # TODO(WP2a): `apt-retry.sh download` into the .deb cache, and APT_DEBS for verify.mjs.
      - name: Linux display and the .deb's dependencies
        if: runner.os == 'Linux'
        run: |
          command -v xvfb-run dbus-run-session
          .github/scripts/apt-retry.sh update
          deb="$(ls release/desktop/*.deb | head -n 1)"
          .github/scripts/apt-retry.sh install -y --no-install-recommends --download-only "./$deb"
      # Linux: a virtual display and a session bus (WebKitGTK and the tray talk D-Bus), without
      # the accessibility bridge and the DMA-BUF renderer (no GPU under Xvfb).
      - name: Install, launch, panel, autostart, kill, quit, uninstall, update A -> B
        run: |
          run=()
          if [ "$RUNNER_OS" = Linux ]; then
            export NO_AT_BRIDGE=1 WEBKIT_DISABLE_DMABUF_RENDERER=1
            run=(xvfb-run -a -s '-screen 0 1280x800x24' dbus-run-session --)
          fi
          "${run[@]}" node scripts/test/desktop/verify.mjs --installers release/desktop \
            --update-from release/update-test/0.0.0-test.1 --update-to release/update-test/0.0.0-test.2 --update-port 47811
      - name: Upload the app logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-test-logs-${{ matrix.target }}-${{ matrix.os }}
          path: desktop-test-logs/
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload the guide screenshots
        if: always() && inputs.screenshots && runner.os == 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: guide-screenshots-${{ matrix.target }}
          path: guide-screenshots/
          if-no-files-found: ignore
          retention-days: 7

  # The AppImage on a minimal host (scripts/test/desktop/appimage-host.sh): bare ubuntu:22.04 and
  # ubuntu:24.04 containers with only the libraries the install guide asks for. The runner
  # image above has Mesa, fonts and X already, so the clean-machine test cannot show a missing one.
  appimage-host:
    name: AppImage on a minimal host ${{ matrix.target }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-x64, os: ubuntu-24.04 }
          - { target: linux-arm64, os: ubuntu-24.04-arm }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      SC_DESKTOP_ARTIFACTS: ${{ github.workspace }}/appimage-host-logs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          npm-ci: 'false'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: desktop-${{ matrix.target }}
          path: release/desktop
      - name: Run the AppImage on ubuntu:22.04 and ubuntu:24.04
        run: scripts/test/desktop/appimage-host.sh release/desktop ubuntu:22.04 ubuntu:24.04
      - name: Upload the app logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: appimage-host-logs-${{ matrix.target }}
          path: appimage-host-logs/
          if-no-files-found: ignore
          retention-days: 14
