name: Desktop app

# The Tauri desktop app (apps/desktop, docs/DESKTOP.md):
# - rust: cargo fmt, clippy and the unit tests of apps/desktop/src-tauri on each OS;
# - build: the installers of every target, plus two throwaway-signed test builds (A and B,
#   accepting http:// update URLs) for the update test;
# - test: clean-machine tests of those installers on each OS (scripts/test/desktop/verify.mjs):
#   install, launch, panel login, autostart, kill (nothing left running), quit, the
#   uninstallers, and an update A -> B with the settings kept.
#
# Runs on pull requests and pushes to main (docs- and site-only changes skip it), monthly,
# manually, and from release.yml, which passes `release: true` and the updater signing key
# and publishes the tested installers, their .sig files and latest.json.
on:
  pull_request:
    paths-ignore: &app-paths-ignore
      - '**.md'
      - 'docs/**'
      - 'site/**'
  push:
    branches: [main]
    paths-ignore: *app-paths-ignore
  schedule:
    - cron: '7 7 1 * *'
  workflow_dispatch:
    inputs:
      screenshots:
        description: Also capture the Windows installer pages and app window for the website guide (artifact only).
        type: boolean
        default: false
  workflow_call:
    inputs:
      release:
        description: Release build (updater artifacts signed with TAURI_SIGNING_PRIVATE_KEY).
        type: boolean
        default: false
      version:
        description: Version to build (defaults to package.json).
        type: string
        default: ''
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        required: false
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: false

permissions:
  contents: read

# Superseded pull request runs are cancelled; runs on main, tags and schedules never are.
concurrency:
  group: desktop-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_COLOR: '1'
  CARGO_TERM_COLOR: always
  # Tauri v2 build prerequisites on Linux (WebKitGTK 4.1, tray, AppImage tooling).
  LINUX_BUILD_DEPS: build-essential pkg-config libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev file xz-utils

jobs:
  rust:
    name: Rust checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: apps/desktop/src-tauri
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          npm-ci: 'false'
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy --no-self-update && rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apps/desktop/src-tauri -> target
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          echo "$LINUX_BUILD_DEPS" | xargs sudo apt-get install -y --no-install-recommends
      - name: cargo fmt
        if: runner.os == 'Linux'
        run: cargo fmt --check
      - name: cargo clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: cargo test
        run: cargo test --locked
      # Licences of the crates compiled into the app (this OS's target): fails on a crate with no
      # licence or one outside the allowed list, like the installer build does.
      - name: Crate licences
        working-directory: .
        run: node scripts/build/crate-licenses.mjs --check

  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: windows-x64, os: windows-latest }
          - { target: macos-arm64, os: macos-latest }
          # The last Intel macOS image GitHub offers.
          - { target: macos-x64, os: macos-15-intel }
          # The oldest supported Ubuntu (glibc): the .deb/.AppImage then run on newer ones too.
          - { target: linux-x64, os: ubuntu-22.04 }
          - { target: linux-arm64, os: ubuntu-22.04-arm }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal --no-self-update && rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apps/desktop/src-tauri -> target
          key: ${{ matrix.target }}
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          echo "$LINUX_BUILD_DEPS" | xargs sudo apt-get install -y --no-install-recommends

      - name: Version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: echo "VERSION=${INPUT_VERSION:-$(node -p "require('./package.json').version")}" >> "$GITHUB_ENV"
      - run: npm run build
      # The server sidecar and its resources (release/staging/<target>), as the script mode ships them.
      - name: Assemble release/staging/${{ matrix.target }}
        run: node scripts/build/package.mjs --target "$TARGET" --version "$VERSION" --no-archive

      # Update test builds: A (0.0.0-test.1) and B (0.0.0-test.2), signed with a key pair made
      # for this job only and trusting its public key, plus B's latest.json for a local server.
      # macOS: hdiutil sometimes cannot eject the new DMG ("Resource busy"), so one retry there.
      - name: Update test builds A and B (throwaway key)
        run: |
          build() { node scripts/build/desktop.mjs "$@" || { [ "$RUNNER_OS" = macOS ] && node scripts/build/desktop.mjs "$@"; }; }
          key="$RUNNER_TEMP/update-test.key"
          node node_modules/@tauri-apps/cli/tauri.js signer generate --ci --password test --write-keys "$key"
          TAURI_SIGNING_PRIVATE_KEY="$(cat "$key")"
          export TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD=test
          for v in 0.0.0-test.1 0.0.0-test.2; do
            build --target "$TARGET" --version "$v" --insecure-updates --updater-pubkey "$key.pub"
            mkdir -p release/update-test
            mv "release/desktop/$TARGET" "release/update-test/$v"
          done
          node scripts/build/updater-manifest.mjs --version 0.0.0-test.2 --base-url http://127.0.0.1:47811 \
            --out release/update-test/0.0.0-test.2/latest.json release/update-test/0.0.0-test.2
          rm -f "$key" "$key.pub"

      # The real installers. Only release builds get the updater signing key (never pull
      # requests); other builds have no .sig files.
      - name: Build the installers
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ inputs.release && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ inputs.release && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        run: |
          build() { node scripts/build/desktop.mjs "$@" || { [ "$RUNNER_OS" = macOS ] && node scripts/build/desktop.mjs "$@"; }; }
          build --target "$TARGET" --version "$VERSION"
      - run: ls -la "release/desktop/$TARGET" release/update-test/*

      # The .app bundle stays out: the .dmg and the updater's .app.tar.gz carry it.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ matrix.target }}
          path: |
            release/desktop/${{ matrix.target }}/
            !release/**/SwarmCast.app/**
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: update-test-${{ matrix.target }}
          path: |
            release/update-test/
            !release/**/SwarmCast.app/**
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

  test:
    name: Clean-machine test ${{ matrix.target }} on ${{ matrix.os }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: windows-x64, os: windows-latest }
          - { target: macos-arm64, os: macos-latest }
          - { target: macos-x64, os: macos-15-intel }
          - { target: linux-x64, os: ubuntu-22.04 }
          - { target: linux-x64, os: ubuntu-24.04 }
          - { target: linux-arm64, os: ubuntu-24.04-arm }
    runs-on: ${{ matrix.os }}
    # Linux installs the .deb's dependencies through apt (that is part of the test), and
    # GitHub's Ubuntu mirror can be very slow: apt-retry.sh gives it time to try another mirror.
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    env:
      SC_DESKTOP_ARTIFACTS: ${{ github.workspace }}/desktop-test-logs
      SC_DESKTOP_SCREENSHOTS: ${{ inputs.screenshots && format('{0}/guide-screenshots', github.workspace) || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          npm-ci: 'false'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: desktop-${{ matrix.target }}
          path: release/desktop
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: update-test-${{ matrix.target }}
          path: release/update-test
      # The app window needs a display; the .deb pulls its own libraries. Those are downloaded
      # here first (time limit per try, retries, another mirror after a slow try), so the
      # test's `apt-get install ./*.deb` resolves and installs them from the local cache.
      - name: Linux display and the .deb's dependencies
        if: runner.os == 'Linux'
        run: |
          .github/scripts/apt-retry.sh update
          .github/scripts/apt-retry.sh install -y --no-install-recommends xvfb
          deb="$(ls release/desktop/*.deb | head -n 1)"
          .github/scripts/apt-retry.sh install -y --no-install-recommends --download-only "./$deb"
      - name: Install, launch, panel, autostart, kill, quit, uninstall, update A -> B
        run: |
          run=()
          if [ "$RUNNER_OS" = Linux ]; then run=(xvfb-run -a); fi
          "${run[@]}" node scripts/test/desktop/verify.mjs --installers release/desktop \
            --update-from release/update-test/0.0.0-test.1 --update-to release/update-test/0.0.0-test.2 --update-port 47811
      - name: Upload the app logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-test-logs-${{ matrix.target }}-${{ matrix.os }}
          path: desktop-test-logs/
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload the guide screenshots
        if: always() && inputs.screenshots && runner.os == 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: guide-screenshots-${{ matrix.target }}
          path: guide-screenshots/
          if-no-files-found: ignore
          retention-days: 7
