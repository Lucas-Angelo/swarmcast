name: Pre-release check

# "Clean machine" verification of a real package on every supported desktop OS: builds the
# package, installs it with the real start script into an empty data folder, streams a
# synthetic OBS feed, watches with Google Chrome (Playwright), checks P2P, kick, link
# rotation, "Stop everything", quitting, no leftover process/port, and playback through a
# real Cloudflare quick tunnel. See scripts/test/preflight/verify.mjs.
#
# Runs on pull requests and pushes to main (docs- and site-only changes skip it), monthly,
# manually, and as a gate of release.yml.
on:
  pull_request:
    paths-ignore: &app-paths-ignore
      - '**.md'
      - 'docs/**'
      - 'site/**'
  push:
    branches: [main]
    paths-ignore: *app-paths-ignore
  schedule:
    - cron: '27 6 1 * *'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# Superseded pull request runs are cancelled; runs on main, tags and schedules never are.
concurrency:
  group: preflight-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_COLOR: '1'

jobs:
  preflight:
    name: ${{ matrix.target }} on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: windows-x64, os: windows-latest }
          - { target: macos-arm64, os: macos-latest }
          # The last Intel macOS image GitHub offers.
          - { target: macos-x64, os: macos-15-intel }
          - { target: linux-x64, os: ubuntu-latest }
          - { target: linux-x64, os: ubuntu-22.04 }
    runs-on: ${{ matrix.os }}
    # Ubuntu's apt and `playwright install --with-deps` alone have taken 13–22 min on runners.
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          go: 'true'
          ffmpeg: 'true'
      # No Playwright browser download: verify.mjs --chrome drives the Google Chrome that the
      # x64 runner images ship (on Windows, `install --with-deps` also installed Media Foundation:
      # 204 s of a 6.8 min job, for nothing).
      - run: npm run build
      - name: Build tray helper
        run: node apps/tray/build.mjs --target "${{ matrix.target }}" --vendor
      - name: Build the real package
        run: node scripts/build/package.mjs --target "${{ matrix.target }}"
      - name: Assemble a local release folder
        run: |
          cp scripts/start-linux.sh scripts/start-macos.command scripts/start-windows.ps1 scripts/start-windows.cmd release/
          cp scripts/start-macos.command release/start-macos.sh
          node scripts/build/checksums.mjs release
          ls -la release
      - name: Clean-machine check (install, stream, watch, P2P, kick, stop, tunnel)
        run: node scripts/test/preflight/verify.mjs --release-dir release --tunnel --chrome
