name: CI

# Lint, typecheck, build, unit, integration and E2E tests on Windows, macOS and Linux.
# Runs on every pull request and push to main (docs- and site-only changes skip it), monthly
# (catches rot: dead downloads, runner image changes), manually, and as a gate of release.yml.
on:
  pull_request:
    paths-ignore: &app-paths-ignore
      - '**.md'
      - 'docs/**'
      - 'site/**'
  push:
    branches: [main]
    paths-ignore: *app-paths-ignore
  schedule:
    - cron: '17 6 1 * *'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# Superseded pull request runs are cancelled; runs on main, tags and schedules never are.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_COLOR: '1'

jobs:
  checks:
    name: Lint, typecheck, build, unit tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # `npm test` also runs the website's unit tests (site/test/unit), which need its packages.
      - name: Install the website's dependencies
        run: npm ci --prefix site --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  integration:
    name: Integration tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          ffmpeg: 'true'
      # Downloads MediaMTX and cloudflared for the host into vendor/<target>/ and verifies
      # them against the SHA-256 values pinned in scripts/build/versions.json.
      - run: npm run fetch-bins
      - run: npm run build
      # Lifecycle tests that rely on POSIX signals skip themselves on Windows.
      - run: npm run test:integration

  e2e:
    name: E2E (Playwright, ${{ matrix.os }})
    # Windows browsers (Chrome, Edge, Firefox) are covered by windows.yml.
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu runs inside the official Playwright image: browsers and their system
          # libraries are preinstalled, so the job needs no apt (GitHub's Ubuntu mirror has
          # stalled `playwright install --with-deps` for 20+ minutes). The image version must
          # be the @playwright/test version in package-lock.json (checked below). Its bundled
          # Chromium plays H.264/AAC on Linux (scripts/test/docker/codec-probe.mjs), and Google
          # Chrome is not in it, so the chromium project runs without `channel: 'chrome'`.
          - os: ubuntu-latest
            container: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
            playwright: '1.64.1'
            chromium-channel: ''
          - os: macos-latest
            container: ''
            playwright: ''
            chromium-channel: chrome
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    timeout-minutes: 45
    env:
      PW_CHROMIUM_CHANNEL: ${{ matrix.chromium-channel }}
    steps:
      # The container runs as root, but GitHub mounts a HOME owned by the runner user, and
      # Firefox refuses to start as root in another user's home (Playwright's CI docs).
      - name: HOME for root (container)
        if: matrix.container != ''
        run: echo "HOME=/root" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          ffmpeg: 'true'
      - run: npm run fetch-bins
      - run: npm run build
      - name: The Playwright image matches package-lock.json
        if: matrix.container != ''
        run: |
          locked="$(node -p "require('@playwright/test/package.json').version")"
          if [ "$locked" != "${{ matrix.playwright }}" ]; then
            echo "::error file=.github/workflows/ci.yml::@playwright/test is $locked but the E2E image is v${{ matrix.playwright }}: update the image tag and digest"
            exit 1
          fi
      # macOS: the Playwright version comes from package-lock.json. The `chromium` project runs
      # Google Chrome (channel: 'chrome', for H.264/AAC), which GitHub's runner images ship.
      - if: matrix.container == ''
        run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-${{ matrix.os }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  audit:
    name: npm audit (production dependencies)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          npm-ci: 'false'
      # Reads package-lock.json; fails on high or critical advisories in runtime dependencies.
      - run: npm audit --omit=dev --audit-level=high

  tray:
    name: Tray helper (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          go: 'true'
          npm-ci: 'false'
      - run: node apps/tray/build.mjs
      - name: go vet
        working-directory: apps/tray
        run: go vet ./...

  binaries:
    name: Upstream binaries up to date
    # Reports MediaMTX/cloudflared releases newer than the pins in scripts/build/versions.json.
    # SwarmCast ships pinned, verified versions on purpose, so a newer release is only a warning
    # on pull requests, main and releases; the monthly scheduled run fails (the rot alarm). It
    # never opens PRs: run `node scripts/build/update-binaries.mjs` locally to apply the update.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          npm-ci: 'false'
      - name: Check for newer MediaMTX / cloudflared releases
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -o pipefail
          status=0
          node scripts/build/update-binaries.mjs --check 2>&1 | tee binaries.txt || status=$?
          {
            echo '## Upstream binaries'
            echo
            echo '```'
            cat binaries.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then
            if [ "$GITHUB_EVENT_NAME" = schedule ]; then exit "$status"; fi
            echo "::warning title=Upstream binaries::Newer MediaMTX/cloudflared releases exist (see the job summary); run node scripts/build/update-binaries.mjs to update the pins."
          fi
