name: CI

# Lint, typecheck, build, unit, integration and E2E tests on Windows, macOS and Linux.
# Runs on every pull request and push to main (docs- and site-only changes skip it), monthly
# (catches rot: dead downloads, runner image changes), manually, and as a gate of release.yml.
on:
  pull_request:
    paths-ignore: &app-paths-ignore
      - '**.md'
      - 'docs/**'
      - 'site/**'
  push:
    branches: [main]
    paths-ignore: *app-paths-ignore
  schedule:
    - cron: '17 6 1 * *'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# Superseded pull request runs are cancelled; runs on main, tags and schedules never are.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_COLOR: '1'

jobs:
  checks:
    name: Lint, typecheck, build, unit tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  integration:
    name: Integration tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          ffmpeg: 'true'
      # Downloads MediaMTX and cloudflared for the host into vendor/<target>/ and verifies
      # them against the SHA-256 values pinned in scripts/build/versions.json.
      - run: npm run fetch-bins
      - run: npm run build
      # Lifecycle tests that rely on POSIX signals skip themselves on Windows.
      - run: npm run test:integration

  e2e:
    name: E2E (Playwright, ${{ matrix.os }})
    # Windows browsers (Chrome, Edge, Firefox) are covered by windows.yml.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          ffmpeg: 'true'
      - run: npm run fetch-bins
      - run: npm run build
      # The Playwright version comes from package-lock.json. The `chromium` project runs
      # Google Chrome (channel: 'chrome', for H.264/AAC), which GitHub's runner images ship.
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-${{ matrix.os }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  audit:
    name: npm audit (production dependencies)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          npm-ci: 'false'
      # Reads package-lock.json; fails on high or critical advisories in runtime dependencies.
      - run: npm audit --omit=dev --audit-level=high

  tray:
    name: Tray helper (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          go: 'true'
          npm-ci: 'false'
      - run: node apps/tray/build.mjs
      - name: go vet
        working-directory: apps/tray
        run: go vet ./...

  binaries:
    name: Upstream binaries up to date
    # Monthly / manual report only: fails when MediaMTX/cloudflared have newer releases than
    # the pins in scripts/build/versions.json. It never opens PRs; run
    # `node scripts/build/update-binaries.mjs` locally to apply the update.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          npm-ci: 'false'
      - name: Check for newer MediaMTX / cloudflared releases
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -o pipefail
          status=0
          node scripts/build/update-binaries.mjs --check 2>&1 | tee binaries.txt || status=$?
          {
            echo '## Upstream binaries'
            echo
            echo '```'
            cat binaries.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
